openapi: 3.1.1
info:
  title: JavaScript 웹 게임 플랫폼 핵심 API 계획
  version: 0.1.0-plan
  description: '구현 전 검토용 계약. P0 G1은 기본 게임·무가입 플레이·자동 guest·Google 연결·지표, P1 G2는 제작자 업로드·출시. 전체 서비스 API가 아니며 배포된
    endpoint가 아니다. 브라우저 변경 요청은 session cookie와 CSRF token을 함께 검사하고 Origin도 검증한다. 최초 analytics bootstrap은 users 행
    없는 수집 전용 권한이며 게임/저장 인가에 재사용할 수 없다. OAuth는 서버 authorization-code + state/nonce/S256 PKCE. 공식 사양: https://spec.openapis.org/oas/v3.1.1.html'
servers:
- url: https://playhub.example.com/api/v1
  description: 설명용 예약 domain. 실제 운영 URL 아님.
tags:
- name: Catalog
- name: Identity
- name: Play
- name: Progress
- name: Metrics
- name: Publishing
paths:
  /games:
    get:
      operationId: listGames
      summary: 로그인 없이 게임 목록 조회
      tags:
      - Catalog
      x-stage: P0 G1
      security: []
      responses:
        '200':
          description: 공개·enabled·미차단 게임만
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameList'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
      - name: locale
        in: query
        required: false
        schema:
          enum:
          - ko
          - en
          default: ko
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 512
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 24
    post:
      operationId: createUploadGame
      summary: 제작자 업로드 프로젝트 생성
      tags:
      - Publishing
      x-stage: P1 G2
      security:
      - SessionCookie: []
        CsrfToken: []
      responses:
        '201':
          description: draft 프로젝트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSummary'
        '403':
          description: 초대 자격 또는 팀 역할 부족
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCreate'
  /games/{gameId}:
    get:
      operationId: getGame
      summary: 로그인 없이 게임 상세 조회
      tags:
      - Catalog
      x-stage: P0 G1
      security: []
      responses:
        '200':
          description: 공개 상세 DTO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSummary'
        '404':
          description: 없거나 공개 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
      - name: locale
        in: query
        required: false
        schema:
          enum:
          - ko
          - en
          default: ko
      description: SSR·metadata와 같은 projection을 사용한다. 미공개 운영 필드는 제외한다.
  /games/{gameId}/launch-descriptor:
    get:
      operationId: getPublicLaunchDescriptor
      summary: 쿠키 없이 공개 기본 게임 실행 위치 조회
      tags:
      - Play
      x-stage: P0 G1
      security: []
      responses:
        '200':
          description: 권한 없는 정적 실행 위치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicLaunchDescriptor'
          headers:
            Cache-Control:
              schema:
                const: no-store
        '404':
          description: 공개 활성 build 없음 또는 중지됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
      description: 인증·guest·analytics cookie가 없어도 호출 가능. 서버가 catalog enabled, 공개 active build, 승인/차단 상태를 조회마다 검사.
        build별 origin의 entryUrl만 반환하며 preview·서명 grant·계정 token 없음. cookie/guest 발급 실패 시 포털은 같은 sandbox로 이 URL을
        로드하고 SDK를 로컬 모드로 전환한다. 서버 저장·점수·개인 데이터 접근 권한은 부여하지 않는다.
  /session:
    get:
      operationId: getSession
      summary: 현재 익명 또는 계정 상태 확인
      tags:
      - Identity
      x-stage: P0 G1
      security: []
      responses:
        '200':
          description: 회원 가입을 요구하지 않는 최소 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/ErrorResponse'
      description: '상태 조회만으로 guest principal을 만들 필요는 없다. 응답은 Cache-Control: no-store. Google 연결 후 표시 상태를 재조회한다.'
  /guest-sessions:
    post:
      operationId: createGuestSession
      summary: 브라우저 자동 guest 발급
      tags:
      - Identity
      x-stage: P0 G1
      security: []
      responses:
        '201':
          description: guest와 CSRF token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          headers:
            Set-Cookie:
              description: __Host-session=<opaque>; Secure; HttpOnly; SameSite=Lax; Path=/. Domain 없음. 예시 값만 설명한다.
              schema:
                type: string
        '200':
          description: 기존 유효 guest/등록 session 재사용
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              required: []
              additionalProperties: false
      description: Origin 및 Fetch Metadata 검사, rate limit을 적용한다. 기존 등록 session을 guest로 덮어쓰지 않는다. 서버가 새 opaque cookie를
        발급하며 client의 session ID를 받지 않는다. 같은 방문의 유효한 analytics cookie가 있으면 허용된 동의 범위에서 분석 subject를 서버가 연결하고 첫 플레이를
        중복 신규 사용자로 세지 않는다. 분석 cookie가 없거나 차단되어도 guest 플레이/저장을 허용한다.
  /auth/google/start:
    get:
      operationId: startGoogleLogin
      summary: Google 로그인 시작
      tags:
      - Identity
      x-stage: P0 G1
      security: []
      responses:
        '302':
          description: 서버가 만든 OAuth authorization URL로 이동
          headers:
            Location:
              schema:
                type: string
                format: uri
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: returnTo
        in: query
        required: false
        schema:
          type: string
          maxLength: 500
          pattern: ^/(?!/)
      description: P0는 검증된 서버 OIDC authorization-code 라이브러리를 사용. 일회용 state·nonce·S256 PKCE verifier를 서버에 보관하고 로그인
        시도와 연결. returnTo는 상대경로 allowlist만 허용. GIS IDtoken 직접POST 방식과 혼용하지 않으며 로그인만으로 과거 guest 분석 연결에 동의한 것으로 간주하지
        않는다.
  /auth/google/callback:
    get:
      operationId: googleCallback
      summary: Google callback 검증
      tags:
      - Identity
      x-stage: P0 G1
      security: []
      responses:
        '302':
          description: 검증 완료 또는 안전한 오류 화면으로 이동
          headers:
            Set-Cookie:
              description: __Host-session=<opaque>; Secure; HttpOnly; SameSite=Lax; Path=/. Domain 없음. 예시 값만 설명한다.
              schema:
                type: string
            Location:
              schema:
                type: string
        '400':
          description: 유효하지 않은 state·nonce·code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: state
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 2048
      - name: code
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 4096
      - name: error
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 128
      description: code와 error 중 하나만 수락. state 일치·만료·1회 소비를 검사하고 서버의 S256 PKCE verifier로 code를 교환. IDtoken 서명·issuer·audience·nonce·expiry
        검증 후 provider subject로 계정 연결. code·IDtoken은 로그에서 마스킹하고 query 없는 주소로 이동. 플랫폼/분석 session token은 URL에 넣지 않는다.
        session을 회전하고 기존 계정 충돌은 pending merge로 남긴다.
  /account/guest-merge:
    post:
      operationId: mergeGuestProgress
      summary: 명시 동의로 guest 저장 연결
      tags:
      - Identity
      x-stage: P0 G1
      security:
      - SessionCookie: []
        CsrfToken: []
      responses:
        '200':
          description: 연결 결과 또는 해결할 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestMergeResult'
        '409':
          description: 변경된 저장 또는 병합 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: 같은 actor·작업·키의 재시도는 같은 결과. 다른 body면 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestMergeRequest'
      description: registered principal만. 서버에 저장된 mergeOperationId가 현재 계정과 검증된 source guest에 연결되었는지 검사. 저장 이동 동의와
        분석 이력 연결 동의를 분리한다.
  /auth/logout:
    post:
      operationId: logout
      summary: 현재 session 종료
      tags:
      - Identity
      x-stage: P0 G1
      security:
      - SessionCookie: []
        CsrfToken: []
      responses:
        '204':
          description: cookie와 session 폐기
        default:
          $ref: '#/components/responses/ErrorResponse'
      description: 부모 SDK port와 미전송 저장 queue의 actor를 함께 정리. 필요 시 다음 플레이에서 새 guest를 발급한다.
  /games/{gameId}/play-sessions:
    post:
      operationId: createPlaySession
      summary: guest 또는 회원의 실행 session 발급
      tags:
      - Play
      x-stage: P0 G1
      security:
      - SessionCookie: []
        CsrfToken: []
      responses:
        '201':
          description: 공개 활성 build와 SDK 권한
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaySession'
        '403':
          description: 게임 중지 또는 실행 불가
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: 같은 actor·작업·키의 재시도는 같은 결과. 다른 body면 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaySessionRequest'
      description: 포털이 자동 guest를 준비하므로 사용자에게 로그인 벽이 없다. game/build/principal은 서버에서 선택. 클릭·노출 연결은 게임 일치와 30분 attribution
        정책 검사.
  /play-sessions/{sessionId}/saves/{slot}:
    get:
      operationId: getSaveSlot
      summary: guest 또는 회원 저장 읽기
      tags:
      - Progress
      x-stage: P0 G1
      security:
      - SessionCookie: []
      responses:
        '200':
          description: 현재 저장
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveSlot'
          headers:
            ETag:
              description: '저장 revision. 예: "r7"'
              schema:
                type: string
        '404':
          description: 아직 없는 슬롯
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
      - name: slot
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
      description: 같은 principal의 유효 session과 storage capability 검사. 다른 game의 저장 namespace를 client가 선택할 수 없다.
    put:
      operationId: writeSaveSlot
      summary: revision 조건으로 저장
      tags:
      - Progress
      x-stage: P0 G1
      security:
      - SessionCookie: []
        CsrfToken: []
      responses:
        '200':
          description: 갱신된 저장 또는 동일 멱등 요청의 기존 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveSlot'
          headers:
            ETag:
              description: '저장 revision. 예: "r7"'
              schema:
                type: string
        '201':
          description: 처음 생성한 저장
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveSlot'
          headers:
            ETag:
              description: '저장 revision. 예: "r7"'
              schema:
                type: string
        '409':
          description: 같은 Idempotency-Key의 다른 body 또는 조건
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: revision 불일치 또는 최초 생성 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 256KiB payload 한도 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '428':
          description: 조건 header 누락
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
      - name: slot
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: 같은 actor·작업·키의 재시도는 같은 결과. 다른 body면 409.
      - name: If-Match
        in: header
        required: false
        schema:
          type: string
          pattern: ^"r[0-9]+"$
        description: 기존 slot 수정의 revision ETag.
      - name: If-None-Match
        in: header
        required: false
        schema:
          const: '*'
        description: 새 slot 최초 생성. If-Match와 정확히 하나 사용.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveWrite'
      description: 두 조건 header 동시 사용은 400. guest도 가능. 최대 10개 slot. SDK requestId를 Idempotency-Key로 전달하고 principal/game/slot
        범위·body/조건 hash를 비교한다. 인가 후 동일 요청 완료 기록이 있으면 기존 결과를 반환하여 응답 유실 재시도가 재쓰기를 만들지 않게 한다. 실제 경쟁은 412이며 새 revision으로
        몰래 재전송하지 않는다.
  /analytics/bootstrap:
    post:
      operationId: createAnalyticsBootstrap
      summary: 회원 또는 guest 생성 없는 방문 수집 session 준비
      tags:
      - Metrics
      x-stage: P0 G1
      security: []
      responses:
        '200':
          description: 수집 허용 여부와 수집 전용 CSRF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsBootstrap'
          headers:
            Set-Cookie:
              description: 수집 허용 시에만 __Host-analytics=<opaque>; Secure; HttpOnly; SameSite=Lax; Path=/. Domain 없음.
                token을 JSON·query·로그에 반환하지 않음.
              schema:
                type: string
        '429':
          description: 남용 제한
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsBootstrapRequest'
      description: 동일 출처 Origin·Fetch Metadata·빈도·수집 동의 정책을 검사. users 행과 게임 권한을 만들지 않는다. 허용 시 서버 난수의 HttpOnly analytics
        cookie를 발급하며 denied/undecided는 적용 정책에 따라 collection_disabled. cookie token과 subject는 JSON·URL·iframe에 노출하지
        않는다. session은 TTL과 목적 제한을 갖고 analytics/events에만 유효하다.
  /analytics/events:
    post:
      operationId: ingestAnalyticsEvents
      summary: 포털과 SDK 이벤트 batch 수집
      tags:
      - Metrics
      x-stage: P0 G1
      security:
      - SessionCookie: []
        CsrfToken: []
      - AnalyticsCookie: []
        CsrfToken: []
      responses:
        '202':
          description: 중복 제거와 수락 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsReceipt'
        '403':
          description: 수집 전용 권한으로 gameplay 이벤트 또는 동의 밖 수집 시도
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 본문 64KiB 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 이벤트 계약 위반
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 수집 빈도 제한
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
        default:
          $ref: '#/components/responses/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./analytics_events.schema.json#/$defs/ClientEventBatch
      description: 플랫폼 cookie+그 CSRF 또는 analytics cookie+그 CSRF 중 유효한 한 쌍을 사용하며 서로 섞지 않는다. analytics 전용 권한은 impression/card
        click/detail/play click/search 이벤트만 허용. SDK gameplay는 플랫폼 session과 play session actor/game/build 검증 필수.
        서버가 subject_id·received_at·동의·source·test 상태를 결정하고 raw client subject는 거부. guest 생성 때 같은 방문 analytics subject를
        허용된 동의 범위에서 서버 연결. 10초/60초는 서버 1회 파생. 미동의·차단은 플레이/저장을 막지 않는다.
  /admin/metrics/retention:
    get:

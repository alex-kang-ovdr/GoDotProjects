      security:
      - SessionCookie: []
      responses:
        '200':
          description: 연결된 분자·분모와 빠른 클릭
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunnelReport'
        '403':
          description: 운영 지표 권한 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Asia/Seoul 현지 날짜.
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Asia/Seoul 현지 날짜.
      - name: scopeType
        in: query
        required: true
        schema:
          enum:
          - platform
          - game
      - name: scopeId
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        description: game scope는 game ID 필수, platform scope는 platform.
      - name: placementId
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 64
      description: 동일 기간·scope·placement를 분자와 분모에 적용. 중복 impression 클릭은 1회. 외부 직접 유입을 내부 CTR 노출로 만들지 않는다.
  /internal/catalog-syncs:
    post:
      operationId: syncBuiltinCatalog
      summary: 기본 게임 catalog 검증과 projection 갱신
      tags:
      - Catalog
      x-stage: P0 G1
      security:
      - CiBearer: []
      responses:
        '200':
          description: 검증·적용 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSyncResult'
        '422':
          description: ID 중복·path·manifest·hash 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: 같은 actor·작업·키의 재시도는 같은 결과. 다른 body면 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogSyncRequest'
      description: CI 전용 audience·scope 검사. 저장된 snapshot을 기준으로 staging 검증 후 원자적 projection 전환. 실패 시 이전 공개 catalog
        유지. title을 DB에서 임의 원본 수정하지 않는다. enabled=false는 노출·새 실행을 중지하되 저장은 삭제하지 않는다.
  /games/{gameId}/upload-sessions:
    post:
      operationId: createUploadSession
      summary: 격리 ZIP 업로드 세션 생성
      tags:
      - Publishing
      x-stage: P1 G2
      security:
      - SessionCookie: []
        CsrfToken: []
      responses:
        '201':
          description: 격리 객체 업로드 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: 같은 actor·작업·키의 재시도는 같은 결과. 다른 body면 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      description: 초대된 팀 editor/owner만. builtin source는 거부. URL은 만료 전 재사용 가능하므로 검수 시 version/hash snapshot을 별도로
        고정한다.
  /upload-sessions/{uploadId}/complete:
    post:
      operationId: completeUpload
      summary: 실제 객체 확인 후 검사 등록
      tags:
      - Publishing
      x-stage: P1 G2
      security:
      - SessionCookie: []
        CsrfToken: []
      responses:
        '202':
          description: 고정한 build 검사 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildStatus'
        '409':
          description: 객체 미완료·변경·세션 상태 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: uploadId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: 같은 actor·작업·키의 재시도는 같은 결과. 다른 body면 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              required: []
              additionalProperties: false
      description: client가 주장한 완료만 믿지 않는다. 실제 version/size/hash를 고정하고 격리 worker job 등록. public artifact 덮어쓰기 금지.
  /games/{gameId}/publications:
    post:
      operationId: publishGameBuild
      summary: 승인된 build를 공개
      tags:
      - Publishing
      x-stage: P1 G2
      security:
      - SessionCookie: []
        CsrfToken: []
      responses:
        '201':
          description: release pointer와 event 확정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationResult'
        '409':
          description: revision·승인·제재 상태 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: 같은 actor·작업·키의 재시도는 같은 결과. 다른 body면 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationRequest'
      description: 팀 출시 권한. 같은 game의 ready·approved·미차단 build만 허용. DB pointer/event/outbox를 같은 트랜잭션으로 기록. 검색 반영은
        별도 상태.
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
      description: HttpOnly Secure SameSite=Lax Path=/, Domain 없음. guest/registered principal을 서버가 조회.
    AnalyticsCookie:
      type: apiKey
      in: cookie
      name: __Host-analytics
      description: HttpOnly Secure SameSite=Lax Path=/, Domain 없음. users 행 없는 수집 전용 방문 session. analytics/events의
        포털 탐색 이벤트만 허용하며 저장·플레이 세션·계정 권한으로 사용할 수 없다.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 서버 session에 바인딩. 변경 요청은 Cookie와 AND 조건. 게임 iframe에는 직접 전달하지 않음.
    CiBearer:
      type: http
      scheme: bearer
      bearerFormat: short-lived service credential
      description: catalog sync 전용 CI identity. 사용자 계정 cookie와 공유하지 않음.
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
        message:
          type: string
          minLength: 1
          maxLength: 500
        requestId:
          type: string
          minLength: 1
          maxLength: 128
        retryable:
          type: boolean
        fieldErrors:
          type: array
          maxItems: 50
          items:
            type: object
            properties:
              field:
                type: string
                minLength: 1
                maxLength: 128
              code:
                type: string
                minLength: 1
                maxLength: 64
            required:
            - field
            - code
            additionalProperties: false
      required:
      - code
      - message
      - requestId
      - retryable
      additionalProperties: false
    Session:
      type: object
      properties:
        kind:
          enum:
          - anonymous
          - guest
          - registered
        displayName:
          type:
          - string
          - 'null'
          maxLength: 100
        csrfToken:
          type:
          - string
          - 'null'
          maxLength: 256
        canCreateGames:
          type: boolean
        pendingGuestMergeOperationId:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
      required:
      - kind
      - displayName
      - csrfToken
      - canCreateGames
      additionalProperties: false
      description: 게임 iframe에 전체 응답을 전달하지 않는다.
    AnalyticsBootstrapRequest:
      type: object
      properties:
        consentChoice:
          enum:
          - granted
          - denied
          - undecided
        policyVersion:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - consentChoice
      - policyVersion
      additionalProperties: false
      description: 서버가 유효 정책·지역·선택을 확인하며 client의 subject 또는 계정 ID를 받지 않는다. 선택적 분석이 허용되지 않으면 identifier를 발급하지 않는다.
    AnalyticsBootstrap:
      type: object
      properties:
        status:
          enum:
          - active
          - collection_disabled
        csrfToken:
          type:
          - string
          - 'null'
          maxLength: 256
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
        policyVersion:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - status
      - csrfToken
      - expiresAt
      - policyVersion
      additionalProperties: false
      description: users 행 없는 방문 수집 session. subject와 bearer cookie 값은 응답 JSON에 없음. csrfToken은 포털 메모리에서만 사용하며 iframe·query·분석
        속성에 넣지 않는다.
    GameSummary:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        catalogId:
          type:
          - string
          - 'null'
          maxLength: 128
        slug:
          type: string
          minLength: 1
          maxLength: 128
        title:
          type: string
          minLength: 1
          maxLength: 160
        summary:
          type: string
          minLength: 1
          maxLength: 500
        sourceKind:
          enum:
          - builtin
          - upload
        locale:
          enum:
          - ko
          - en
        coverUrl:
          type: string
          format: uri
        supportedInputs:
          type: array
          items:
            enum:
            - keyboard
            - mouse
            - touch
            - gamepad
        canPlay:
          type: boolean
      required:
      - id
      - catalogId
      - slug
      - title
      - summary
      - sourceKind
      - locale
      - supportedInputs
      - canPlay
      additionalProperties: false
    GameList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GameSummary'
        nextCursor:
          type:
          - string
          - 'null'
          maxLength: 512
      required:
      - items
      - nextCursor
      additionalProperties: false
    GuestMergeRequest:
      type: object
      properties:
        mergeOperationId:
          type: string
          format: uuid
        mergeSavedProgress:
          const: true
        linkAnalyticsHistory:
          type: boolean
        choices:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              gameId:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
              slot:
                type: string
                minLength: 1
                maxLength: 64
              action:
                enum:
                - keep_account
                - keep_guest_in_new_slot
                - replace_account
              expectedAccountRevision:
                type:
                - integer
                - 'null'
                minimum: 0
            required:
            - gameId
            - slot
            - action
            - expectedAccountRevision
            additionalProperties: false
      required:
      - mergeOperationId
      - mergeSavedProgress
      - linkAnalyticsHistory
      - choices
      additionalProperties: false
      description: operation은 OAuth 과정에서 확인한 source guest와 현재 target 계정에 서버가 연결한다. 임의 source user ID를 받지 않는다.
    GuestMergeResult:
      type: object
      properties:
        operationId:
          type: string
          format: uuid
        status:
          enum:
          - completed
          - needs_resolution
        conflictCount:
          type: integer
          minimum: 0
        analyticsHistoryLinked:
          type: boolean
      required:
      - operationId
      - status
      - conflictCount
      - analyticsHistoryLinked
      additionalProperties: false
    PlaySessionRequest:
      type: object
      properties:
        clickId:
          type: string
          format: uuid
        impressionId:
          type: string
          format: uuid
        acquisitionSource:
          enum:
          - organic_search
          - external_referral
          - direct
          - internal_home
          - internal_search
          - continue_play
          - other
        requestedLocale:
          enum:
          - ko
          - en
      required:
      - acquisitionSource
      additionalProperties: false
    PlaySession:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        gameId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        buildId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        entryUrl:
          type: string
          format: uri
        expectedOrigin:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        capabilities:
          type: array
          uniqueItems: true
          items:
            enum:
            - lifecycle
            - storage
            - casual_score
            - telemetry
        saveSchemaVersion:
          type: integer
          minimum: 1
      required:
      - id
      - gameId
      - buildId
      - entryUrl
      - expectedOrigin
      - expiresAt
      - capabilities
      - saveSchemaVersion
      additionalProperties: false
      description: id는 계정 bearer token이 아니다. 서버가 cookie의 principal과 일치 여부를 매 요청 검사한다.
    PublicLaunchDescriptor:
      type: object
      properties:
        entryUrl:
          type: string
          format: uri
        buildOrigin:
          type: string
          format: uri
      required:
      - entryUrl
      - buildOrigin
      additionalProperties: false
      description: 공개 active build의 정적 실행 위치만 제공. token·play session·저장·점수·계정 권한은 포함하지 않는다.
    SaveWrite:
      type: object
      properties:
        payload:
          type: object
          additionalProperties: true
      required:
      - payload
      additionalProperties: false
      description: payload의 JSON UTF-8 바이트가 262144 이하인지 서버가 검사. owner/game/schema는 play session에서 결정.
    SaveSlot:
      type: object
      properties:
        slot:
          type: string
          minLength: 1
          maxLength: 64
        schemaVersion:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 1
        payload:
          type: object
          additionalProperties: true
        updatedAt:
          type: string
          format: date-time
      required:
      - slot
      - schemaVersion
      - revision
      - payload
      - updatedAt
      additionalProperties: false
    ScoreSubmission:
      type: object
      properties:
        boardId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        runId:
          type: string
          format: uuid
        score:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      required:
      - boardId
      - runId
      - score
      additionalProperties: false
      description: board·game·season·범위·중복 run을 서버가 검증하지만 client 점수 진위는 보장하지 않는다.
    ScoreResult:
      type: object
      properties:
        submissionId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        classification:
          const: unverified
        status:
          enum:
          - accepted
          - quarantined
          - rejected
      required:
      - submissionId
      - classification
      - status
      additionalProperties: false
    AnalyticsReceipt:
      type: object
      properties:
        acceptedEventIds:
          type: array
          items:
            type: string
            format: uuid
        duplicateEventIds:
          type: array
          items:
            type: string
            format: uuid
        rejected:
          type: array
          items:
            type: object
            properties:
              eventId:
                type: string
                format: uuid
              code:
                type: string
                minLength: 1
                maxLength: 64
            required:
            - eventId
            - code
            additionalProperties: false
      required:
      - acceptedEventIds
      - duplicateEventIds
      - rejected
      additionalProperties: false
    RetentionRow:
      type: object
      properties:
        reportLevel:
          enum:
          - cohort
          - weighted_summary
        scopeType:
          enum:
          - platform
          - game
        scopeId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        cohortDate:
          type:
          - string
          - 'null'
          format: date
        dayNumber:
          enum:
          - 1
          - 7
          - 30
        eligible:
          type: boolean
        cohortSize:
          type: integer
          minimum: 0
        eligibleSubjects:
          type: integer
          minimum: 0
        retainedSubjects:
          type:
          - integer
          - 'null'
          minimum: 0
        retentionRate:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        matureAt:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - reportLevel
      - scopeType
      - scopeId
      - cohortDate
      - dayNumber
      - eligible
      - cohortSize
      - eligibleSubjects
      - retainedSubjects
      - retentionRate
      - matureAt
      additionalProperties: false
    RetentionReport:
      type: object
      properties:
        asOf:
          type: string
          format: date-time
        timezone:
          const: Asia/Seoul
        identityProjectionVersion:
          type: string
          minLength: 1
          maxLength: 64
        dataSnapshotId:
          type: string
          minLength: 1
          maxLength: 128
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RetentionRow'
      required:
      - asOf
      - timezone
      - identityProjectionVersion
      - dataSnapshotId
      - rows
      additionalProperties: false
    FunnelReport:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        timezone:
          const: Asia/Seoul
        scopeType:
          enum:
          - platform
          - game
        scopeId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        impressions:
          type: integer
          minimum: 0
        clickedImpressions:
          type: integer
          minimum: 0
        fastClicksWithoutImpression:
          type: integer
          minimum: 0
        ctr:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        playSessions:
          type: integer
          minimum: 0
        readySessions:
          type: integer
          minimum: 0
        active10sSessions:
          type: integer
          minimum: 0
        active60sSessions:
          type: integer
          minimum: 0
        impressionsWithActive10s:
          type: integer
          minimum: 0
        impressionsWithActive60s:
          type: integer
          minimum: 0
        qptr60:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
      required:
      - from
      - to
      - timezone
      - scopeType
      - scopeId
      - impressions
      - clickedImpressions
      - fastClicksWithoutImpression
      - ctr
      - playSessions
      - readySessions
      - active10sSessions
      - active60sSessions
      - impressionsWithActive10s
      - impressionsWithActive60s
      - qptr60
      additionalProperties: false
      description: CTR은 연결된 고유 가시 노출 클릭 / 고유 가시 노출. 외부 직접 유입과 빠른 클릭은 별도. QPTR60=impressionsWithActive60s/impressions.
    CatalogSyncRequest:
      type: object
      properties:
        snapshotId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        sourceCommit:
          type: string
          pattern: ^(?:[a-f0-9]{40}|[a-f0-9]{64})$
        catalogHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        entries:
          $ref: ./catalog.schema.json#/properties/entries
      required:
      - snapshotId
      - sourceCommit
      - catalogHash
      - entries
      additionalProperties: false
      description: 'entries는 원본 catalog.schema의 동일 스키마를 참조한다: 1~1000개, 영문자로 시작하는 소문자/숫자 단어의 하이픈 연결, path=games/+id.
        ID/경로별 유일성과 정확한 path 일치는 별도 CI 검사. snapshotId는 신뢰된 CI artifact 등록 단계에서 발급하며 임의 외부 URL fetch는 하지 않는다.'
    CatalogSyncResult:
      type: object
      properties:
        syncId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        state:
          enum:
          - validated
          - applied
          - rejected
        sourceCommit:
          type: string
          minLength: 1
          maxLength: 64
        updatedGames:
          type: integer
          minimum: 0
      required:
      - syncId
      - state
      - sourceCommit
      - updatedGames
      additionalProperties: false
    GameCreate:
      type: object
      properties:
        teamId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        slug:
          type: string
          minLength: 1
          maxLength: 128
        title:
          type: string
          minLength: 1
          maxLength: 160
        summary:
          type: string
          minLength: 1
          maxLength: 500
        locale:
          enum:
          - ko
          - en
      required:
      - teamId
      - slug
      - title
      - summary
      - locale
      additionalProperties: false
    UploadRequest:
      type: object
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 240
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 104857600
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
      - fileName
      - sizeBytes
      - sha256
      additionalProperties: false
      description: 클라이언트 hash는 주장값. 검사 전 실제 snapshot의 hash와 version을 확인한다.
    UploadSession:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        uploadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        maxSizeBytes:
          const: 104857600
      required:
      - id
      - uploadUrl
      - expiresAt
      - maxSizeBytes
      additionalProperties: false
      description: uploadUrl은 로그/분석에서 마스킹한다. 단일 사용 URL이라고 가정하지 않는다.
    BuildStatus:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        gameId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        processingStatus:
          enum:
          - quarantined
          - validating
          - failed
          - ready
        reviewStatus:
          enum:
          - pending
          - approved
          - rejected
      required:
      - id
      - gameId
      - processingStatus
      - reviewStatus
      additionalProperties: false
    PublicationRequest:
      type: object
      properties:
        buildId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        expectedGameRevision:
          type: integer
          minimum: 0
        releaseNotes:
          type: string
          maxLength: 5000
      required:
      - buildId
      - expectedGameRevision
      additionalProperties: false
    PublicationResult:
      type: object
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        gameId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        activeBuildId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        revision:
          type: integer
          minimum: 1
        indexState:
          enum:
          - pending
          - updated
      required:
      - eventId
      - gameId
      - activeBuildId
      - revision
      - indexState
      additionalProperties: false
  responses:
    ErrorResponse:
      description: 표준 오류. 비밀·내부 stack·signed URL 없음.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

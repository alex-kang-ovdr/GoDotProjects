            application/json:
              schema:
                $ref: '#/components/schemas/RetentionReport'
        '403':
          description: 운영 지표 권한 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Asia/Seoul 현지 날짜.
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
        description: Asia/Seoul 현지 날짜.
      - name: scopeType
        in: query
        required: true
        schema:
          enum:
          - platform
          - game
      - name: scopeId
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
        description: game scope는 game ID 필수, platform scope는 platform.
      description: 운영자 인가 필수. KST target date 종료+24시간 뒤 eligible. 미성숙 비율은 null. 가중 합계는 eligible 분자 합/분모 합. 원시 subject
        목록은 반환하지 않는다. specs/retention_query.sql 참조.
  /admin/metrics/funnel:
    get:

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FAF8FF" />
  <title>PlayForge Store — 오픈 게임 에셋</title>
  <link rel="stylesheet" href="./store.css" />
</head>
<body>
  <div class="store-shell">
    <!-- Sticky Light Header -->
    <header class="topbar">
      <div class="topbar-row1">
        <a href="#store-top" class="brand-group" id="store-top">
          <span class="brand-icon" aria-hidden="true">❖</span>
          <span class="brand-text">
            <span class="brand-badge">PlayForge Asset Store</span>
            <span class="brand-sub">오픈 게임 에셋</span>
          </span>
        </a>

        <!-- Wide Central Search Bar -->
        <form class="central-search" role="search" onsubmit="return false;">
          <span class="search-glyph" aria-hidden="true">⌕</span>
          <input id="search-input" type="search" placeholder="에셋 이름, 제작자, 태그 검색..." aria-label="에셋 검색" />
          <span class="engine-chip has-tooltip" tabindex="0" data-tooltip="Godot 4.3 이상과 PlayForge 웹 에디터(4.7.2)에서 바로 사용할 수 있습니다.">Godot 4.7+</span>
        </form>

        <!-- Primary Tabs + Utility Badges -->
        <div class="topbar-right">
          <div class="tabs" role="tablist" aria-label="스토어 주요 탭">
            <button type="button" class="tab active" role="tab" data-tab="browse" aria-selected="true">탐색</button>
            <button type="button" class="tab" role="tab" data-tab="library" aria-selected="false">내 라이브러리 <span class="count-badge" id="library-count">0</span></button>
            <button type="button" class="tab" role="tab" data-tab="publisher" aria-selected="false">게시자</button>
          </div>
          <span class="topbar-divider" aria-hidden="true"></span>
          <div class="identity-bar">
            <span class="sso-pill" id="sso-badge">creator-demo</span>
            <span class="mode-pill" id="connection-badge" data-mode="static">오프라인</span>
            <a class="hub-link-btn" id="hub-home-link" href="/">PLAY HUB</a>
            <a class="hub-link-btn" id="forge-home-link" href="/forge/OfficialGodot/">PlayForge</a>
          </div>
        </div>
      </div>

      <!-- Row 2: Horizontal Category Nav -->
      <nav class="category-bar" aria-label="에셋 카테고리">
        <div class="category-bar-inner">
          <div class="category-pills" id="category-pills">
            <button type="button" class="cat-pill active" data-cat="all">전체 에셋</button>
          </div>
          <button type="button" class="info-tip-chip has-tooltip" data-tooltip="웹, Windows, Linux, macOS의 PlayForge 에디터에서 설치할 수 있습니다. (모바일 앱 제외)">PC · Web 지원 <span aria-hidden="true">ⓘ</span></button>
        </div>
      </nav>
    </header>

    <!-- Main Store Content -->
    <main class="store-main">
      <!-- Featured Spotlight Hero (Visible on Browse tab when unfiltered) -->
      <section class="spotlight-hero" id="spotlight-hero" aria-label="추천 에셋"></section>

      <!-- Split: Left Faceted Filters + Right Catalog & Detail -->
      <div class="workspace" id="store-workspace">
        <!-- Left Faceted Filter Sidebar -->
        <aside class="filter-sidebar" id="browse-controls" aria-label="에셋 필터">
          <div class="filter-head">
            <h2>필터</h2>
            <button type="button" class="text-reset-btn" id="reset-filters-btn">초기화</button>
          </div>

          <div class="filter-group">
            <label class="filter-label" for="category-filter">카테고리</label>
            <select id="category-filter" aria-label="카테고리 필터">
              <option value="all">전체 카테고리</option>
            </select>
          </div>

          <div class="filter-group">
            <label class="filter-label" for="kind-filter">유형</label>
            <select id="kind-filter" aria-label="유형 필터">
              <option value="all">전체</option>
              <option value="package">설치 가능 에셋</option>
              <option value="editorial">가이드 · 외부 링크</option>
            </select>
          </div>

          <div class="filter-group">
            <div class="filter-label-row">
              <label class="filter-label" for="tier-filter">사용 조건</label>
              <button type="button" class="info-tip has-tooltip" aria-label="사용 조건 안내" data-tooltip="모든 에셋은 상업적 게임 제작에 사용할 수 있습니다. 출처 표기 필요 여부에 따라 구분됩니다.">ⓘ</button>
            </div>
            <select id="tier-filter" aria-label="사용 조건 필터">
              <option value="all">전체</option>
            </select>
          </div>

          <div class="filter-group">
            <div class="filter-label-row">
              <label class="filter-label" for="license-filter">라이선스</label>
              <button type="button" class="info-tip has-tooltip" aria-label="라이선스 안내" data-tooltip="CC0는 출처 없이 자유 사용, MIT·CC-BY는 제작자 출처 표기 시 상업적 사용 가능합니다. 카드 배지에 마우스를 올리면 상세 안내가 표시됩니다.">ⓘ</button>
            </div>
            <select id="license-filter" aria-label="라이선스 필터">
              <option value="all">전체 라이선스</option>
            </select>
          </div>

          <div class="filter-group">
            <div class="filter-label-row">
              <label class="filter-label" for="ai-filter">AI 사용 여부</label>
              <button type="button" class="info-tip has-tooltip" aria-label="AI 사용 여부 안내" data-tooltip="생성형 AI를 사용하지 않은 것으로 확인된 에셋만 필터링합니다.">ⓘ</button>
            </div>
            <select id="ai-filter" aria-label="AI 사용 여부 필터">
              <option value="all">전체</option>
              <option value="no-ai">No AI (AI 미사용)</option>
            </select>
          </div>

          <div class="filter-group">
            <label class="filter-label" for="source-filter">출처</label>
            <select id="source-filter" aria-label="출처 필터">
              <option value="all">전체 출처</option>
            </select>
          </div>

          <div class="filter-group">
            <span class="filter-label">인기 태그</span>
            <div class="tag-cloud" id="tag-bar" aria-label="인기 태그 필터"></div>
          </div>

          <div class="filter-group">
            <span class="filter-label">지원 환경</span>
            <div class="platform-chip-group">
              <span class="plat-chip">Web</span>
              <span class="plat-chip">Windows</span>
              <span class="plat-chip">Linux</span>
              <span class="plat-chip">macOS</span>
            </div>
          </div>
        </aside>

        <!-- Right Main Catalog + Detail Column -->
        <section class="catalog-column" aria-label="목록 및 상세 영역">
          <!-- Results Count & Sort Bar -->
          <div class="results-bar" id="results-bar">
            <div class="results-bar-left">
              <strong id="results-count">총 0개 에셋</strong>
              <button type="button" class="info-tip-chip has-tooltip" data-tooltip="웹에서는 내 라이브러리에만 저장되며, 실제 설치는 PlayForge 에디터에서 무결성 검증 후 적용됩니다.">설치 안내 <span aria-hidden="true">ⓘ</span></button>
            </div>
            <div class="results-bar-right">
              <label for="sort-select">정렬:</label>
              <select id="sort-select" aria-label="정렬 기준">
                <option value="default">인기순</option>
                <option value="version">최신순</option>
                <option value="title">이름순</option>
              </select>
            </div>
          </div>

          <!-- Asset Card Grid (Browse / My Library) -->
          <div id="catalog-list" class="card-grid"></div>

          <!-- Pagination Bar (Visible when total_pages > 1) -->
          <nav id="pagination-bar" class="pagination-bar hidden" aria-label="에셋 페이지 이동"></nav>

          <!-- Publisher Drafts List -->
          <div id="publisher-panel" class="publisher-list hidden"></div>

          <!-- Selected Asset Detail Panel -->
          <aside class="detail-pane" id="detail-pane" aria-label="에셋 상세 정보"></aside>
        </section>
      </div>
    </main>

    <footer class="store-attribution-bar" aria-label="오픈 에셋 출처">
      <span>오픈 에셋 출처:</span>
      <a href="https://polyhaven.com/" target="_blank" rel="noopener noreferrer">Poly Haven</a>
      <span>·</span>
      <a href="https://ambientcg.com/" target="_blank" rel="noopener noreferrer">ambientCG</a>
      <span>·</span>
      <a href="https://godotengine.org/asset-library/asset" target="_blank" rel="noopener noreferrer">Godot Asset Library</a>
      <span>·</span>
      <a href="https://game-icons.net/" target="_blank" rel="noopener noreferrer">Game-Icons.net</a>
    </footer>
  </div>

  <script type="module" src="./store.js"></script>
</body>
</html>

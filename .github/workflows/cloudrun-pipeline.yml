name: PlayHub & PlayForge Cloud Run Pipeline

on:
  push:
    branches:
      - PlayHub-Platform
    paths-ignore:
      - 'docs/**'
      - 'references/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      action:
        description: '실행 작업 선택'
        required: true
        default: 'deploy-dev'
        type: choice
        options:
          - deploy-dev
          - publish-stage
          - promote-qa
          - promote-live
          - rollback
          - prune-ar
      target:
        description: '대상 컴포넌트'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - hub
          - forge
      image_tag:
        description: '승격할 불변 이미지 태그 또는 SHA (promote-qa / promote-live 시 지정)'
        required: false
        default: ''
      canary_percent:
        description: 'Live 카나리 트래픽 비율 (10 / 50 / 100)'
        required: false
        default: '100'
      rollback_revision:
        description: '롤백 대상 Cloud Run 리비전명 (rollback 시 지정)'
        required: false
        default: ''
      rollback_env:
        description: '롤백 대상 환경 (dev / live)'
        required: false
        default: 'live'
      update_policy:
        description: '업데이트 정책 선택 (optional=선업 / force=강업)'
        required: false
        default: 'optional'
        type: choice
        options:
          - optional
          - force
      force_targets:
        description: '강업 대상 타깃 (예: all, hub, forge-web, aos,ios — 비우면 update_policy=force 시 배포 대상 자동 적용)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

env:
  REGION: us-west1
  ARTIFACT_REPO: us-west1-docker.pkg.dev/playhub-dev-2611/playhub-containers
  DEV_HUB_PROJECT: playhub-dev-2611
  DEV_FORGE_PROJECT: forge-dev-2611
  # Browser-facing origins served by Firebase Hosting in front of playhub-hub.
  # Hub (PLAYHUB_EXTRA_ORIGINS) and Forge (PUBLIC_ORIGIN) reject any other Origin header.
  DEV_PUBLIC_ORIGINS: https://playhub-dev-2611.web.app,https://playhub-dev-2611.firebaseapp.com
  # Custom-fork web editor binaries (forge/OfficialGodot/vendor-release is gitignored).
  WEB_EDITOR_ARTIFACT_BASE: gs://playhub-dev-deploy-2611/forge/web-editor
  LIVE_HUB_PROJECT: playhub-live-2611
  LIVE_FORGE_PROJECT: forge-live-2611
  DEFAULT_WIF_PROVIDER: projects/88778617121/locations/global/workloadIdentityPools/github-actions-pool/providers/github-oidc
  DEFAULT_CI_SA: github-ci-deployer@playhub-dev-2611.iam.gserviceaccount.com

jobs:
  verify:
    if: github.event_name == 'push' || inputs.action == 'deploy-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Hub & Forge runtime dependencies
        run: |
          npm ci --prefix hub --ignore-scripts
          npm ci --prefix forge --omit=dev --ignore-scripts
      - name: Check worktree ownership rules
        run: node tools/worktree-ownership/check-ownership.mjs --branch PlayHub-Platform
      - name: Build Hub static output
        run: node hub/tools/build.mjs
      - name: Run build-version, compatibility gate, entrypoint proxy, packaging/SSOT contract & P0 build worker tests
        run: node --test tools/build-version/build-version.test.mjs hub/tests/compat-version.test.mjs hub/tests/contract.schema-ssot.test.mjs deploy/cloudrun/entrypoint-proxy.test.mjs deploy/cloudrun/prune-ar-images.test.mjs deploy/cloudrun/contract.packaging-smoke.test.mjs deploy/cloudrun/build-worker/worker.test.mjs deploy/cloudrun/build-worker/cloudrun-backend.test.mjs deploy/cloudrun/forge/web-origin-config.test.mjs
      - name: Smoke test Cloud Run Hub entrypoint
        run: node deploy/cloudrun/smoke-test.mjs

  build:
    needs: verify
    if: github.event_name == 'push' || inputs.action == 'deploy-dev'
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
      hub_build_tag: ${{ steps.meta.outputs.hub_build_tag }}
      hub_build_id: ${{ steps.meta.outputs.hub_build_id }}
      hub_build_code: ${{ steps.meta.outputs.hub_build_code }}
      hub_daily_seq: ${{ steps.meta.outputs.hub_daily_seq }}
      hub_revision: ${{ steps.meta.outputs.hub_revision }}
      forge_build_tag: ${{ steps.meta.outputs.forge_build_tag }}
      forge_build_id: ${{ steps.meta.outputs.forge_build_id }}
      forge_build_code: ${{ steps.meta.outputs.forge_build_code }}
      forge_daily_seq: ${{ steps.meta.outputs.forge_daily_seq }}
      forge_revision: ${{ steps.meta.outputs.forge_revision }}
      build_date: ${{ steps.meta.outputs.build_date }}
      worker_tag: ${{ steps.worker.outputs.worker_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Hub build dependencies
        run: npm ci --prefix hub --ignore-scripts
      - name: Build Hub static output for container
        run: node hub/tools/build.mjs
      - id: meta
        env:
          INPUT_UPDATE_POLICY: ${{ inputs.update_policy || 'optional' }}
        run: |
          set -euo pipefail
          POLICY="${INPUT_UPDATE_POLICY:-optional}"
          if [[ ! "${POLICY}" =~ ^(optional|force)$ ]]; then
            echo "Invalid update_policy: ${POLICY}" >&2
            exit 1
          fi
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          HUB_SEMVER=$(node -p "require('./hub/package.json').version")
          FORGE_SEMVER=$(node -p "require('./forge/package.json').version")
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          node tools/build-version/resolve-build-info.mjs \
            --target hub --semver "${HUB_SEMVER}" --channel dev \
            --build-num "${GITHUB_RUN_NUMBER}" --date "${BUILD_DATE}" \
            --branch "${GITHUB_REF_NAME}" --commit "${GITHUB_SHA}" \
            --update-policy "${POLICY}" --clean \
            --output-prefix hub --github-output "$GITHUB_OUTPUT" > /dev/null
          node tools/build-version/resolve-build-info.mjs \
            --target forge-web --semver "${FORGE_SEMVER}" --channel dev \
            --build-num "${GITHUB_RUN_NUMBER}" --date "${BUILD_DATE}" \
            --branch "${GITHUB_REF_NAME}" --commit "${GITHUB_SHA}" \
            --update-policy "${POLICY}" --clean \
            --output-prefix forge --github-output "$GITHUB_OUTPUT" > /dev/null
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER || env.DEFAULT_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT || env.DEFAULT_CI_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-west1-docker.pkg.dev --quiet
      - name: Build & push immutable Hub image
        if: github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'hub'
        env:
          INPUT_UPDATE_POLICY: ${{ inputs.update_policy || 'optional' }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          HUB_BUILD_TAG: ${{ steps.meta.outputs.hub_build_tag }}
          HUB_SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
          HUB_DAILY_SEQ: ${{ steps.meta.outputs.hub_daily_seq }}
          HUB_BUILD_CODE: ${{ steps.meta.outputs.hub_build_code }}
        run: |
          set -euo pipefail
          POLICY="${INPUT_UPDATE_POLICY:-optional}"
          if [[ ! "${POLICY}" =~ ^(optional|force)$ ]]; then
            echo "Invalid update_policy: ${POLICY}" >&2
            exit 1
          fi
          docker build -f deploy/cloudrun/hub/Dockerfile \
            --build-arg PLAYHUB_CHANNEL=dev \
            --build-arg PLAYHUB_BUILD_NUM="${GITHUB_RUN_NUMBER}" \
            --build-arg PLAYHUB_DAILY_SEQ="${HUB_DAILY_SEQ}" \
            --build-arg PLAYHUB_BUILD_CODE="${HUB_BUILD_CODE}" \
            --build-arg PLAYHUB_BUILD_DATE="${BUILD_DATE}" \
            --build-arg PLAYHUB_BRANCH="${GITHUB_REF_NAME}" \
            --build-arg PLAYHUB_COMMIT="${GITHUB_SHA}" \
            --build-arg PLAYHUB_UPDATE_POLICY="${POLICY}" \
            -t "${ARTIFACT_REPO}/hub:${HUB_BUILD_TAG}" \
            -t "${ARTIFACT_REPO}/hub:${HUB_SHA_TAG}" .
          docker push "${ARTIFACT_REPO}/hub:${HUB_BUILD_TAG}"
          docker push "${ARTIFACT_REPO}/hub:${HUB_SHA_TAG}"
      - name: Build & push immutable Forge image
        if: github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'forge'
        env:
          INPUT_UPDATE_POLICY: ${{ inputs.update_policy || 'optional' }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          FORGE_BUILD_TAG: ${{ steps.meta.outputs.forge_build_tag }}
          FORGE_SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
          FORGE_DAILY_SEQ: ${{ steps.meta.outputs.forge_daily_seq }}
          FORGE_BUILD_CODE: ${{ steps.meta.outputs.forge_build_code }}
        run: |
          set -euo pipefail
          POLICY="${INPUT_UPDATE_POLICY:-optional}"
          if [[ ! "${POLICY}" =~ ^(optional|force)$ ]]; then
            echo "Invalid update_policy: ${POLICY}" >&2
            exit 1
          fi
          node deploy/cloudrun/forge/web-editor-artifact.mjs fetch --base "${WEB_EDITOR_ARTIFACT_BASE}"
          docker build -f deploy/cloudrun/forge/Dockerfile \
            --build-arg PLAYFORGE_CHANNEL=dev \
            --build-arg PLAYFORGE_BUILD_NUM="${GITHUB_RUN_NUMBER}" \
            --build-arg PLAYFORGE_DAILY_SEQ="${FORGE_DAILY_SEQ}" \
            --build-arg PLAYFORGE_BUILD_CODE="${FORGE_BUILD_CODE}" \
            --build-arg PLAYFORGE_BUILD_DATE="${BUILD_DATE}" \
            --build-arg PLAYFORGE_BRANCH="${GITHUB_REF_NAME}" \
            --build-arg PLAYFORGE_COMMIT="${GITHUB_SHA}" \
            --build-arg PLAYFORGE_UPDATE_POLICY="${POLICY}" \
            -t "${ARTIFACT_REPO}/forge:${FORGE_BUILD_TAG}" \
            -t "${ARTIFACT_REPO}/forge:${FORGE_SHA_TAG}" .
          docker push "${ARTIFACT_REPO}/forge:${FORGE_BUILD_TAG}"
          docker push "${ARTIFACT_REPO}/forge:${FORGE_SHA_TAG}"
      - name: Build & push P0 isolated build-worker image
        id: worker
        if: github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'forge'
        run: |
          set -euo pipefail
          WORKER_HASH=$(sha256sum \
            deploy/cloudrun/build-worker/Dockerfile \
            deploy/cloudrun/build-worker/worker.mjs \
            forge/Tools/export-godot-project.cjs \
            forge/Tools/deployment-zip-validator.cjs \
            forge/Tools/playhub-godot-shell.js \
            forge/Tools/avatar-seal.cjs | sha256sum | cut -c1-12)
          WORKER_TAG="bw-${WORKER_HASH}"
          echo "worker_tag=${WORKER_TAG}" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "${ARTIFACT_REPO}/build-worker:${WORKER_TAG}" >/dev/null 2>&1; then
            echo "Reusing unchanged build-worker image: ${ARTIFACT_REPO}/build-worker:${WORKER_TAG}"
          else
            docker build -f deploy/cloudrun/build-worker/Dockerfile \
              -t "${ARTIFACT_REPO}/build-worker:${WORKER_TAG}" .
            docker push "${ARTIFACT_REPO}/build-worker:${WORKER_TAG}"
          fi

  deploy-dev:
    needs: build
    if: github.event_name == 'push' || inputs.action == 'deploy-dev'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER || env.DEFAULT_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT || env.DEFAULT_CI_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy Hub to playhub-dev-2611 stage slot (0% traffic, manual zero-downtime publish)
        if: github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'hub'
        env:
          INPUT_UPDATE_POLICY: ${{ inputs.update_policy || 'optional' }}
          INPUT_FORCE_TARGETS: ${{ inputs.force_targets || '' }}
          HUB_BUILD_TAG: ${{ needs.build.outputs.hub_build_tag }}
          HUB_BUILD_ID: ${{ needs.build.outputs.hub_build_id }}
          HUB_BUILD_CODE: ${{ needs.build.outputs.hub_build_code }}
        run: |
          set -euo pipefail
          POLICY="${INPUT_UPDATE_POLICY:-optional}"
          FORCE_TARGETS="${INPUT_FORCE_TARGETS:-}"
          if [[ ! "${POLICY}" =~ ^(optional|force)$ ]]; then
            echo "Invalid update_policy: ${POLICY}" >&2
            exit 1
          fi
          if [[ -n "${FORCE_TARGETS}" && ! "${FORCE_TARGETS}" =~ ^(all|\*|(aos|ios|forge-desktop|forge-web|forge|hub|godot-server)(,(aos|ios|forge-desktop|forge-web|forge|hub|godot-server))*)$ ]]; then
            echo "Invalid force_targets: ${FORCE_TARGETS}" >&2
            exit 1
          fi
          TRAFFIC_FLAGS=()
          EXISTING_HUB_URL=""
          if gcloud run services describe playhub-hub --project="${DEV_HUB_PROJECT}" --region="${REGION}" >/dev/null 2>&1; then
            TRAFFIC_FLAGS=(--no-traffic --tag=stage)
            EXISTING_HUB_URL=$(gcloud run services describe playhub-hub \
              --project="${DEV_HUB_PROJECT}" \
              --region="${REGION}" \
              --format='value(status.url)' || true)
          fi
          ENV_VARS="^##^PLAYHUB_ROLE=public##PLAYHUB_SECURE_COOKIES=true##PLAYHUB_CHANNEL=dev##PLAYHUB_BILLING_ENABLED=1##PLAYHUB_FORGE_REMOTE_VERIFY=1##PLAYHUB_OAUTH_BUILTIN_FALLBACK=1##PLAYHUB_EXTRA_ORIGINS=${DEV_PUBLIC_ORIGINS}##PLAYHUB_BUILD_ID=${HUB_BUILD_ID}##PLAYHUB_BUILD_CODE=${HUB_BUILD_CODE}##PLAYHUB_UPDATE_POLICY=${POLICY}##PLAYHUB_FORCE_TARGETS=${FORCE_TARGETS}"
          if [[ "${EXISTING_HUB_URL}" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            ENV_VARS="${ENV_VARS}##PLAYHUB_PUBLIC_ORIGIN=${EXISTING_HUB_URL}"
          fi
          gcloud run deploy playhub-hub \
            --project="${DEV_HUB_PROJECT}" \
            --region="${REGION}" \
            --image="${ARTIFACT_REPO}/hub:${HUB_BUILD_TAG}" \
            --allow-unauthenticated \
            --memory=512Mi --cpu=1 --min-instances=0 --max-instances=1 \
            --update-env-vars="${ENV_VARS}" \
            ${TRAFFIC_FLAGS[@]+"${TRAFFIC_FLAGS[@]}"} \
            --quiet
          HUB_URL=$(gcloud run services describe playhub-hub \
            --project="${DEV_HUB_PROJECT}" \
            --region="${REGION}" \
            --format='value(status.url)')
          if [[ ! "${HUB_URL}" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "Failed to resolve valid Cloud Run service URL for playhub-hub: ${HUB_URL}" >&2
            exit 1
          fi
          if [[ "${EXISTING_HUB_URL}" != "${HUB_URL}" ]]; then
            gcloud run services update playhub-hub \
              --project="${DEV_HUB_PROJECT}" \
              --region="${REGION}" \
              --update-env-vars="^##^PLAYHUB_PUBLIC_ORIGIN=${HUB_URL}" \
              ${TRAFFIC_FLAGS[@]+"${TRAFFIC_FLAGS[@]}"} \
              --quiet
          fi
      - name: Deploy Forge to forge-dev-2611 stage slot (0% traffic, Hub Auth fail-closed)
        if: github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'forge'
        env:
          FORGE_BUILD_TAG: ${{ needs.build.outputs.forge_build_tag }}
          FORGE_BUILD_ID: ${{ needs.build.outputs.forge_build_id }}
        run: |
          set -euo pipefail
          HUB_URL=$(gcloud run services describe playhub-hub \
            --project="${DEV_HUB_PROJECT}" \
            --region="${REGION}" \
            --format='value(status.url)')
          if [[ ! "${HUB_URL}" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "Failed to resolve valid Cloud Run service URL for playhub-hub: ${HUB_URL}" >&2
            exit 1
          fi
          TRAFFIC_FLAGS=()
          if gcloud run services describe playhub-forge --project="${DEV_FORGE_PROJECT}" --region="${REGION}" >/dev/null 2>&1; then
            TRAFFIC_FLAGS=(--no-traffic --tag=stage)
          fi
          FORGE_SECRET=$(gcloud run services describe playhub-forge \
            --project="${DEV_FORGE_PROJECT}" \
            --region="${REGION}" \
            --format='value(spec.template.spec.containers[0].env)' 2>/dev/null | grep -oE "PLAYHUB_FORGE_INTERNAL_SECRET', 'value': '[^']+" | sed "s/.*'value': '//" || true)
          if [[ ${#FORGE_SECRET} -lt 32 ]]; then
            FORGE_SECRET=$(openssl rand -hex 32)
          fi
          gcloud run deploy playhub-forge \
            --project="${DEV_FORGE_PROJECT}" \
            --region="${REGION}" \
            --image="${ARTIFACT_REPO}/forge:${FORGE_BUILD_TAG}" \
            --allow-unauthenticated \
            --memory=256Mi --cpu=1 --min-instances=0 --max-instances=1 --timeout=300 \
            --update-env-vars="^##^PUBLIC_ORIGIN=${DEV_PUBLIC_ORIGINS},${HUB_URL}##PLAYFORGE_BASE_PATH=/forge##PLAYFORGE_ALLOW_GUEST=1##PLAYHUB_FORGE_AUTH_MODE=hub##PLAYHUB_FORGE_INTERNAL_SECRET=${FORGE_SECRET}##PLAYHUB_SESSION_VERIFY_URL=${HUB_URL}/internal/session/verify##PLAYFORGE_BUILD_ID=${FORGE_BUILD_ID}##PLAYFORGE_BUILD_BACKEND=cloudrun-job##PLAYFORGE_BUILD_PROJECT=${DEV_FORGE_PROJECT}##PLAYFORGE_BUILD_REGION=${REGION}##PLAYFORGE_BUILD_JOB=forge-build-worker##PLAYFORGE_BUILD_BUCKET=playhub-dev-deploy-2611" \
            ${TRAFFIC_FLAGS[@]+"${TRAFFIC_FLAGS[@]}"} \
            --quiet
          FORGE_URL=$(gcloud run services describe playhub-forge \
            --project="${DEV_FORGE_PROJECT}" \
            --region="${REGION}" \
            --format='value(status.url)')
          if [[ "${FORGE_URL}" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            gcloud run services update playhub-hub \
              --project="${DEV_HUB_PROJECT}" \
              --region="${REGION}" \
              --update-env-vars="^##^PLAYHUB_FORGE_UPSTREAM=${FORGE_URL}##PLAYHUB_FORGE_REMOTE_VERIFY=1##PLAYHUB_FORGE_INTERNAL_SECRET=${FORGE_SECRET}" \
              --quiet
          fi
      - name: Route Dev primary traffic (100%) to latest verified Hub & Forge revisions
        if: github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'hub' || inputs.target == 'forge'
        env:
          INPUT_TARGET: ${{ inputs.target || 'both' }}
        run: |
          set -euo pipefail
          TARGET="${INPUT_TARGET:-both}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${TARGET}" = "both" ] || [ "${TARGET}" = "forge" ]; then
            gcloud run services update-traffic playhub-forge \
              --project="${DEV_FORGE_PROJECT}" --region="${REGION}" \
              --update-tags="stage=LATEST" --to-latest --quiet
          fi
          if [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${TARGET}" = "both" ] || [ "${TARGET}" = "hub" ]; then
            gcloud run services update-traffic playhub-hub \
              --project="${DEV_HUB_PROJECT}" --region="${REGION}" \
              --update-tags="stage=LATEST" --to-latest --quiet
          fi
      - name: Deploy P0 isolated build-worker Cloud Run Job (forge-dev-2611, zero-IAM SA)
        if: github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'forge'
        env:
          WORKER_TAG: ${{ needs.build.outputs.worker_tag }}
        run: |
          set -euo pipefail
          gcloud run jobs deploy forge-build-worker \
            --project="${DEV_FORGE_PROJECT}" \
            --region="${REGION}" \
            --image="${ARTIFACT_REPO}/build-worker:${WORKER_TAG}" \
            --service-account="forge-build-worker-sa@${DEV_FORGE_PROJECT}.iam.gserviceaccount.com" \
            --set-env-vars="PLAYFORGE_SHARED_WEB_RUNTIME_BASE=/runtime/godot/4.7.2" \
            --memory=1Gi --cpu=1 --task-timeout=180s --max-retries=0 \
            --quiet
      - name: Checkout Artifact Registry prune script
        uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/cloudrun
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Mint WIF access token for Artifact Registry cleanup
        id: ar_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER || env.DEFAULT_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT || env.DEFAULT_CI_SA }}
          token_format: 'access_token'
          export_environment_variables: false
      - name: Prune old Artifact Registry tags & apply Cleanup Policy (keep latest 3 per package)
        env:
          AR_ACCESS_TOKEN: ${{ steps.ar_auth.outputs.access_token }}
          HUB_BUILD_TAG: ${{ needs.build.outputs.hub_build_tag }}
          FORGE_BUILD_TAG: ${{ needs.build.outputs.forge_build_tag }}
          WORKER_TAG: ${{ needs.build.outputs.worker_tag }}
        run: |
          set -euo pipefail
          node deploy/cloudrun/prune-ar-images.mjs \
            --project="${DEV_HUB_PROJECT}" \
            --location="${REGION}" \
            --repository="playhub-containers" \
            --keep=3 \
            --apply-policy \
            --protect-tag="${HUB_BUILD_TAG}" \
            --protect-tag="${FORGE_BUILD_TAG}" \
            --protect-tag="${WORKER_TAG}"

  prune-ar:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'prune-ar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/cloudrun
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Mint WIF access token for Artifact Registry cleanup
        id: ar_auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER || env.DEFAULT_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT || env.DEFAULT_CI_SA }}
          token_format: 'access_token'
          export_environment_variables: false
      - name: Prune old Artifact Registry tags & apply Cleanup Policy (keep latest 3 per package)
        env:
          AR_ACCESS_TOKEN: ${{ steps.ar_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          node deploy/cloudrun/prune-ar-images.mjs \
            --project="${DEV_HUB_PROJECT}" \
            --location="${REGION}" \
            --repository="playhub-containers" \
            --keep=3 \
            --apply-policy

  publish-stage:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'publish-stage'
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER || env.DEFAULT_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT || env.DEFAULT_CI_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Zero-downtime traffic switch from stage tag to Dev primary URL
        env:
          INPUT_TARGET: ${{ inputs.target || 'both' }}
          INPUT_CANARY_PERCENT: ${{ inputs.canary_percent || '100' }}
        run: |
          set -euo pipefail
          TARGET="${INPUT_TARGET:-both}"
          PCT="${INPUT_CANARY_PERCENT:-100}"
          if [[ ! "${TARGET}" =~ ^(both|hub|forge)$ ]]; then
            echo "Invalid target: ${TARGET}" >&2
            exit 1
          fi
          if [[ ! "${PCT}" =~ ^([1-9][0-9]?|100)$ ]]; then
            echo "Invalid canary_percent (must be integer 1-100): ${PCT}" >&2
            exit 1
          fi
          if [ "${TARGET}" = "both" ] || [ "${TARGET}" = "hub" ]; then
            gcloud run services update-traffic playhub-hub \
              --project="${DEV_HUB_PROJECT}" --region="${REGION}" \
              --to-tags="stage=${PCT}" --quiet
          fi
          if [ "${TARGET}" = "both" ] || [ "${TARGET}" = "forge" ]; then
            gcloud run services update-traffic playhub-forge \
              --project="${DEV_FORGE_PROJECT}" --region="${REGION}" \
              --to-tags="stage=${PCT}" --quiet
          fi

  promote-qa:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'promote-qa'
    environment: qa
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER || env.DEFAULT_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT || env.DEFAULT_CI_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy QA preview tag (no rebuild, zero impact on dev traffic)
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_UPDATE_POLICY: ${{ inputs.update_policy || 'optional' }}
          INPUT_FORCE_TARGETS: ${{ inputs.force_targets || '' }}
        run: |
          set -euo pipefail
          TAG="${INPUT_IMAGE_TAG:-}"
          TARGET="${INPUT_TARGET:-both}"
          POLICY="${INPUT_UPDATE_POLICY:-optional}"
          FORCE_TARGETS="${INPUT_FORCE_TARGETS:-}"
          if [[ ! "${TAG}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid or missing image_tag: ${TAG}" >&2
            exit 1
          fi
          if [[ ! "${TARGET}" =~ ^(both|hub|forge)$ ]]; then
            echo "Invalid target: ${TARGET}" >&2
            exit 1
          fi
          if [[ ! "${POLICY}" =~ ^(optional|force)$ ]]; then
            echo "Invalid update_policy: ${POLICY}" >&2
            exit 1
          fi
          if [[ -n "${FORCE_TARGETS}" && ! "${FORCE_TARGETS}" =~ ^(all|\*|(aos|ios|forge-desktop|forge-web|forge|hub|godot-server)(,(aos|ios|forge-desktop|forge-web|forge|hub|godot-server))*)$ ]]; then
            echo "Invalid force_targets: ${FORCE_TARGETS}" >&2
            exit 1
          fi
          if [ "${TARGET}" = "both" ] || [ "${TARGET}" = "hub" ]; then
            gcloud run deploy playhub-hub \
              --project="${DEV_HUB_PROJECT}" --region="${REGION}" \
              --image="${ARTIFACT_REPO}/hub:${TAG}" \
              --update-env-vars="^##^PLAYHUB_CHANNEL=qa##PLAYHUB_UPDATE_POLICY=${POLICY}##PLAYHUB_FORCE_TARGETS=${FORCE_TARGETS}" \
              --no-traffic --tag=qa --quiet
          fi
          if [ "${TARGET}" = "both" ] || [ "${TARGET}" = "forge" ]; then
            gcloud run deploy playhub-forge \
              --project="${DEV_FORGE_PROJECT}" --region="${REGION}" \
              --image="${ARTIFACT_REPO}/forge:${TAG}" \
              --no-traffic --tag=qa --quiet
          fi

  promote-live:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'promote-live'
    environment: live
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER || env.DEFAULT_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT || env.DEFAULT_CI_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Promote immutable QA-verified image to Live (canary supported)
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_CANARY_PERCENT: ${{ inputs.canary_percent || '100' }}
          INPUT_UPDATE_POLICY: ${{ inputs.update_policy || 'optional' }}
          INPUT_FORCE_TARGETS: ${{ inputs.force_targets || '' }}
        run: |
          set -euo pipefail
          TAG="${INPUT_IMAGE_TAG:-}"
          TARGET="${INPUT_TARGET:-both}"
          PCT="${INPUT_CANARY_PERCENT:-100}"
          POLICY="${INPUT_UPDATE_POLICY:-optional}"
          FORCE_TARGETS="${INPUT_FORCE_TARGETS:-}"
          if [[ ! "${TAG}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid or missing image_tag: ${TAG}" >&2
            exit 1
          fi
          if [[ ! "${TARGET}" =~ ^(both|hub|forge)$ ]]; then
            echo "Invalid target: ${TARGET}" >&2
            exit 1
          fi
          if [[ ! "${PCT}" =~ ^([1-9][0-9]?|100)$ ]]; then
            echo "Invalid canary_percent (must be integer 1-100): ${PCT}" >&2
            exit 1
          fi
          if [[ ! "${POLICY}" =~ ^(optional|force)$ ]]; then
            echo "Invalid update_policy: ${POLICY}" >&2
            exit 1
          fi
          if [[ -n "${FORCE_TARGETS}" && ! "${FORCE_TARGETS}" =~ ^(all|\*|(aos|ios|forge-desktop|forge-web|forge|hub|godot-server)(,(aos|ios|forge-desktop|forge-web|forge|hub|godot-server))*)$ ]]; then
            echo "Invalid force_targets: ${FORCE_TARGETS}" >&2
            exit 1
          fi
          if [ "${TARGET}" = "both" ] || [ "${TARGET}" = "hub" ]; then
            gcloud run deploy playhub-hub \
              --project="${LIVE_HUB_PROJECT}" --region="${REGION}" \
              --image="${ARTIFACT_REPO}/hub:${TAG}" \
              --update-env-vars="^##^PLAYHUB_CHANNEL=live##PLAYHUB_UPDATE_POLICY=${POLICY}##PLAYHUB_FORCE_TARGETS=${FORCE_TARGETS}" \
              --no-traffic --tag=candidate --quiet
            REV=$(gcloud run services describe playhub-hub --project="${LIVE_HUB_PROJECT}" --region="${REGION}" --format='value(status.latestReadyRevisionName)')
            gcloud run services update-traffic playhub-hub \
              --project="${LIVE_HUB_PROJECT}" --region="${REGION}" \
              --to-revisions="${REV}=${PCT}" --quiet
          fi
          if [ "${TARGET}" = "both" ] || [ "${TARGET}" = "forge" ]; then
            gcloud run deploy playhub-forge \
              --project="${LIVE_FORGE_PROJECT}" --region="${REGION}" \
              --image="${ARTIFACT_REPO}/forge:${TAG}" \
              --no-traffic --tag=candidate --quiet
            REV=$(gcloud run services describe playhub-forge --project="${LIVE_FORGE_PROJECT}" --region="${REGION}" --format='value(status.latestReadyRevisionName)')
            gcloud run services update-traffic playhub-forge \
              --project="${LIVE_FORGE_PROJECT}" --region="${REGION}" \
              --to-revisions="${REV}=${PCT}" --quiet
          fi

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    environment: live
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER || env.DEFAULT_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT || env.DEFAULT_CI_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Instant 1-second traffic rollback to previous revision
        env:
          INPUT_ROLLBACK_REVISION: ${{ inputs.rollback_revision }}
          INPUT_ROLLBACK_ENV: ${{ inputs.rollback_env || 'live' }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          REV="${INPUT_ROLLBACK_REVISION:-}"
          ROLLBACK_ENV="${INPUT_ROLLBACK_ENV:-live}"
          TARGET="${INPUT_TARGET:-}"
          if [[ ! "${REV}" =~ ^[a-z][a-z0-9-]{0,62}$ ]]; then
            echo "Invalid or missing rollback_revision: ${REV}" >&2
            exit 1
          fi
          if [[ ! "${ROLLBACK_ENV}" =~ ^(dev|live)$ ]]; then
            echo "Invalid rollback_env: ${ROLLBACK_ENV}" >&2
            exit 1
          fi
          if [[ ! "${TARGET}" =~ ^(hub|forge)$ ]]; then
            echo "rollback requires target=hub or target=forge with exact revision name" >&2
            exit 1
          fi
          if [ "${ROLLBACK_ENV}" = "dev" ]; then
            HUB_P="${DEV_HUB_PROJECT}"; FORGE_P="${DEV_FORGE_PROJECT}"
          else
            HUB_P="${LIVE_HUB_PROJECT}"; FORGE_P="${LIVE_FORGE_PROJECT}"
          fi
          if [ "${TARGET}" = "hub" ]; then
            gcloud run services update-traffic playhub-hub --project="${HUB_P}" --region="${REGION}" --to-revisions="${REV}=100" --quiet
          else
            gcloud run services update-traffic playhub-forge --project="${FORGE_P}" --region="${REGION}" --to-revisions="${REV}=100" --quiet
          fi

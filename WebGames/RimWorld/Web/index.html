<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131c21">
  <meta name="description" content="세 사람의 작은 정착지. 장비를 제작하고 물자를 거래하며, 화재와 습격 속에서 서로를 지키세요. 브라우저에서 플레이하는 정착지 생존 시뮬레이션.">
  <title>변방의 기록 · Frontier Colony</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=4.0.0">
</head>
<body>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>

    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-focus" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4 10-10"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21 3 12C-2 3 9 0 12 7c3-7 14-4 9 5l-9 9Z"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 22v-4a7 7 0 0 1 14 0v4M17 4a4 4 0 0 1 0 8M20 22v-4a6 6 0 0 0-3-5"/></symbol>
    <symbol id="i-log" viewBox="0 0 24 24"><path d="M5 3h14v19H5zM8 7h8M8 12h8M8 17h5"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M3 6h5M12 6h9M3 12h10M17 12h4M3 18h3M10 18h11M8 3v6M13 9v6M6 15v6"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="m13 2-9 12h7l-1 8 10-13h-8l1-7Z"/></symbol>
    <symbol id="i-solar" viewBox="0 0 24 24"><path d="m5 9-3 10h20L19 9H5ZM4 14h16M10 9l-1 10M14 9l1 10M12 19v3M8 22h8"/><circle cx="12" cy="4" r="2"/><path d="M5 3h1M18 3h1M8 6l-1 1M16 6l1 1"/></symbol>
    <symbol id="i-battery" viewBox="0 0 24 24"><path d="M7 5h10v17H7zM10 5V2h4v3M10 10h4M12 8v4M10 17h4"/></symbol>
    <symbol id="i-cable" viewBox="0 0 24 24"><path d="M6 2v4M10 2v4M4 6h8v4a4 4 0 0 1-8 0V6ZM8 14v4a4 4 0 0 0 8 0V8M14 8h4M16 3v5"/></symbol>
    <symbol id="i-snow" viewBox="0 0 24 24"><path d="M12 2v20M3 7l18 10M3 17 21 7M9 4l3 3 3-3M9 20l3-3 3 3M4 10l4-1-1-4M17 19l-1-4 4-1M4 14l4 1-1 4M17 5l-1 4 4 1"/></symbol>
    <symbol id="i-heat" viewBox="0 0 24 24"><path d="M5 21h14V10H5v11ZM8 13v5M12 13v5M16 13v5M8 7c-3-3 3-3 0-6M15 7c-3-3 3-3 0-6"/></symbol>
    <symbol id="i-research" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L4 19a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3L14 9V3M7 15h10M9 18h.01M14 19h.01"/></symbol>
    <symbol id="i-thermometer" viewBox="0 0 24 24"><path d="M9 14V5a3 3 0 0 1 6 0v9a5 5 0 1 1-6 0ZM12 8v10M18 5h3M18 9h2"/></symbol>
    <symbol id="i-roof" viewBox="0 0 24 24"><path d="m2 11 10-8 10 8M5 9v12h14V9M9 21v-7h6v7"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M5 10h14v12H5zM8 10V6a4 4 0 0 1 8 0v4M12 15v3"/></symbol>
    <symbol id="i-prioritize" viewBox="0 0 24 24"><path d="m5 13 7-8 7 8M12 5v16M5 3h14"/></symbol>
    <symbol id="i-fire" viewBox="0 0 24 24"><path d="M13 2c1 5-5 6-4 10 2 0 3-2 3-3 5 4 8 7 5 11-3 4-10 1-11-3-2-6 3-9 7-15Z"/><path d="M10 17c0 2 1 4 3 4s3-3 0-5c0 2-2 3-3 1Z"/></symbol>
    <symbol id="i-rescue" viewBox="0 0 24 24"><path d="M2 13h20M5 13l2-6h5l3 6M3 10v9M21 10v9M8 18h8"/><circle cx="17" cy="8" r="3"/></symbol>
    <symbol id="i-hold" viewBox="0 0 24 24"><path d="M5 3v19M5 4h13l-3 4 3 4H5M3 22h5"/></symbol>
    <symbol id="i-recreation" viewBox="0 0 24 24"><path d="M7 3v8a5 5 0 0 0 10 0V3h4v8a9 9 0 0 1-18 0V3h4ZM3 7h4M17 7h4M8 17l-2 3M16 17l2 3"/></symbol>
    <symbol id="i-craft" viewBox="0 0 24 24"><path d="m3 21 9-9M15 5l-4-3-5 5 4 3 5-5ZM13 3l8 8-3 3-8-8M14 15l5 6 3-3-6-5"/></symbol>
    <symbol id="i-rifle" viewBox="0 0 24 24"><path d="m3 18 5-5 3 3-5 5-3-3ZM8 13l9-9 3 3-9 9M17 4l3-3M10 14l3 4 3-3-3-4M15 6l2 2M3 19l-1 1"/></symbol>
    <symbol id="i-armor" viewBox="0 0 24 24"><path d="m8 3 4 3 4-3 5 6-4 4v8H7v-8L3 9l5-6ZM8 3v5l4 3 4-3V3M7 16h10M12 11v10"/></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="6"/><path d="m12 8 3 4-3 4-3-4 3-4Z"/></symbol>
    <symbol id="i-trade" viewBox="0 0 24 24"><path d="M3 8h17M16 4l4 4-4 4M21 16H4M8 12l-4 4 4 4"/></symbol>
  </defs></svg>
  <div id="app" class="app">
    <header class="topbar">
      <a class="brand" href="./" aria-label="변방의 기록 홈"><svg class="brand-mark"><use href="#i-mark"/></svg><span><b>변방의 기록</b><small>FRONTIER COLONY</small></span></a>
      <div class="colony-tag"><span class="live-dot"></span>해솔 정착지<span class="tag-separator">/</span><span id="living-count">3명의 생존자</span></div>
      <nav class="top-actions" aria-label="게임 관리">
        <span id="save-status" class="save-status">브라우저 자동 저장</span>
        <button class="icon-button" id="save-button" title="저장 (Ctrl+S)" aria-label="게임 저장"><svg><use href="#i-save"/></svg></button>
        <button class="icon-button" id="help-button" title="플레이 가이드 (?)" aria-label="플레이 가이드"><svg><use href="#i-help"/></svg></button>
        <button class="icon-button" id="menu-button" title="게임 메뉴" aria-label="게임 메뉴"><svg><use href="#i-menu"/></svg></button>
      </nav>
    </header>
    <section class="statusbar" aria-label="정착지 자원과 시간">
      <div id="resource-list" class="resource-list"></div>
      <div class="time-controls">
        <div class="world-time"><svg><use href="#i-sun"/></svg><span id="world-time">1일 · 08:00</span><span id="temperature">18°C</span></div>
        <div class="speed-control" role="group" aria-label="시뮬레이션 속도">
          <button data-speed="0" title="일시 정지 (Space)" aria-label="일시 정지"><svg><use href="#i-pause"/></svg></button>
          <button data-speed="1" class="active" aria-label="1배속">1×</button><button data-speed="3" aria-label="3배속">3×</button><button data-speed="6" aria-label="6배속">6×</button>
        </div>
      </div>
    </section>
    <main class="workspace">
      <section class="world-column" aria-label="게임 지도">
        <div class="map-stage" id="map-stage">
          <canvas id="world" aria-label="정착지 지도. 도구를 선택한 뒤 클릭하거나 터치해 명령합니다." tabindex="0"></canvas>
          <div class="map-heading"><div class="map-eyebrow"><span class="tiny-cross">+</span> MADE FOR TOMORROW</div><strong>작은 정착지, 더 먼 내일</strong><span>만들고, 지키고, 함께 살아갑니다.</span></div>
          <div class="map-coordinates" id="coordinates">48 × 32 · 온대림</div>
          <div class="paused-badge" id="paused-badge" hidden><svg><use href="#i-pause"/></svg>일시 정지 <kbd>SPACE</kbd></div>
          <div id="threat-banner" class="threat-banner" hidden></div>
          <button id="mobile-panel-toggle" class="mobile-panel-toggle"><svg><use href="#i-beacon"/></svg><span>정착지 · 목표</span><svg><use href="#i-arrow"/></svg></button>
          <div class="map-controls" aria-label="지도 보기">
            <button class="icon-button" id="zoom-in" aria-label="지도 확대" title="확대"><svg><use href="#i-plus"/></svg></button>
            <button class="icon-button" id="zoom-out" aria-label="지도 축소" title="축소"><svg><use href="#i-minus"/></svg></button>
            <span></span><button class="icon-button" id="fit-map" aria-label="정착지 중심 보기" title="정착지 중심 (F)"><svg><use href="#i-focus"/></svg></button>
            <button class="icon-button" id="grid-toggle" aria-label="격자 표시 전환" title="격자 표시 (G)" aria-pressed="false"><svg><use href="#i-grid"/></svg></button>
            <span></span><button class="icon-button" id="temperature-layer" aria-label="온도와 실내 보기" title="온도와 실내 (T)" aria-pressed="false"><svg><use href="#i-thermometer"/></svg></button>
            <button class="icon-button" id="power-layer" aria-label="전력망 보기" title="전력망 (P)" aria-pressed="false"><svg><use href="#i-power"/></svg></button>
          </div>
          <div class="layer-legend" id="layer-legend" hidden></div>
          <div class="tool-hint" id="tool-hint"><svg><use href="#i-select"/></svg><span>주민이나 지형을 선택하세요</span><kbd>우클릭 드래그 · 지도 이동</kbd></div>
          <div class="loading-screen" id="loading-screen"><svg class="brand-mark"><use href="#i-mark"/></svg><b>우리의 첫날을 준비하는 중</b><span>숲 너머에서 새로운 이야기가 시작됩니다.</span></div>
        </div>
        <section id="colonist-dock" class="colonist-dock" aria-label="정착민"></section>
      </section>
      <aside class="sidebar" id="sidebar" aria-label="정착지 관리">
        <div class="sidebar-top"><span>COLONY OVERVIEW</span><button class="icon-button mobile-only" id="panel-close" aria-label="관리 패널 닫기"><svg><use href="#i-cancel"/></svg></button></div>
        <div class="sidebar-tabs" role="tablist" aria-label="관리 탭">
          <button role="tab" aria-selected="true" class="active" data-pane="colony"><svg><use href="#i-beacon"/></svg>목표</button>
          <button role="tab" aria-selected="false" data-pane="inspect"><svg><use href="#i-users"/></svg>선택</button>
          <button role="tab" aria-selected="false" data-pane="work"><svg><use href="#i-sliders"/></svg>작업</button>
          <button role="tab" aria-selected="false" data-pane="industry"><svg><use href="#i-craft"/></svg>제작</button>
          <button role="tab" aria-selected="false" data-pane="trade"><svg><use href="#i-trade"/></svg>교역</button>
          <button role="tab" aria-selected="false" data-pane="schedule"><svg><use href="#i-clock"/></svg>일정</button>
          <button role="tab" aria-selected="false" data-pane="care"><svg><use href="#i-medicine"/></svg>의료·소방</button>
          <button role="tab" aria-selected="false" data-pane="research"><svg><use href="#i-research"/></svg>연구</button>
          <button role="tab" aria-selected="false" data-pane="systems"><svg><use href="#i-power"/></svg>설비</button>
          <button role="tab" aria-selected="false" data-pane="logs"><svg><use href="#i-log"/></svg>기록</button>
        </div>
        <div class="sidebar-content" id="sidebar-content" role="tabpanel"></div>
        <div class="sidebar-footer"><span class="live-dot"></span><span id="sidebar-footer-text">생존은 함께하는 일입니다.</span><span>v4.0</span></div>
      </aside>
    </main>
    <footer class="command-deck">
      <div class="tool-categories" role="group" aria-label="명령 분류">
        <button class="category active" data-category="orders"><svg><use href="#i-axe"/></svg><span>명령</span><kbd>Q</kbd></button>
        <button class="category" data-category="build"><svg><use href="#i-wall"/></svg><span>건설</span><kbd>B</kbd></button>
        <button class="category" data-category="utilities"><svg><use href="#i-power"/></svg><span>설비</span><kbd>E</kbd></button>
        <button class="category" data-category="zones"><svg><use href="#i-leaf"/></svg><span>구역</span><kbd>Z</kbd></button>
      </div>
      <div class="tool-list" id="tool-list" role="group" aria-label="지도 명령"></div>
      <div class="deck-note"><span id="active-tool-label">선택 모드</span><small><kbd>ESC</kbd> 선택으로 돌아가기</small></div>
    </footer>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <input type="file" id="import-input" accept="application/json,.json" hidden>
  <noscript><div class="noscript">이 게임을 실행하려면 브라우저의 JavaScript를 켜 주세요.</div></noscript>
  <script src="./app.bundle.js?v=4.0.1"></script>
</body>
</html>

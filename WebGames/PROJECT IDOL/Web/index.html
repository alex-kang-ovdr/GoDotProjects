const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const MAIN=DATA.characters.filter(c=>c.tier==='lead');const STATS={vocal:'보컬',dance:'댄스',creative:'창작',streaming:'방송',trust:'신뢰',stress:'스트레스'};const TASKS={vocal:{name:'보컬 훈련',stat:'vocal',gain:rand,cost:12,fatigue:12},dance:{name:'댄스 훈련',stat:'dance',cost:13,fatigue:15},creative:{name:'작곡·작사',stat:'creative',cost:10,fatigue:10},streaming:{name:'방송 연습',stat:'streaming',cost:8,fatigue:9},rest:{name:'휴식',cost:5,fatigue:-24},bond:{name:'팀워크 활동',cost:9,fatigue:5}};const CONCEPTS=['드림팝','청량','사이버','다크 판타지','시티팝','록','발라드','하이퍼팝'];
function fresh(){return {month:1,budget:3200,reputation:12,buzz:8,teamwork:40,autonomy:40,loyalty:45,global_fans:0,fans:35,phase:'trainee',debut:false,groupName:'LUMINA',concept:'드림팝',members:['lead_01','lead_02','lead_03','lead_05'],trainees:MAIN.map(c=>({...c,stats:{...c.initial_stats},fatigue:12,training:10,assigned:'rest',joined:true})),songs:[],releases:[],eventsSeen:[],flags:[],history:[],pending:null,ending:null,weekly:0,viral:0,contracts:[],selectedSong:null}}let s;try{s=JSON.parse(localStorage.getItem('idol_save_v1'))||fresh()}catch{s=fresh()}let tab='dashboard';function t(id){return s.trainees.find(x=>x.id===id)}function money(n){return Math.round(n).toLocaleString('ko-KR')}function toast(m){$('toast').textContent=m;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}function log(m){s.history.unshift(`M${s.month}: ${m}`);s.history=s.history.slice(0,90)}function save(){localStorage.setItem('idol_save_v1',JSON.stringify(s));toast('저장 완료')}function persist(){localStorage.setItem('idol_save_v1',JSON.stringify(s))}function go(x){tab=x;render()}function avatar(c){return ['🎤','💃','✨','🌙','🎮','🎼','🌸','🎭'][MAIN.findIndex(x=>x.id===c.id)]||'⭐'}function statrow(n,v){return `<div class="stat small"><span>${n}</span><b>${Math.round(v)}</b></div><div class="bar"><i style="width:${clamp(v)}%"></i></div>`}function metric(n,v){return `<div class="card"><div class="muted small">${n}</div><div class="metric">${v}</div></div>`}function render(){const names={dashboard:'대시보드',training:'훈련',group:'데뷔조',studio:'음악 제작',activity:'활동·팬덤',story:'스토리',endings:'엔딩'};$('top').textContent=`${s.month}개월차 · 자금 ${money(s.budget)}만 · 팬 ${money(s.fans)}명`;$('nav').innerHTML=Object.entries(names).map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');$('app').innerHTML=({dashboard,training,group,studio,activity,story,endings})[tab]();persist()}
function dashboard(){return `<div class="stage"><div class="muted">VIRTUAL STAR MAKER</div><b>${esc(s.groupName)}</b><div>${esc(s.concept)} · ${s.debut?'데뷔 완료':'연습생 육성 중'} · ${s.month}개월차</div></div><div class="grid" style="margin-top:12px">${metric('회사 자금',money(s.budget)+'만')}${metric('팬덤',money(s.fans))}${metric('화제성',s.buzz)}${metric('팀워크',s.teamwork)}${metric('발매곡',s.releases.length)}${metric('글로벌 인지도',s.global_fans)}</div><div class="split"><div class="card"><h3>이번 달 운영</h3><p>훈련과 방송, 음악 제작을 계획한 뒤 한 달을 진행하세요. 비용과 피로가 적용되고 평가·사건이 발생합니다.</p><button class="primary" onclick="nextMonth()">▶ 다음 달 진행</button> <button onclick="go('training')">훈련 편성</button><p class="muted small">월 운영비 30만 · 데뷔 후 활동 수익 발생 · 72개월차에 최종 평가</p></div><div class="card"><h3>최근 기록</h3><div class="log">${s.history.slice(0,12).map(x=>`<div>${esc(x)}</div>`).join('')||'새로운 기획사가 시작되었습니다.'}</div></div></div>${s.pending?pendingHTML():''}`}
function training(){return `<h2>연습생 훈련 · 월간 스케줄</h2><p class="muted">멤버별 훈련을 선택하세요. 매달 능력치가 성장하고 피로·스트레스·예산이 변합니다.</p><div class="grid">${s.trainees.map(c=>`<div class="card"><div class="avatar">${avatar(c)}</div><div class="row between"><h3>${esc(c.name)}</h3><span class="pill">${esc(c.role)}</span></div><p class="muted small">${esc(c.trait)} · ${esc(c.inner_conflict)}</p>${Object.entries(STATS).map(([k,n])=>statrow(n,c.stats[k])).join('')}${statrow('피로',c.fatigue)}<label>이번 달 훈련</label><select onchange="assign('${c.id}',this.value)">${Object.entries(TASKS).map(([k,v])=>`<option value="${k}" ${c.assigned===k?'selected':''}>${v.name} (${v.cost}만)</option>`).join('')}</select><p class="small muted">${esc(c.intro)}</p></div>`).join('')}</div>`}function assign(id,key){t(id).assigned=key;persist()}
function group(){return `<h2>데뷔조 자유 편성</h2><div class="split"><div><div class="grid">${s.trainees.map(c=>`<div class="card"><div class="row between"><b>${esc(c.name)}</b><button onclick="toggleMember('${c.id}')">${s.members.includes(c.id)?'✓ 선발':'＋ 선발'}</button></div><div class="muted small">${esc(c.role)} · 보컬 ${c.stats.vocal} / 댄스 ${c.stats.dance}</div></div>`).join('')}</div></div><div class="card"><h3>그룹 기획</h3><label>그룹명</label><input value="${esc(s.groupName)}" onchange="s.groupName=this.value.slice(0,32);render()"><label>콘셉트</label><select onchange="s.concept=this.value;render()">${CONCEPTS.map(x=>`<option ${x===s.concept?'selected':''}>${x}</option>`).join('')}</select><p>멤버 ${s.members.length}명 / 최대 8명</p><p>${s.members.map(id=>esc(t(id)?.name)).join(' · ')}</p><p>그룹 실력 ${groupPower()} · 팀워크 ${s.teamwork}</p><button class="primary" onclick="debut()" ${s.debut?'disabled':''}>${s.debut?'이미 데뷔함':'데뷔 쇼케이스 개최 (250만)'}</button><p class="small muted">데뷔 조건: 2명 이상, 자금 250만 이상, 4개월차 이후. 성공 여부는 그룹 실력과 팬덤에 따라 달라집니다.</p></div></div>`}function toggleMember(id){if(s.members.includes(id)){if(s.members.length<=1)return toast('최소 1명 필요');s.members=s.members.filter(x=>x!==id)}else if(s.members.length<8)s.members.push(id);render()}function groupPower(){const a=s.members.map(t).filter(Boolean);return a.length?Math.round(a.reduce((z,c)=>z+(c.stats.vocal+c.stats.dance+c.stats.creative+c.stats.streaming)/4,0)/a.length):0}function debut(){if(s.debut||s.month<4||s.members.length<2||s.budget<250)return toast('데뷔 조건을 확인하세요');s.budget-=250;const score=groupPower()+s.teamwork*.15+s.buzz*.1+rand(-12,12);s.debut=true;s.phase='debut';s.fans+=Math.max(60,Math.round(score*12));s.reputation=clamp(s.reputation+10);log(`${s.groupName} ${s.members.length}인조 데뷔! 쇼케이스 평가 ${Math.round(score)}점`);render()}
function studio(){return `<h2>음악·가사·뮤직비디오 스튜디오</h2><div class="split"><div class="card"><h3>새 싱글 기획</h3><label>곡 제목</label><input id="songtitle" value="우리의 첫 번째 별"><label>장르</label><select id="genre">${CONCEPTS.map(x=>`<option ${x===s.concept?'selected':''}>${x}</option>`).join('')}</select><label>키워드 / 가사 주제</label><input id="keywords" value="꿈, 별빛, 우정, 무대"><label>곡 제작비 (만 원)</label><select id="production"><option value="45">인디 제작 45</option><option value="120">프로 스튜디오 120</option><option value="280">프리미엄 280</option></select><p><button class="primary" onclick="createSong()">가사·음악 기획 생성</button></p><p class="muted small">오프라인에서는 독자적 템플릿 가사·곡 메타데이터·MV 스토리보드를 생성합니다. 실제 오디오·영상 파일 생성은 외부 AI API 연결이 필요합니다.</p></div><div class="card"><h3>곡 카탈로그</h3>${s.songs.map((x,i)=>`<div class="card"><b>${esc(x.title)}</b><div class="small muted">${esc(x.genre)} · 품질 ${x.quality} · ${x.released?'발매됨':'미발매'}</div><div class="row"><button onclick="viewSong(${i})">가사·MV</button><button onclick="releaseSong(${i})" ${x.released||!s.debut?'disabled':''}>발매 (30만)</button></div></div>`).join('')||'<p class="muted">아직 제작한 곡이 없습니다.</p>'}</div></div><div id="songdetail"></div>`}function createSong(){const title=$('songtitle').value.trim().slice(0,60),genre=$('genre').value,words=$('keywords').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),cost=Number($('production').value);if(!title||s.budget<cost)return toast('제목 또는 제작비 확인');s.budget-=cost;const quality=clamp(Math.round(groupPower()*.55+s.members.map(id=>t(id).stats.creative).reduce((a,b)=>a+b,0)/s.members.length*.35+cost/20+rand(-12,12)));const hook=words[0]||'별빛',second=words[1]||'내일';const lyrics=`[Verse 1]\n작은 연습실 창 너머로 ${hook}이 내려와\n멈춘 시계도 우리 발걸음에 맞춰 뛰어\n낯선 내일 앞에서 서로의 이름을 불러\n흩어진 목소리가 하나의 길이 돼\n\n[Pre-Chorus]\n서툰 마음을 숨기지 않아\n이 밤을 지나 ${second}으로 가\n\n[Chorus]\nWe rise, we shine, ${hook}을 따라서\n너와 나의 목소리가 하늘에 닿을 때\n다시 시작해, 끝이 아닌 오늘\n우리의 노래로 새벽을 밝혀\n\n[Bridge]\n넘어진 자리마다 피어난 작은 빛\n손을 잡아, 혼자가 아니야\n\n[Final Chorus]\nWe rise, we shine, 더 멀리 날아가\n${second}의 끝에서도 함께 노래해`;const storyboard=[`0~15초: ${s.concept} 세계관의 도시, 멤버 등장`,`15~40초: 연습실 회상과 솔로 클로즈업`,`40~70초: 후렴 퍼포먼스와 군무`,`70~100초: 멤버별 상징 장면과 팬 응원`,`100~130초: 최종 무대, 그룹 로고`];s.songs.push({title,genre,keywords:words,cost,quality,lyrics,storyboard,released:false,month:s.month,group:s.groupName,members:[...s.members]});log(`신곡 '${title}' 제작 (품질 ${quality})`);render();viewSong(s.songs.length-1)}function viewSong(i){const x=s.songs[i];$('songdetail').innerHTML=`<div class="card"><h3>${esc(x.title)} · 제작 데이터</h3><div class="row"><button onclick="downloadSong(${i})">곡 기획 JSON 다운로드</button><button onclick="copyPrompt(${i})">외부 AI 제작 프롬프트 복사</button></div><h4>오리지널 가사 초안</h4><pre>${esc(x.lyrics)}</pre><h4>MV 스토리보드</h4>${x.storyboard.map(z=>`<p>${esc(z)}</p>`).join('')}</div>`}function downloadBlob(filename,text,kind='application/json'){const b=new Blob([text],{type:kind}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function downloadSong(i){downloadBlob('song_'+i+'.json',JSON.stringify(s.songs[i],null,2))}function copyPrompt(i){const x=s.songs[i];navigator.clipboard?.writeText(`Original K-pop virtual idol track. Group: ${x.group}. Genre: ${x.genre}. Concept: ${s.concept}. Quality target: ${x.quality}. Members: ${x.members.map(id=>t(id)?.name).join(', ')}. Original lyrics:\n${x.lyrics}\nStoryboard:\n${x.storyboard.join('\n')}`).then(()=>toast('프롬프트 복사 완료')).catch(()=>toast('복사 권한이 필요합니다'))}function releaseSong(i){const x=s.songs[i];if(!s.debut||x.released||s.budget<30)return toast('데뷔 또는 예산 확인');s.budget-=30;x.released=true;const hits=Math.round((x.quality*8+s.buzz*7+s.fans*.08)*(.6+Math.random()*.8));s.fans+=hits;s.buzz=clamp(s.buzz+Math.round(x.quality/9));s.releases.push({song:i,month:s.month,streams:hits*rand(20,70),viral:false});log(`'${x.title}' 발매! 신규 팬 ${money(hits)}명`);render()}
function activity(){return `<h2>활동·팬덤 운영</h2><div class="grid">${[{id:'stream',name:'라이브 방송',cost:8,desc:'시청자 소통, 팬 유입, 멤버 피로 증가'},{id:'short',name:'숏폼 챌린지',cost:18,desc:'바이럴 확률, 화제성 상승'},{id:'collab',name:'콜라보 방송',cost:30,desc:'새로운 시청자층과 업계 평판'},{id:'fan',name:'팬미팅',cost:40,desc:'팬 충성도와 그룹 신뢰 강화'},{id:'mv',name:'뮤직비디오 홍보',cost:75,desc:'발매곡 재조명 및 역주행 가능성'},{id:'rest',name:'휴식과 회복',cost:15,desc:'멤버들의 피로와 스트레스 완화'}].map(a=>`<div class="card"><h3>${a.name}</h3><p class="muted small">${a.desc}</p><button onclick="activityAction('${a.id}',${a.cost})">진행 · ${a.cost}만</button></div>`).join('')}</div><div class="card"><h3>음원 성적</h3>${s.releases.map(r=>`<div class="stat"><span>${esc(s.songs[r.song]?.title)} ${r.viral?'🔥 역주행':''}</span><b>${money(r.streams)} 스트림</b></div>`).join('')||'발매된 음원이 없습니다.'}</div>`}function activityAction(id,cost){if(s.budget<cost)return toast('자금 부족');if(!s.debut&&id!=='rest'&&id!=='stream')return toast('데뷔 후 이용 가능');s.budget-=cost;const power=groupPower(),bonus=rand(10,70)+Math.round(power*.6);if(id==='rest'){s.trainees.forEach(c=>{c.fatigue=clamp(c.fatigue-25);c.stats.stress=clamp(c.stats.stress-15)});log('휴식으로 컨디션 회복')}else if(id==='stream'){s.fans+=bonus;s.buzz=clamp(s.buzz+3);s.trainees.filter(c=>s.members.includes(c.id)).forEach(c=>c.fatigue=clamp(c.fatigue+5));log(`라이브 방송 신규 팬 ${bonus}명`)}else if(id==='short'){s.buzz=clamp(s.buzz+rand(5,15));s.fans+=bonus*2;log('숏폼 챌린지가 화제를 모았다')}else if(id==='collab'){s.fans+=bonus*3;s.reputation=clamp(s.reputation+5);log('콜라보 방송 성공')}else if(id==='fan'){s.loyalty=clamp(s.loyalty+12);s.teamwork=clamp(s.teamwork+4);s.fans+=bonus;log('팬미팅으로 팬덤 결속 강화')}else if(id==='mv'){if(!s.releases.length){s.budget+=cost;return toast('발매된 곡이 없습니다')}const r=s.releases[rand(0,s.releases.length-1)];if(Math.random()<.3+s.buzz/300){r.viral=true;s.viral++;r.streams*=rand(4,12);s.fans+=bonus*20;s.buzz=clamp(s.buzz+25);log(`🔥 '${s.songs[r.song].title}' 역주행!`)}else{r.streams+=bonus*100;s.fans+=bonus*2;log('MV 홍보로 음원 관심 상승')}}render()}
function eligibleEvents(){return DATA.events.filter(e=>!s.eventsSeen.includes(e.id)&&s.month>=e.month_min&&s.month<=e.month_max&&(!e.actor_id||!!t(e.actor_id))&&(!e.conditions?.phase||e.conditions.phase===s.phase)&&(!e.conditions?.min_stat?.training||s.trainees.some(c=>c.training>=e.conditions.min_stat.training)))}function nextMonth(){if(s.pending)return toast('이벤트 선택을 먼저 완료하세요');if(s.ending)return toast('이미 엔딩에 도달했습니다');let cost=30;for(const c of s.trainees){const task=TASKS[c.assigned]||TASKS.rest;cost+=task.cost}if(s.budget<cost)return toast('월간 운영비가 부족합니다. 활동 또는 재시작이 필요합니다');s.budget-=cost;for(const c of s.trainees){const task=TASKS[c.assigned]||TASKS.rest;const gain=rand(2,6);if(task.stat)c.stats[task.stat]=clamp(c.stats[task.stat]+gain*(c.fatigue>70?.4:1));if(c.assigned==='bond'){c.stats.trust=clamp(c.stats.trust+3);s.teamwork=clamp(s.teamwork+1)}c.fatigue=clamp(c.fatigue+task.fatigue);c.stats.stress=clamp(c.stats.stress+(c.fatigue>75?8:-2));c.training+=2}if(s.debut){const monthly=Math.round(s.fans*.014+s.loyalty*1.8);s.budget+=monthly;s.fans+=rand(12,80)+Math.round(s.buzz/3);for(const r of s.releases){r.streams+=Math.round((r.viral?8:1)*rand(200,1200)*(s.fans/2000+1));if(!r.viral&&s.month-r.month>=3&&Math.random()<.015+s.buzz/1500){r.viral=true;s.viral++;s.fans+=rand(500,3000);log(`🔥 과거 음원 '${s.songs[r.song].title}' 자연 역주행`)}}}s.month++;s.buzz=clamp(s.buzz-2);if(s.month%3===0){s.reputation=clamp(s.reputation+Math.round((groupPower()-50)/15));log(`분기 평가: 그룹 역량 ${groupPower()}점`)}if(s.month>=72){finish();render();return}const events=eligibleEvents();if(events.length&&Math.random()<.8){const e=events[rand(0,events.length-1)];s.pending=e.id;log(`이벤트 발생: ${e.title}`)}else log('월간 스케줄 종료');render()}
function pendingHTML(){const e=DATA.events.find(x=>x.id===s.pending);if(!e)return '';return `<div class="card" style="border-color:#a678e0"><h3>✦ 이벤트 · ${esc(e.title)}</h3><p class="muted">${esc(e.location)} · ${esc(e.category)}</p>${e.dialogue.map(d=>`<p><b>${esc(d.speaker==='narrator'?'내레이션':d.speaker==='producer'?'프로듀서':d.speaker)}</b>: ${esc(d.line)}</p>`).join('')}<div class="choices">${e.choices.map((c,i)=>`<button onclick="chooseEvent(${i})">${i+1}. ${esc(c.text)}</button>`).join('')}</div></div>`}function chooseEvent(i){const e=DATA.events.find(x=>x.id===s.pending);if(!e)return;const c=e.choices[i];if(!c)return;for(const [k,v]of Object.entries(c.effects||{})){if(k==='budget')s.budget=Math.max(0,s.budget+v);else if(k==='stress')s.trainees.filter(x=>s.members.includes(x.id)).forEach(x=>x.stats.stress=clamp(x.stats.stress+v));else if(k==='trust')s.trainees.filter(x=>s.members.includes(x.id)).forEach(x=>x.stats.trust=clamp(x.stats.trust+v));else s[k]=clamp((s[k]||0)+v)}s.flags.push(...(c.next_flags||[]));s.eventsSeen.push(e.id);log(`${e.title}: ${c.text}`);s.pending=null;render()}
function endingScore(e){let ok=s.month>=(e.conditions?.min_month||0);for(const [k,v]of Object.entries(e.conditions?.min_stats||{})){const val=k==='global_fans'?s.global_fans:k==='training'?groupPower():s[k]??0;if(val<v)ok=false}return ok}function finish(){s.global_fans=clamp(Math.round(s.fans/3000+s.viral*8));const candidates=DATA.endings.filter(endingScore).sort((a,b)=>b.priority-a.priority);s.ending=(candidates[0]||DATA.endings.at(-1)).id;log('최종 평가가 완료되었습니다')}function endings(){const ending=DATA.endings.find(e=>e.id===s.ending);return `<h2>멀티 엔딩 · 72개월 장기 육성</h2>${ending?`<div class="card"><h2>🏆 ${esc(ending.title)}</h2><p>${esc(ending.epilogue)}</p>${ending.dialogue?.map(x=>`<p>${esc(x.speaker)}: ${esc(x.line)}</p>`).join('')}</div>`:`<div class="card"><p>72개월차에 누적 팬덤, 역주행, 창작·관계·평판 등을 평가하여 엔딩이 결정됩니다.</p><button onclick="finish();render()">현재 시점 조기 엔딩 평가</button></div>`}<h3>엔딩 도감 · ${DATA.endings.length}종</h3><div class="grid">${DATA.endings.map(e=>`<div class="card"><b>${esc(e.title)}</b><p class="small muted">${Object.entries(e.conditions?.min_stats||{}).map(([k,v])=>k+' ≥ '+v).join(' · ')||'특수 조건'} · ${e.conditions?.min_month||0}개월 이후</p></div>`).join('')}</div><button onclick="if(confirm('현재 진행을 초기화할까요?')){s=fresh();render()}">새 게임 시작</button>`}function exportSave(){downloadBlob('project_idol_save.json',JSON.stringify(s,null,2))}function importSave(ev){const f=ev.target.files[0];if(!f)return;f.text().then(x=>{try{const obj=JSON.parse(x);if(!Array.isArray(obj.trainees)||!Array.isArray(obj.members))throw Error('invalid');s=obj;render();toast('불러오기 완료')}catch{toast('저장 파일 형식 오류')}})}render();</script></body></html>

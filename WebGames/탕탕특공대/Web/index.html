const $=id=>document.getElementById(id),rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let state='menu',last=0,elapsed=0,spawnTimer=0,bossStage=0,nextHazard=120,shake=0,flash=0,score=0,enemyId=0;const enemies=[],shots=[],gems=[],particles=[],areas=[],enemyShots=[],texts=[],hazards=[];const keys=new Set();let joy={active:false,id:null,x:0,y:0,dx:0,dy:0};let player;let pendingLevels=0,lastHazardWave=-1;let rerolls=2,banishes=1,banished=new Set(),dashCooldown=0,dashTime=0,dashVector={x:1,y:0},runStats={damage:0,taken:0,crit:0};const evoPairs={kunai:'atk',guardian:'cooldown',rocket:'hp',lightning:'cooldown',molotov:'heal',drill:'speed'};let difficulty='normal';let profile={gold:0,attack:0,hp:0,armor:0,best:0,wins:0,runs:0};try{profile={...profile,...JSON.parse(localStorage.getItem('survivor_profile_v2')||'{}')}}catch(e){}const gearCatalog={blade:{name:'⚔️ 전술 블레이드',cost:110,desc:'공격력 +6%/레벨'},vest:{name:'🦺 방탄 조끼',cost:100,desc:'최대 체력 +10/레벨'},boots:{name:'🥾 경량 부츠',cost:90,desc:'이동 속도 +4%/레벨'}};profile.gear=profile.gear||{blade:0,vest:0,boots:0};function saveProfile(){try{localStorage.setItem('survivor_profile_v2',JSON.stringify(profile))}catch(e){}}
const definitions={kunai:{name:'쿠나이',icon:'🥷',desc:'가장 가까운 적을 추적하는 수리검',kind:'weapon',max:5},guardian:{name:'수호자',icon:'🛡️',desc:'주위를 회전하는 방어 칼날',kind:'weapon',max:5},rocket:{name:'로켓',icon:'🚀',desc:'적 무리에게 광역 폭발',kind:'weapon',max:5},lightning:{name:'번개',icon:'⚡',desc:'적에게 연쇄 낙뢰',kind:'weapon',max:5},molotov:{name:'화염병',icon:'🔥',desc:'지속 피해를 주는 불 장판',kind:'weapon',max:5},drill:{name:'드릴',icon:'🌀',desc:'적을 관통하는 고속 탄환',kind:'weapon',max:5},atk:{name:'고화력 탄약',icon:'💥',desc:'공격력 레벨당 +12%',kind:'passive',max:5},speed:{name:'운동화',icon:'👟',desc:'이동 속도 레벨당 +9%',kind:'passive',max:5},cooldown:{name:'에너지 큐브',icon:'🔋',desc:'공격 쿨다운 레벨당 -7%',kind:'passive',max:5},hp:{name:'피트니스 가이드',icon:'❤️',desc:'최대 HP 레벨당 +15%',kind:'passive',max:5},magnet:{name:'자석',icon:'🧲',desc:'경험치 흡수 범위 증가',kind:'passive',max:5},heal:{name:'에너지 드링크',icon:'🥤',desc:'매초 HP 회복',kind:'passive',max:5}};

function show(html){$('panel').innerHTML=html;$('overlay').classList.remove('hidden')}function hide(){$('overlay').classList.add('hidden')}
function menu(){state='menu';show('<h1>⚔️ 서바이버 아레나</h1><p>탕탕특공대 전투 구조를 참고한 독립적인 웹 프로토타입<br>자동 공격 · 스킬 성장 · 무기 진화 · 보스 전투 · 회피 대시</p><p><b>이동:</b> WASD / 방향키 / 터치 조이스틱 · <b>대시:</b> 스페이스 / 💨<br><b>목표:</b> 5분 동안 생존하고 2페이즈 최종 보스를 처치하세요.</p><p id="meta"></p><p>난이도 <select id="difficulty" style="background:#17283d;color:white;padding:9px;border-radius:8px"><option value="normal">일반</option><option value="hard">도전 (HP·공격력 1.5배)</option></select></p><button class="action" id="start">게임 시작</button> <button class="action" id="buyAtk">공격 강화</button> <button class="action" id="buyHp">체력 강화</button> <button class="action" id="buyArmor">방어 강화</button> <button class="action" id="gear">🎒 장비 제작</button> <button class="action" id="guide">📖 조작·진화 도감</button><p class="hint">원작의 공식 게임이 아니며 데이터 수치는 프로토타입용 가정값입니다.</p>');$('difficulty').value=difficulty;$('difficulty').onchange=e=>difficulty=e.target.value;$('start').onclick=reset;function refreshMeta(){$('meta').textContent=`보유 골드 ${profile.gold} · 영구 공격 Lv.${profile.attack} · 영구 체력 Lv.${profile.hp} · 방어 Lv.${profile.armor} · 최고 처치 ${profile.best||0} · 승리 ${profile.wins||0}회 (강화 비용 ${30+profile.attack*25}/${30+profile.hp*25}/${40+profile.armor*30})`}$('gear').onclick=gearMenu;$('guide').onclick=guideMenu;$('buyAtk').onclick=()=>{let c=30+profile.attack*25;if(profile.gold>=c){profile.gold-=c;profile.attack++;saveProfile();refreshMeta();$('gear').onclick=gearMenu;$('guide').onclick=guideMenu}};$('buyHp').onclick=()=>{let c=30+profile.hp*25;if(profile.gold>=c){profile.gold-=c;profile.hp++;saveProfile();refreshMeta()}};$('buyArmor').onclick=()=>{let c=40+profile.armor*30;if(profile.gold>=c){profile.gold-=c;profile.armor++;saveProfile();refreshMeta()}};refreshMeta()}
function dash(){if(state!=='playing'||dashCooldown>0)return;dashCooldown=5;dashTime=.23;player.inv=Math.max(player.inv,.3);effect(player.x,player.y,'#6efde3',12)}function pause(){if(state==='playing'){state='paused';show('<h1>⏸ 일시정지</h1><p>현재 진행 시간이 유지됩니다.</p><button class="action" id="resume">계속하기</button> <button class="action" id="restart">처음부터</button>');$('resume').onclick=()=>{state='playing';hide()};$('restart').onclick=reset}else if(state==='paused'){state='playing';hide()}}$('pause').onclick=pause;
function upgradeOptions(){const ownedW=Object.keys(player.levels).filter(k=>definitions[k].kind==='weapon').length,ownedP=Object.keys(player.levels).filter(k=>definitions[k].kind==='passive').length;let options=Object.keys(definitions).filter(k=>(player.levels[k]||0)<5&&(player.levels[k]||definitions[k].kind==='weapon'&&ownedW<6||definitions[k].kind==='passive'&&ownedP<6));options=options.filter(k=>!banished.has(k));for(let i=options.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[options[i],options[j]]=[options[j],options[i]]}return options.slice(0,3)}
function levelUp(){state='level';const opts=upgradeOptions();if(!opts.length){player.hp=Math.min(player.maxHp,player.hp+30);state='playing';return}show('<h1>✨ 레벨 업! Lv.'+player.lv+'</h1><p>강화할 스킬을 선택하세요</p><div class="cards">'+opts.map(k=>{let d=definitions[k];return `<button class="card" data-skill="${k}"><span class="emoji">${d.icon}</span><b>${d.name}</b><span class="tag">${d.kind==='weapon'?'액티브':'패시브'} · Lv.${(player.levels[k]||0)+1}</span><br><small>${d.desc}</small></button>`}).join('')+'</div><p><button class="action" id="reroll" style="font-size:13px;padding:9px 14px">🔄 다시 뽑기 ('+rerolls+')</button> <button class="action" id="banish" style="font-size:13px;padding:9px 14px">🚫 첫 선택지 제외 ('+banishes+')</button></p><p class="hint">5레벨 무기 + 대응 패시브 + 보급 상자로 진화 · 스페이스/대시 버튼으로 회피</p>');$('reroll').disabled=rerolls<=0;$('reroll').onclick=()=>{if(rerolls>0){rerolls--;levelUp()}};$('banish').disabled=banishes<=0;$('banish').onclick=()=>{if(banishes>0&&opts.length){banishes--;banished.add(opts[0]);levelUp()}};document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>{let k=b.dataset.skill,oldMax=player.maxHp;player.levels[k]=(player.levels[k]||0)+1;if(k==='hp'){player.maxHp=(100+profile.hp*15+profile.gear.vest*10)*(1+.15*player.levels.hp);player.hp+=player.maxHp-oldMax}state='playing';hide();updateHud();if(pendingLevels>0){pendingLevels--;levelUp()}})}
function gainXp(n){player.xp+=n*(1+.08*(player.levels.magnet||0));while(player.xp>=player.need){player.xp-=player.need;player.lv++;player.need=Math.round(player.need*1.19+4);pendingLevels++}if(pendingLevels&&state==='playing'){pendingLevels--;levelUp()}}
function spawnEnemy(type,x,y){const t={grunt:[30,60,10,12,'#9bdb83'],runner:[20,100,9,10,'#ffb86e'],tank:[145,34,17,18,'#a99bea'],ranged:[40,48,11,12,'#70c5e6'],elite:[750,53,26,24,'#f6c24f'],splitter:[95,43,13,17,'#c9a0ff'],sniper:[50,40,12,12,'#f48fb1'],mini:[16,120,7,8,'#d5baff'],boss:[3700,47,45,35,'#e36b9c']}[type];let scale=(1+elapsed/90)*(difficulty==='hard'?1.5:1);enemies.push({id:++enemyId,type,x,y,r:t[3],hp:t[0]*scale,max:t[0]*scale,speed:t[1],dmg:t[2]*(difficulty==='hard'?1.5:1),color:t[4],attack:rand(0,2),hit:0,phase:0,charge:0,chargeX:0,chargeY:0,skillTimer:type==='boss'?4:0,age:0,seed:rand(0,6.28)})}
function spawnRing(type){let a=rand(0,Math.PI*2),dist=Math.max(W,H)*.7+60;spawnEnemy(type,player.x+Math.cos(a)*dist,player.y+Math.sin(a)*dist)}

function damage(e,amount){if(e.hp<=0)return;const dealt=Math.min(e.hp,amount);runStats.damage+=dealt;e.hp-=amount;if(e.type==='boss'&&e.hp>0&&e.hp/e.max<.5)e.phase=2;e.hit=.1;if(e.hp<=0){player.kills++;score++;if(e.type==='splitter'&&enemies.length<235){for(let j=0;j<3;j++){let a=j*Math.PI*2/3;spawnEnemy('mini',e.x+Math.cos(a)*18,e.y+Math.sin(a)*18)}}effect(e.x,e.y,e.color,e.type==='boss'?35:7);let xp=e.type==='boss'?50:e.type==='elite'?20:e.type==='tank'?5:2;if(gems.length<650)gems.push({x:e.x,y:e.y,r:e.type==='boss'?9:5,val:xp});else{let g=gems[Math.floor(Math.random()*gems.length)];if(g&&!g.chest&&!g.heal&&!g.magnetAll)g.val+=xp}if(e.type==='elite'||e.type==='boss')gems.push({x:e.x+22,y:e.y,r:12,val:0,chest:true});if(Math.random()<.07)gems.push({x:e.x+12,y:e.y-8,r:7,val:0,heal:12});if(Math.random()<.13)player.gold++;if(Math.random()<.006)gems.push({x:e.x-15,y:e.y+9,r:10,val:0,magnetAll:true});if(e.type==='boss'){if(elapsed>=300){finish(true)}else{player.gold+=100;for(let i=0;i<15;i++)gems.push({x:e.x+rand(-80,80),y:e.y+rand(-80,80),r:7,val:6})}}}}
function hurt(amount){amount=Math.max(1,amount*(1-Math.min(.6,profile.armor*.045)));if(player.inv>0||dashTime>0)return;player.hp-=amount;runStats.taken+=amount;player.inv=.65;shake=8;flash=.35;effect(player.x,player.y,'#ff526a',12);if(player.hp<=0){player.hp=0;finish(false)}}
function finish(win){if(state==='win'||state==='dead')return;profile.gold+=player.gold;profile.best=Math.max(profile.best||0,player.kills);if(win)profile.wins=(profile.wins||0)+1;saveProfile();state=win?'win':'dead';show(`<h1>${win?'🏆 생존 성공!':'💀 생존 실패'}</h1><p>${win?'최종 보스를 물리쳤습니다.':'적에게 쓰러졌습니다.'}</p><p>⏱ ${fmt(elapsed)} · ⭐ Lv.${player.lv} · 💀 ${player.kills} 처치 · 🪙 ${player.gold}</p><p>⚔️ 누적 피해 ${Math.round(runStats.damage).toLocaleString()} · 🛡️ 받은 피해 ${Math.round(runStats.taken)}</p><button class="action" id="again">다시 도전</button>`);$('again').onclick=reset}
function nearest(x,y,range=1e9){let best=null,bd=range*range;for(let e of enemies){if(e.hp<=0)continue;let dx=e.x-x,dy=e.y-y,d=dx*dx+dy*dy;if(d<bd){bd=d;best=e}}return best}
function fire(kind,lv){let target=nearest(player.x,player.y,700);if(!target)return;let a=Math.atan2(target.y-player.y,target.x-player.x),power=(1+.12*(player.levels.atk||0))*(1+.08*profile.attack+.06*profile.gear.blade)*(player.evolved[kind]?1.8:1),speed=1+.1*(player.levels.speed||0);if(kind==='kunai'){for(let i=0;i<(player.evolved.kunai?4:lv>=4?2:1);i++)shots.push({kind:'kunai',x:player.x,y:player.y,vx:Math.cos(a+i*.14)*470,vy:Math.sin(a+i*.14)*470,r:6,life:1.7,dmg:(24+lv*13)*power,hit:new Set(),pierce:player.evolved.kunai?99:lv>=5?3:0,color:'#ffeb98',homing:true,chain:player.evolved.kunai?2:0})}else if(kind==='rocket'){shots.push({kind:'rocket',x:player.x,y:player.y,vx:Math.cos(a)*300,vy:Math.sin(a)*300,r:9,life:2.5,dmg:(45+lv*24)*power,hit:new Set(),pierce:0,color:'#ff9964',aoe:65+lv*13+(player.evolved.rocket?65:0),burn:!!player.evolved.rocket})}else if(kind==='drill'){for(let i=0;i<Math.min(3,1+Math.floor(lv/2));i++){let an=a+(i-(Math.min(3,1+Math.floor(lv/2))-1)/2)*.25;shots.push({kind:'drill',x:player.x,y:player.y,vx:Math.cos(an)*580,vy:Math.sin(an)*580,r:7,life:1.8,dmg:(20+lv*12)*power,hit:new Set(),pierce:99,color:'#7be3f5',returning:!!player.evolved.drill,originX:player.x,originY:player.y})}}else if(kind==='lightning'){let list=enemies.filter(e=>e.hp>0).sort((u,v)=>(u.x-player.x)**2+(u.y-player.y)**2-(v.x-player.x)**2-(v.y-player.y)**2).slice(0,1+Math.floor(lv/2)+(player.evolved.lightning?3:0));for(let e of list){let x=e.x,y=e.y;damage(e,(50+lv*25)*power);areas.push({kind:'lightning',x,y,r:18,life:.24,max:.24});if(player.evolved.lightning){for(let t of enemies)if(t!==e&&t.hp>0&&Math.hypot(t.x-x,t.y-y)<105)damage(t,(15+lv*8)*power)}}}else if(kind==='molotov'){areas.push({kind:'fire',x:target.x,y:target.y,r:50+lv*12+(player.evolved.molotov?45:0),life:3+lv*.4,max:3+lv*.4,tick:0,dmg:(12+lv*6)*power});if(player.evolved.molotov)for(let i=0;i<3;i++){let an=i*Math.PI*2/3;areas.push({kind:'fire',x:target.x+Math.cos(an)*85,y:target.y+Math.sin(an)*85,r:45+lv*5,life:4,

# PlayHub + PlayForge on a single VM (e2-micro), served directly (no Firebase Hosting).
#
# All three services use host networking. Hub and Forge bind only to 127.0.0.1, so the
# only public listener is Caddy (80/443). Loopback also lets Forge verify Hub sessions
# over plain HTTP (forge/Tools/hub-session-auth.cjs rejects non-loopback HTTP).
#
# Loopback ports: Hub edge 8080, Hub internal API 8090/8091 (inside the hub process),
# Forge 8190. Images and secrets come from /opt/playhub/.env (see vm.env.example).
name: playhub

services:
  hub:
    image: ${HUB_IMAGE:?set HUB_IMAGE in .env}
    restart: unless-stopped
    network_mode: host
    mem_limit: 448m
    environment:
      HOST: 127.0.0.1
      PORT: "8080"
      PLAYHUB_ROLE: public
      PLAYHUB_CHANNEL: ${PLAYHUB_CHANNEL:-dev}
      PLAYHUB_PUBLIC_ORIGIN: ${PLAYHUB_PUBLIC_ORIGIN:?set PLAYHUB_PUBLIC_ORIGIN in .env}
      PLAYHUB_SECURE_COOKIES: "true"
      PLAYHUB_BILLING_ENABLED: "1"
      PLAYHUB_OAUTH_BUILTIN_FALLBACK: "1"
      PLAYHUB_DATA_DIR: /data/hub
      # Shared with Forge's PLAYHUB_FORGE_ACCOUNTS_DIR (= <forge dir>/accounts).
      PLAYHUB_FORGE_DIR: /data/forge
      PLAYHUB_FORGE_UPSTREAM: http://127.0.0.1:8190
      PLAYHUB_FORGE_REMOTE_VERIFY: "1"
      PLAYHUB_FORGE_INTERNAL_SECRET: ${PLAYHUB_FORGE_INTERNAL_SECRET:?set PLAYHUB_FORGE_INTERNAL_SECRET in .env}
      PLAYHUB_RELAY_TICKET_SECRET: ${PLAYHUB_RELAY_TICKET_SECRET:?set PLAYHUB_RELAY_TICKET_SECRET in .env}
      PLAYHUB_REQUIRE_WS_TICKET: "1"
    volumes:
      - /var/lib/playhub/hub:/data/hub
      - /var/lib/playhub/forge:/data/forge

  relay:
    image: ${HUB_IMAGE:?set HUB_IMAGE in .env}
    command: ["node", "hub/server/spatial-relay-service.mjs"]
    restart: unless-stopped
    network_mode: host
    mem_limit: 96m
    environment:
      HOST: 127.0.0.1
      RELAY_PORT: "8095"
      PLAYHUB_ALLOWED_ORIGINS: ${PLAYHUB_PUBLIC_ORIGIN}
      PLAYHUB_RELAY_TICKET_SECRET: ${PLAYHUB_RELAY_TICKET_SECRET}
    depends_on:
      - hub

  forge:
    image: ${FORGE_IMAGE:?set FORGE_IMAGE in .env}
    restart: unless-stopped
    network_mode: host
    mem_limit: 320m
    environment:
      HOST: 127.0.0.1
      PORT: "8190"
      PUBLIC_ORIGIN: ${PLAYHUB_PUBLIC_ORIGIN}
      PLAYFORGE_BASE_PATH: /forge
      PLAYFORGE_ALLOW_GUEST: "1"
      PLAYHUB_FORGE_AUTH_MODE: hub
      PLAYHUB_SESSION_VERIFY_URL: http://127.0.0.1:8080/internal/session/verify
      PLAYHUB_FORGE_INTERNAL_SECRET: ${PLAYHUB_FORGE_INTERNAL_SECRET}
      PLAYHUB_FORGE_ACCOUNTS_DIR: /data/forge/accounts
      PLAYHUB_FORGE_STUDIOS_DIR: /data/forge/studios
      PLAYFORGE_HTTP_CACHE_DIR: /data/forge/http-cache
    volumes:
      - /var/lib/playhub/forge:/data/forge
    depends_on:
      - hub

  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    network_mode: host
    mem_limit: 96m
    environment:
      PLAYHUB_SITE: ${PLAYHUB_SITE:?set PLAYHUB_SITE in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/playhub/caddy:/data
    depends_on:
      - hub

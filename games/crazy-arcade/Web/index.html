<!doctype html><html lang="ko"><head>

<script src="vendor/playhub-locale.js"></script>
<!-- playhub-language:end --><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Bubble Arena — BnB-inspired</title><style>*{box-sizing:border-box}body{margin:0;background:#101d32;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}header{width:min(100%,900px);display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:8px;flex-wrap:wrap}h1{font-size:20px;margin:0;color:#8de8ff}button,select{border:0;border-radius:10px;background:#244768;color:white;padding:10px 13px;font-weight:700;cursor:pointer}button:hover{background:#3479a2}#hud{font-size:13px;color:#cdeaff}canvas{width:min(96vw,800px);aspect-ratio:15/11;max-height:65vh;object-fit:contain;border:4px solid #4ba5cd;border-radius:12px;touch-action:none;background:#a7d78b}#tip{font-size:12px;color:#bcd2e6;text-align:center;margin:8px}#controls{display:flex;justify-content:space-between;align-items:center;width:min(96vw,700px);padding:5px 10px;touch-action:none;user-select:none}.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,43px);gap:3px}.pad button{padding:0;font-size:20px}.pad button:nth-child(1){grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:3;grid-row:2}.pad button:nth-child(4){grid-column:2;grid-row:3}#bomb{width:90px;height:90px;border-radius:50%;background:#ff8c36;font-size:19px;box-shadow:0 5px #a94a18}#overlay{position:absolute;inset:0;background:#0c1c35bd;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:12px}#overlay.hide{display:none}#overlay strong{font-size:32px;color:#fff}#stage{position:relative;width:min(96vw,800px)}#stage canvas{width:100%;max-height:none;display:block}#controls button{touch-action:none}</style></head><body><header><h1>💦 Bubble Arena</h1><div id="hud">로딩 중</div><div><select id="difficulty"><option value="easy">AI 쉬움</option><option value="normal" selected>AI 보통</option><option value="hard">AI 어려움</option></select> <button id="restart">새 게임</button></div></header><div id="stage"><canvas id="game" width="750" height="550"></canvas><div id="overlay"><strong>💦 Bubble Arena</strong><span>물풍선으로 상대를 가두세요!<br>블록을 부수고 아이템을 모으세요.</span><button id="start">게임 시작</button></div></div><div id="tip">방향키 / WASD 이동 · 스페이스 물풍선 · R 재시작 · 모바일 터치 지원</div><div id="controls"><div class="pad"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="right">▶</button><button data-dir="down">▼</button></div><button id="bomb">💣<br>설치</button></div><script>
'use strict';const C=document.getElementById('game'),ctx=C.getContext('2d'),hud=document.getElementById('hud'),overlay=document.getElementById('overlay');const W=15,H=11,T=50;const DIR=[[1,0],[-1,0],[0,1],[0,-1]];let grid,players,bombs,flames,items,particles,keys={},heldDir=null,tick=0,running=false,score=0,last=0,acc=0,serial=0;const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const inside=(x,y)=>x>=0&&x<W&&y>=0&&y<H;const tile=(x,y)=>grid[y]?.[x]??1;const cell=(p)=>[Math.floor(p.x/T),Math.floor(p.y/T)];const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function init(){tick=0;serial=0;score=0;grid=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>x===0||y===0||x===W-1||y===H-1||(x%2===0&&y%2===0)?1:Math.random()<.57?2:0));const starts=[[1,1],[13,9],[13,1],[1,9]];for(const [sx,sy] of starts)for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(Math.abs(dx)+Math.abs(dy)<=1&&inside(sx+dx,sy+dy)&&grid[sy+dy][sx+dx]!==1)grid[sy+dy][sx+dx]=0;players=starts.map(([x,y],i)=>({id:i,x:(x+.5)*T,y:(y+.5)*T,color:['#29a6ff','#ff6868','#a55aff','#ffbb34'][i],name:['YOU','BOT A','BOT B','BOT C'][i],alive:true,trapped:0,cap:1,power:1,speed:2.4,active:0,brain:0,dir:DIR[rnd(0,3)],shield:0}));bombs=[];flames=[];items=[];particles=[];running=true;overlay.classList.add('hide');updateHud()};function updateHud(){const p=players?.[0];hud.textContent=p?`🏆 ${score}  💣 ${p.cap}  🌊 ${p.power}  👟 ${Math.round(p.speed*10)/10}  👥 ${players.filter(x=>x.alive).length}명 생존`:''}function canMove(x,y,p){const r=15;for(const [ox,oy] of [[-r,-r],[r,-r],[-r,r],[r,r]]){const tx=Math.floor((x+ox)/T),ty=Math.floor((y+oy)/T);if(tile(tx,ty)!==0)return false;for(const b of bombs){if(b.x===tx&&b.y===ty&&!b.pass.has(p.id))return false}}return true}function move(p,dx,dy){if(!p.alive||p.trapped>0)return;const speed=p.speed*(p.id===0?1:1);if(dx&&dy){dx*=.7071;dy*=.7071}const nx=p.x+dx*speed,ny=p.y+dy*speed;if(canMove(nx,p.y,p))p.x=nx;if(canMove(p.x,ny,p))p.y=ny;for(const b of bombs){if(b.pass.has(p.id)){const [px,py]=cell(p);if(px!==b.x||py!==b.y)b.pass.delete(p.id)}}for(let i=items.length-1;i>=0;i--){const it=items[i];if(Math.hypot(p.x-(it.x+.5)*T,p.y-(it.y+.5)*T)<22){if(it.kind==='cap')p.cap=Math.min(8,p.cap+1);if(it.kind==='power')p.power=Math.min(8,p.power+1);if(it.kind==='speed')p.speed=Math.min(5,p.speed+.3);if(it.kind==='shield')p.shield=300;items.splice(i,1);if(p.id===0)score+=20}}}function place(p){if(!running||!p.alive||p.trapped||p.active>=p.cap)return;const [x,y]=cell(p);if(tile(x,y)!==0||bombs.some(b=>b.x===x&&b.y===y))return;bombs.push({id:serial++,x,y,owner:p.id,range:p.power,fuse:150,pass:new Set([p.id])});p.active++}function dangerous(x,y,horizon=90){for(const f of flames)if(f.x===x&&f.y===y)return true;for(const b of bombs){if(b.fuse>horizon)continue;if(b.x===x&&b.y===y)return true;for(const [dx,dy] of DIR){for(let i=1;i<=b.range;i++){let xx=b.x+dx*i,yy=b.y+dy*i;if(tile(xx,yy)===1)break;if(xx===x&&yy===y)return true;if(tile(xx,yy)===2)break}}}return false}function explode(b){const idx=bombs.indexOf(b);if(idx<0)return;bombs.splice(idx,1);players[b.owner].active=Math.max(0,players[b.owner].active-1);let cells=[[b.x,b.y]];for(const [dx,dy] of DIR){for(let k=1;k<=b.range;k++){let x=b.x+dx*k,y=b.y+dy*k;if(!inside(x,y)||tile(x,y)===1)break;cells.push([x,y]);if(tile(x,y)===2){grid[y][x]=0;if(Math.random()<.48)items.push({x,y,kind:['cap','power','speed','shield'][rnd(0,3)]});if(b.owner===0)score+=5;break}}}for(const [x,y] of cells){flames.push({x,y,life:28});for(const other of [...bombs])if(other.x===x&&other.y===y)other.fuse=Math.min(other.fuse,1)}}function ai(p){if(!p.alive||p.trapped)return;const [cx,cy]=cell(p);const difficulty=document.getElementById('difficulty').value;const nearby=players.some(q=>q.id!==p.id&&q.alive&&Math.abs(q.x-p.x)+Math.abs(q.y-p.y)<T*3);if(p.brain--<=0){p.brain=difficulty==='hard'?8:difficulty==='normal'?18:32;let options=DIR.map(d=>{let x=cx+d[0],y=cy+d[1];let open=tile(x,y)===0&&!bombs.some(b=>b.x===x&&b.y===y);let risk=dangerous(x,y,100);let item=items.some(it=>it.x===x&&it.y===y);return {d,weight:(open?10:-100)+(risk?-90:0)+(item?25:0)+Math.random()*18}}).sort((a,b)=>b.weight-a.weight);p.dir=options[0].d;if((nearby||DIR.some(([dx,dy])=>tile(cx+dx,cy+dy)===2))&&Math.random()<(difficulty==='hard'?.15:.08)&&!dangerous(cx,cy,120))place(p)}if(dangerous(cx,cy,110)){const safe=DIR.map(d=>({d,x:cx+d[0],y:cy+d[1]})).filter(q=>tile(q.x,q.y)===0&&!dangerous(q.x,q.y,110)&&!bombs.some(b=>b.x===q.x&&b.y===q.y));if(safe.length)p.dir=safe[rnd(0,safe.length-1)].d}move(p,...p.dir)}function step(){tick++;const p=players[0];if(p.alive&&p.trapped===0){let dx=0,dy=0;if(keys.ArrowLeft||keys.KeyA||heldDir==='left')dx--;if(keys.ArrowRight||keys.KeyD||heldDir==='right')dx++;if(keys.ArrowUp||keys.KeyW||heldDir==='up')dy--;if(keys.ArrowDown||keys.KeyS||heldDir==='down')dy++;move(p,dx,dy)}for(const q of players.slice(1))ai(q);for(const b of [...bombs]){b.fuse--;if(b.fuse<=0)explode(b)}for(let i=flames.length-1;i>=0;i--)if(--flames[i].life<=0)flames.splice(i,1);for(const q of players){if(!q.alive)continue;if(q.shield>0)q.shield--;if(q.trapped>0){q.trapped--;if(q.trapped===0)q.alive=false}if(flames.some(f=>Math.abs(q.x-(f.x+.5)*T)<T*.44&&Math.abs(q.y-(f.y+.5)*T)<T*.44)&&q.trapped===0){if(q.shield>0)q.shield=0;else q.trapped=210}if(q.trapped>0)for(const other of players){if(other===q||!other.alive||other.trapped||dist(q,other)>30)continue;if(other.id===q.id)continue;if(q.id===0||other.id===0){q.alive=false;q.trapped=0}else{q.alive=false;q.trapped=0}}}if(tick%15===0)updateHud();const alive=players.filter(x=>x.alive);if(!p.alive||alive.length<=1){running=false;overlay.classList.remove('hide');overlay.querySelector('strong').textContent=p.alive?'🏆 승리!':'💧 게임 오버';overlay.querySelector('span').innerHTML=`점수: ${score}<br>다시 도전해 보세요!`;document.getElementById('start').textContent='다시 시작'}}function render(){if(!grid)return;ctx.clearRect(0,0,C.width,C.height);for(let y=0;y<H;y++)for(let x=0;x<W;x++){const px=x*T,py=y*T;ctx.fillStyle=(x+y)%2?'#a7d783':'#b7e28e';ctx.fillRect(px,py,T,T);ctx.strokeStyle='#87c47355';ctx.strokeRect(px+.5,py+.5,T-1,T-1);if(tile(x,y)===1){ctx.fillStyle='#506b8b';ctx.fillRect(px+3,py+3,T-6,T-6);ctx.fillStyle='#7698b7';ctx.fillRect(px+5,py+5,T-12,10)}else if(tile(x,y)===2){ctx.fillStyle='#c17b43';ctx.fillRect(px+5,py+7,T-10,T-12);ctx.fillStyle='#f1b46d';ctx.fillRect(px+7,py+8,T-14,11);ctx.strokeStyle='#92512b';ctx.strokeRect(px+5,py+7,T-10,T-12)}}for(const it of items){const x=(it.x+.5)*T,y=(it.y+.5)*T;ctx.fillStyle='#fff8d0';ctx.beginPath();ctx.arc(x,y,16,0,Math.PI*2);ctx.fill();ctx.font='23px sans-serif';ctx.textAlign='center';ctx.fillText(({cap:'💣',power:'🌊',speed:'👟',shield:'🛡️'})[it.kind],x,y+8)}for(const b of bombs){const x=(b.x+.5)*T,y=(b.y+.5)*T;ctx.fillStyle='#168bd5';ctx.beginPath();ctx.arc(x,y,18+Math.sin(tick*.17)*2,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d6f8ff';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(x-7,y-7,5,3,-.6,0,Math.PI*2);ctx.fill()}for(const f of flames){const x=(f.x+.5)*T,y=(f.y+.5)*T;ctx.fillStyle=`rgba(38,199,250,${Math.min(.85,f.life/18)})`;ctx.fillRect(x-24,y-24,48,48);ctx.fillStyle='#d8faff';ctx.beginPath();ctx.arc(x,y,10+Math.sin(tick)*4,0,Math.PI*2);ctx.fill()}for(const p of players){if(!p.alive)continue;ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(0,15,16,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(0,-2,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.ellipse(-6,-5,5,7,0,0,Math.PI*2);ctx.ellipse(6,-5,5,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#23354a';ctx.beginPath();ctx.arc(-5,-4,2,0,Math.PI*2);ctx.arc(7,-4,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff9';ctx.beginPath();ctx.arc(-8,-12,5,0,Math.PI*2);ctx.fill();if(p.trapped){ctx.strokeStyle='#a4f4ff';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,-2,24,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#b7f6ff55';ctx.fill()}if(p.shield){ctx.strokeStyle='#ffe067';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,24,0,Math.PI*2);ctx.stroke()}ctx.font='bold 11px system-ui';ctx.fillStyle='#152d42';ctx.textAlign='center';ctx.fillText(p.name,0,-25);ctx.restore()}}function loop(ts){const dt=Math.min(100,ts-last);last=ts;if(running){acc+=dt;let loops=0;while(acc>=1000/60&&loops++<6){step();acc-=1000/60}}render();requestAnimationFrame(loop)}document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='Space'&&!e.repeat&&running)place(players[0]);if(e.code==='KeyR')init()});document.addEventListener('keyup',e=>keys[e.code]=false);document.getElementById('start').onclick=init;document.getElementById('restart').onclick=init;document.getElementById('bomb').addEventListener('pointerdown',e=>{e.preventDefault();if(running)place(players[0])});for(const b of document.querySelectorAll('[data-dir]')){b.addEventListener('pointerdown',e=>{e.preventDefault();heldDir=b.dataset.dir;b.setPointerCapture(e.pointerId)});b.addEventListener('pointerup',()=>heldDir=null);b.addEventListener('pointercancel',()=>heldDir=null)}requestAnimationFrame(loop);
</script></body></html>

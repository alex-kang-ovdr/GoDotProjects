<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duck Extraction — Web Prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#101a20;color:#e9f3ed;font:14px system-ui;overflow:hidden}canvas{display:block;width:100vw;height:100vh;cursor:crosshair}#hud{position:fixed;top:12px;left:12px;background:#13222bdc;border:1px solid #496459;border-radius:12px;padding:12px;min-width:250px;pointer-events:none}#hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#13222be9;padding:9px 16px;border-radius:12px;text-align:center;pointer-events:none}#panel{position:fixed;right:12px;top:12px;width:min(340px,40vw);max-height:90vh;overflow:auto;background:#13222bf2;border:1px solid #68806e;border-radius:14px;padding:14px;display:none}#panel.open{display:block}button{background:#3b775f;color:white;border:1px solid #8fb9a1;border-radius:7px;padding:8px;margin:3px;cursor:pointer}button:hover{background:#559b79}button:disabled{opacity:.35;cursor:not-allowed}.bar{height:10px;background:#38484a;border-radius:8px;overflow:hidden;margin:5px 0}.fill{height:100%;background:#e96c66}.item{border-bottom:1px solid #40554d;padding:6px 0;display:flex;justify-content:space-between;align-items:center;gap:6px}.muted{color:#a7b7ad;font-size:12px}h2{margin:4px 0 10px}#toast{position:fixed;top:100px;left:50%;transform:translateX(-50%);background:#172e2b;padding:10px 18px;border-radius:9px;opacity:0;transition:opacity .2s;pointer-events:none}#menu{position:fixed;inset:0;background:#071014c9;display:grid;place-items:center}#menu>div{max-width:530px;background:#1c302e;border:1px solid #66816f;border-radius:18px;padding:28px;text-align:center;line-height:1.7}#menu.hidden{display:none}kbd{background:#30463d;padding:2px 5px;border-radius:4px}</style></head><body><canvas id="game"></canvas><div id="hud"></div><div id="hint"></div><div id="panel"></div><div id="toast"></div><div id="menu"><div><h1>🦆 DUCK EXTRACTION</h1><p>Duckov 장르의 탐험·전투·루팅·탈출 루프를 재구성한 오리지널 웹 프로토타입</p><p><kbd>WASD</kbd> 이동 · <kbd>마우스</kbd> 조준 · <kbd>좌클릭</kbd> 발사 · <kbd>R</kbd> 재장전 · <kbd>E</kbd> 획득/탈출 · <kbd>F</kbd> 치료 · <kbd>Tab</kbd> 가방 · <kbd>B</kbd> 기지</p><p>초록색 탈출 구역으로 이동해 E를 누르세요. 사망하면 출격 중 장비와 전리품을 잃습니다.</p><button id="start">게임 시작</button></div></div><script>
'use strict';
const C=document.getElementById('game'),ctx=C.getContext('2d'),hud=document.getElementById('hud'),panel=document.getElementById('panel'),hint=document.getElementById('hint'),toastEl=document.getElementById('toast');let W=innerWidth,H=innerHeight,DPR=1;function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;C.width=W*DPR;C.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),MAP=2600;const walls=[];for(let i=0;i<55;i++){let x=rnd(160,MAP-250),y=rnd(160,MAP-250),w=rnd(55,175),h=rnd(35,120);if(Math.hypot(x-200,y-200)<260||Math.hypot(x-(MAP-160),y-(MAP-160))<240)continue;walls.push({x,y,w,h})}const keys={},mouse={x:0,y:0,down:false};let state='base',player={x:200,y:200,r:15,hp:100,maxHp:100,ammo:24,mag:24,reserve:144,fireCd:0,reload:0,heal:2},enemies=[],loot=[],bullets=[],particles=[],kills=0,raidLoot=[],credits=+(localStorage.getItem('duck_credits')||2500),stash=JSON.parse(localStorage.getItem('duck_stash')||'{"Scrap":3,"Medkit":2}'),upgrades=JSON.parse(localStorage.getItem('duck_upgrades')||'{"armor":0,"damage":0,"storage":0}'),raidTime=0,spawnTimer=0,shake=0,cam={x:0,y:0},panelMode='',toastTimeout=0,extraction={x:MAP-160,y:MAP-160,r:66};
function save(){localStorage.setItem('duck_credits',credits);localStorage.setItem('duck_stash',JSON.stringify(stash));localStorage.setItem('duck_upgrades',JSON.stringify(upgrades))}function toast(t){toastEl.textContent=t;toastEl.style.opacity=1;toastTimeout=2.4}function circlesRect(x,y,r,o){let qx=clamp(x,o.x,o.x+o.w),qy=clamp(y,o.y,o.y+o.h);return (x-qx)**2+(y-qy)**2<r*r}function blocked(x,y,r=13){return x<r||y<r||x>MAP-r||y>MAP-r||walls.some(o=>circlesRect(x,y,r,o))}function move(obj,dx,dy){if(!blocked(obj.x+dx,obj.y,obj.r))obj.x+=dx;if(!blocked(obj.x,obj.y+dy,obj.r))obj.y+=dy}function segmentWall(ax,ay,bx,by){let steps=Math.ceil(Math.hypot(bx-ax,by-ay)/14);for(let i=1;i<=steps;i++){let t=i/steps,x=ax+(bx-ax)*t,y=ay+(by-ay)*t;if(walls.some(o=>x>o.x&&x<o.x+o.w&&y>o.y&&y<o.y+o.h))return true}return false}function spawnEnemy(){let x,y;for(let i=0;i<40;i++){x=rnd(90,MAP-90);y=rnd(90,MAP-90);if(!blocked(x,y,18)&&dist({x,y},player)>260)break}enemies.push({x,y,r:16,hp:45+upgrades.armor*0,maxHp:45,cd:rnd(.4,1.7),speed:rnd(48,78),alert:0,strafe:Math.random()<.5?-1:1})}function spawnLoot(x,y,type){loot.push({x,y,r:10,type:type||(['Scrap','Scrap','Parts','Ammo','Medkit','Relic'][Math.floor(Math.random()*6)])})}function startRaid(){state='raid';panel.classList.remove('open');panelMode='';player.x=200;player.y=200;player.hp=player.maxHp;player.ammo=player.mag;player.reserve=144;player.heal=2+(stash.Medkit||0>0?0:0);enemies=[];loot=[];bullets=[];particles=[];kills=0;raidLoot=[];raidTime=0;spawnTimer=0;for(let i=0;i<27;i++)spawnEnemy();for(let i=0;i<58;i++){let x=rnd(80,MAP-80),y=rnd(80,MAP-80);if(!blocked(x,y,12))spawnLoot(x,y)}toast('출격! 초록색 탈출 구역으로 귀환하세요.')}function endRaid(success){if(state!=='raid')return;state='base';mouse.down=false;let value=0;if(success){for(let item of raidLoot){stash[item]=(stash[item]||0)+1;value+=({Scrap:80,Parts:220,Ammo:100,Medkit:260,Relic:1100})[item]||0}credits+=Math.floor(value*.2);toast(`탈출 성공! ${raidLoot.length}개 회수 · 보너스 ${Math.floor(value*.2)}C`)}else{credits=Math.max(0,credits-250);toast('사망! 탐험 전리품 소실, 복구비 250C')}save();showPanel('base')}
function fire(){if(state!=='raid'||player.fireCd>0||player.reload>0)return;if(player.ammo<=0){reload();return}player.ammo--;player.fireCd=.12;let wx=mouse.x+cam.x,wy=mouse.y+cam.y,a=Math.atan2(wy-player.y,wx-player.x)+rnd(-.045,.045),speed=880;bullets.push({x:player.x+Math.cos(a)*20,y:player.y+Math.sin(a)*20,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life:1.1,team:0,damage:21+upgrades.damage*5});shake=2;for(let e of enemies)if(dist(e,player)<440)e.alert=4}function reload(){if(player.reload>0||player.ammo===player.mag||player.reserve<=0)return;player.reload=1.6;toast('재장전 중')}function heal(){if(state!=='raid'||player.heal<=0||player.hp>=player.maxHp)return;player.heal--;player.hp=Math.min(player.maxHp,player.hp+48);toast('체력 회복 +48')}function pickup(){if(state!=='raid')return;if(dist(player,extraction)<extraction.r){endRaid(true);return}let near=loot.findIndex(l=>dist(l,player)<55);if(near>=0){let l=loot.splice(near,1)[0];raidLoot.push(l.type);if(l.type==='Ammo')player.reserve+=24;toast(l.type+' 획득');return}toast('가까운 전리품이 없습니다')}
function showPanel(mode){panelMode=mode;panel.classList.add('open');renderPanel()}function renderPanel(){if(!panelMode)return;let s='';if(panelMode==='base'){s=`<h2>🏠 기지</h2><p>보유 화폐: <b>${credits} C</b></p><button data-act="deploy">출격하기</button><button data-act="close">닫기</button><h3>시설 업그레이드</h3>`;for(let [id,name] of [['damage','무기 공격력 +5'],['armor','최대 체력 +15'],['storage','보관함 확장']]){let cost=(upgrades[id]+1)*650;s+=`<div class="item">${name} (Lv.${upgrades[id]}) <button data-up="${id}" ${credits<cost?'disabled':''}>${cost} C</button></div>`}s+='<h3>보관함</h3>';for(let [name,num] of Object.entries(stash))s+=`<div class="item">${name} × ${num} <button data-sell="${name}">1개 판매</button></div>`;s+='<p class="muted">탐험에서 회수한 물품은 보관함에 쌓입니다. 업그레이드와 판매 내역은 자동 저장됩니다.</p>'}else{s=`<h2>🎒 탐험 가방</h2><p>회수 예정 전리품 ${raidLoot.length}개</p><button data-act="close">닫기</button><button data-act="heal">치료제 사용 (${player.heal})</button><button data-act="reload">재장전</button>`;let counts={};for(let t of raidLoot)counts[t]=(counts[t]||0)+1;for(let [n,v] of Object.entries(counts))s+=`<div class="item">${n} × ${v}</div>`;s+='<p class="muted">사망하면 현재 가방의 아이템을 모두 잃습니다.</p>'}panel.innerHTML=s}panel.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.act==='deploy')startRaid();if(b.dataset.act==='close'){panel.classList.remove('open');panelMode=''}if(b.dataset.act==='heal'){heal();renderPanel()}if(b.dataset.act==='reload'){reload();renderPanel()}if(b.dataset.up){let id=b.dataset.up,cost=(upgrades[id]+1)*650;if(credits>=cost){credits-=cost;upgrades[id]++;if(id==='armor'){player.maxHp=100+15*upgrades.armor;player.hp=player.maxHp}save();renderPanel()}}if(b.dataset.sell){let n=b.dataset.sell;if(stash[n]>0){stash[n]--;credits+=({Scrap:80,Parts:220,Ammo:100,Medkit:260,Relic:1100})[n]||30;save();renderPanel()}}});
addEventListener('keydown',e=>{if(['Tab','Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.repeat)return;if(e.code==='KeyR')reload();if(e.code==='KeyE')pickup();if(e.code==='KeyF')heal();if(e.code==='Tab'){if(panelMode==='inventory'){panelMode='';panel.classList.remove('open')}else showPanel('inventory')}if(e.code==='KeyB'&&state==='base')showPanel('base');if(e.code==='Escape'){panelMode='';panel.classList.remove('open')}});addEventListener('keyup',e=>keys[e.code]=false);C.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});C.addEventListener('mousedown',e=>{if(e.button===0)mouse.down=true});addEventListener('mouseup',()=>mouse.down=false);document.getElementById('start').onclick=()=>{document.getElementById('menu').classList.add('hidden');showPanel('base')};
function update(dt){if(toastTimeout>0){toastTimeout-=dt;if(toastTimeout<=0)toastEl.style.opacity=0}shake*=.85;if(state!=='raid')return;raidTime+=dt;player.fireCd=Math.max(0,player.fireCd-dt);if(player.reload>0){player.reload-=dt;if(player.reload<=0){let n=Math.min(player.mag-player.ammo,player.reserve);player.ammo+=n;player.reserve-=n;toast('재장전 완료')}}let vx=(keys.KeyD?1:0)-(keys.KeyA?1:0),vy=(keys.KeyS?1:0)-(keys.KeyW?1:0),len=Math.hypot(vx,vy)||1,speed=keys.ShiftLeft?225:155;move(player,vx/len*speed*dt,vy/len*speed*dt);if(mouse.down)fire();spawnTimer+=dt;if(spawnTimer>12&&enemies.length<34){spawnTimer=0;spawnEnemy()}
for(let e of enemies){if(e.hp<=0)continue;e.cd-=dt;e.alert=Math.max(0,e.alert-dt);let d=dist(e,player),visible=d<430&&!segmentWall(e.x,e.y,player.x,player.y);if(visible)e.alert=3;if(e.alert>0){let a=Math.atan2(player.y-e.y,player.x-e.x);if(d>185)move(e,Math.cos(a)*e.speed*dt,Math.sin(a)*e.speed*dt);else if(d<110)move(e,-Math.cos(a)*e.speed*.5*dt,-Math.sin(a)*e.speed*.5*dt);else move(e,-Math.sin(a)*e.speed*.36*e.strafe*dt,Math.cos(a)*e.speed*.36*e.strafe*dt);if(e.cd<=0&&visible&&d<390){e.cd=rnd(1.05,1.8);let a2=a+rnd(-.17,.17);bullets.push({x:e.x,y:e.y,vx:Math.cos(a2)*530,vy:Math.sin(a2)*530,life:1.2,team:1,damage:10})}}}
for(let i=bullets.length-1;i>=0;i--){let b=bullets[i],ox=b.x,oy=b.y;b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;let hit=b.life<=0||segmentWall(ox,oy,b.x,b.y);if(!hit&&b.team===0){for(let e of enemies)if(e.hp>0&&dist(e,b)<e.r+4){e.hp-=b.damage;e.alert=5;hit=true;if(e.hp<=0){kills++;spawnLoot(e.x+rnd(-10,10),e.y+rnd(-10,10));if(Math.random()<.35)spawnLoot(e.x+20,e.y+10)}break}}else if(!hit&&dist(player,b)<player.r+4){player.hp-=b.damage;shake=5;hit=true;if(player.hp<=0){endRaid(false);return}}if(hit){for(let j=0;j<5;j++)particles.push({x:b.x,y:b.y,vx:rnd(-85,85),vy:rnd(-85,85),life:.35,color:b.team?'#f5b3a3':'#f5e8a2'});bullets.splice(i,1)}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}if(panelMode==='inventory')renderPanel()}
function drawDuck(x,y,a,enemy=false){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle=enemy?'#bc706a':'#f4e4a1';ctx.beginPath();ctx.ellipse(0,0,17,14,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=enemy?'#994a45':'#e5ce79';ctx.beginPath();ctx.arc(6,-2,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#20292c';ctx.fillRect(5,-10,3,3);ctx.fillStyle='#f39b45';ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(25,4);ctx.lineTo(14,8);ctx.fill();ctx.strokeStyle='#273b3d';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(8,8);ctx.lineTo(28,8);ctx.stroke();ctx.restore()}
function draw(){ctx.fillStyle='#192c2a';ctx.fillRect(0,0,W,H);cam.x=clamp(player.x-W/2,0,Math.max(0,MAP-W));cam.y=clamp(player.y-H/2,0,Math.max(0,MAP-H));ctx.save();ctx.translate(-cam.x+rnd(-shake,shake),-cam.y+rnd(-shake,shake));ctx.fillStyle='#304c3e';ctx.fillRect(0,0,MAP,MAP);ctx.strokeStyle='#3a5947';ctx.lineWidth=1;for(let x=0;x<MAP;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,MAP);ctx.stroke()}for(let y=0;y<MAP;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(MAP,y);ctx.stroke()}ctx.fillStyle='#4b6750';for(let i=0;i<MAP;i+=155){let x=(i*97)%MAP,y=(i*131)%MAP;ctx.beginPath();ctx.arc(x,y,25,0,7);ctx.fill()}ctx.fillStyle='#365e4d';ctx.strokeStyle='#92e5a8';ctx.lineWidth=4;ctx.beginPath();ctx.arc(extraction.x,extraction.y,extraction.r,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#e6ffe8';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.fillText('EXTRACT [E]',extraction.x,extraction.y-75);for(let o of walls){ctx.fillStyle='#101f23';ctx.fillRect(o.x+9,o.y+10,o.w,o.h);ctx.fillStyle='#75847b';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle='#a4b1a5';ctx.strokeRect(o.x,o.y,o.w,o.h);ctx.strokeStyle='#566c64';ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.stroke()}for(let l of loot){ctx.fillStyle=l.type==='Relic'?'#f7ca62':l.type==='Medkit'?'#eb8f9a':'#b4c7b2';ctx.fillRect(l.x-8,l.y-8,16,16);ctx.strokeStyle='#1e302a';ctx.strokeRect(l.x-8,l.y-8,16,16)}for(let e of enemies){if(e.hp<=0)continue;drawDuck(e.x,e.y,Math.atan2(player.y-e.y,player.x-e.x),true);if(e.hp<e.maxHp){ctx.fillStyle='#381d21';ctx.fillRect(e.x-18,e.y-28,36,5);ctx.fillStyle='#ed8074';ctx.fillRect(e.x-18,e.y-28,36*e.hp/e.maxHp,5)}}let angle=Math.atan2(mouse.y+cam.y-player.y,mouse.x+cam.x-player.x);drawDuck(player.x,player.y,angle);ctx.strokeStyle='#e6edb5a8';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(player.x,player.y);ctx.lineTo(player.x+Math.cos(angle)*95,player.y+Math.sin(angle)*95);ctx.stroke();for(let b of bullets){ctx.fillStyle=b.team?'#ff8b73':'#ffe39a';ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fill()}for(let p of particles){ctx.fillStyle=p.color;ctx.globalAlpha=clamp(p.life*3,0,1);ctx.fillRect(p.x-3,p.y-3,6,6);ctx.globalAlpha=1}ctx.restore();if(state==='raid'){let near=loot.find(l=>dist(l,player)<55);hint.textContent=dist(player,extraction)<extraction.r?'[E] 탈출하기':near?`[E] ${near.type} 획득`:'WASD 이동 · 클릭 사격 · R 재장전 · E 획득 · F 치료 · Tab 가방';hud.innerHTML=`<b>🦆 DUCK EXTRACTION</b><div>HP ${Math.max(0,Math.ceil(player.hp))}/${player.maxHp}</div><div class="bar"><div class="fill" style="width:${Math.max(0,player.hp/player.maxHp*100)}%"></div></div><div>🔫 ${player.ammo}/${player.reserve} ${player.reload>0?'· 재장전 중':''}</div><div>💊 치료제 ${player.heal} · 🎒 전리품 ${raidLoot.length}</div><div>💀 처치 ${kills} · ⏱ ${Math.floor(raidTime/60)}:${String(Math.floor(raidTime%60)).padStart(2,'0')}</div><div class="muted">탈출 지점까지 ${Math.floor(dist(player,extraction))}m (게임 단위)</div>`;ctx.fillStyle='#142a27d9';ctx.fillRect(W-174,H-174,158,158);ctx.strokeStyle='#9cb5a1';ctx.strokeRect(W-174,H-174,158,158);let scale=150/MAP;ctx.fillStyle='#78d99a';ctx.beginPath();ctx.arc(W-170+extraction.x*scale,H-170+extraction.y*scale,4,0,7);ctx.fill();ctx.fillStyle='#fff3a2';ctx.beginPath();ctx.arc(W-170+player.x*scale,H-170+player.y*scale,4,0,7);ctx.fill()}else{hint.textContent='기지: B 메뉴 · 출격 후 탈출 지점까지 이동';hud.innerHTML=`<b>🏠 기지</b><div>화폐 ${credits} C</div><div>공격 강화 Lv.${upgrades.damage} · 방어 강화 Lv.${upgrades.armor}</div>`}}
let last=performance.now();function loop(t){let dt=Math.min((t-last)/1000,.035);last=t;update(dt);draw();requestAnimationFrame(loop)}player.maxHp=100+upgrades.armor*15;player.hp=player.maxHp;requestAnimationFrame(loop);

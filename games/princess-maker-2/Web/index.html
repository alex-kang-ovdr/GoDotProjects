function render(){ $('topchips').innerHTML=`<span class="chip">📅 ${yearMonth()}</span><span class="chip">🎂 ${age()}세</span><span class="chip">🪙 ${state.gold.toLocaleString()} G</span>`;$('agebadge').textContent=`${age()}세 · ${yearMonth()}`;$('daughter').textContent=state.name;$('profile').textContent=`양육 기간 ${Math.min(state.month,96)} / 96개월 · ${state.finished?'성장 완료':'성장 중'}`;$('stats').innerHTML=Object.entries(ST).map(([k,v])=>`<div class="stat"><span>${v}</span><div class="track"><div class="fill" style="width:${Math.min(100,state.stats[k]/(k==='stress'||k==='fatigue'?100:5))}%;${k==='stress'||k==='fatigue'?'background:#d77d76':''}"></div></div><b>${state.stats[k]}</b></div>`).join('');$('logs').innerHTML=state.logs.slice(0,13).map(x=>`<div>• ${escapeHtml(x)}</div>`).join('');let names={schedule:'📅 일정',talk:'💬 대화',shop:'🛍 상점',adventure:'⚔️ 무사수행',festival:'🏆 수확제',characters:'👥 등장인물',records:'📜 기록'};$('tabs').innerHTML=Object.entries(names).map(([k,v])=>`<button class="${tab===k?'active':''}" data-tab="${k}">${v}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('content').innerHTML=({schedule:showSchedule,talk:showTalk,shop:showShop,adventure:showAdventure,festival:showFestival,characters:showCharacters,records:showRecords}[tab])();wire()}
function escapeHtml(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showSchedule(){let opts=Object.entries(ACTIONS).map(([k,a])=>`<option value="${k}">${a.name} ${a.cost>0?'(-'+a.cost+'G)':a.cost<0?'(+'+(-a.cost)+'G)':''}</option>`).join('');return `<h2 class="section-title">한 달의 일정 편성</h2><p class="sub">한 달을 상순·중순·하순 세 구간으로 나누어 활동합니다. 수업료와 급여는 구간별로 정산합니다.</p>${state.finished?'<div class="notice">성장이 끝났습니다. 기록 탭에서 엔딩을 확인하세요.</div>':''}<div class="grid3">${state.plan.map((p,i)=>`<div class="slot"><label>${['상순 · 1~10일','중순 · 11~20일','하순 · 21~말일'][i]}</label><select data-slot="${i}" ${state.finished?'disabled':''}>${opts}</select><div class="hint" id="hint${i}"></div></div>`).join('')}</div><div class="actionrow"><button class="primary" id="advance" ${state.finished?'disabled':''}>▶ 한 달 진행</button><button class="secondary" id="balanced">균형 일정</button><button class="secondary" id="reset">새 게임</button></div><p class="hint">교육으로 능력치를 높이고, 아르바이트로 비용을 충당하세요. 스트레스와 피로가 높으면 효율이 감소합니다. 매년 9월에는 수확제가 열립니다.</p>`}
function showTalk(){return `<h2 class="section-title">딸과의 대화</h2><p>딸의 상태를 살피고 관계를 관리할 수 있습니다. 대화는 월 1회만 가능합니다.</p><div class="notice">현재 마음 상태: ${state.stats.stress>65?'매우 지쳐 있습니다.':state.stats.stress>35?'조금 예민해 보입니다.':'평온하고 밝아 보입니다.'}</div><div class="itemgrid"><div class="item"><strong>따뜻한 대화</strong><p>관계 +8, 스트레스 -5</p><button data-talk="kind">대화하기</button></div><div class="item"><strong>엄격한 훈계</strong><p>도덕성 +8, 관계 -7, 스트레스 +8</p><button data-talk="strict">훈계하기</button></div><div class="item"><strong>함께 산책</strong><p>관계 +6, 피로 -7, 스트레스 -8</p><button data-talk="walk">산책하기</button></div></div>`}
function showShop(){return `<h2 class="section-title">마을 상점</h2><p class="sub">아이템은 즉시 사용되며, 장비는 영구적으로 보유합니다.</p><div class="itemgrid">${GOODS.map(g=>`<div class="item"><strong>${g.name}</strong><p>${g.desc}</p><div class="sub">${g.cost} G</div><button data-buy="${g.id}" ${state.gold<g.cost||(g.equipment&&state.inventory.includes(g.id))?'disabled':''}>${state.inventory.includes(g.id)?'구입 완료':'구매'}</button></div>`).join('')}</div>`}
function showAdventure(){let a=adventure;return `<h2 class="section-title">무사수행 · 숲의 길</h2><p class="sub">전투는 간단한 턴제이며, 한 번의 원정으로 4×4 숲을 탐험합니다. 원정은 1개월 일정 중 무사수행을 실행할 때 시작됩니다.</p>${a?`<div class="meter"><span>❤️ HP ${a.hp}/${a.maxhp}</span><span>🧭 위치 ${a.pos+1}/16</span><span>🎒 전리품 ${a.loot}G</span></div><div class="map">${Array.from({length:16},(_,i)=>`<div class="tile ${a.pos===i?'current':''}">${a.pos===i?'🧍':a.visited.includes(i)?'🌿':'🌲'}<small>${i+1}</small></div>`).join('')}</div>${battle?`<div class="battle"><h3>⚔️ ${battle.name}</h3><p>적 HP ${battle.hp}/${battle.maxhp} · 공격 ${battle.atk}</p><div class="actionrow"><button data-fight="attack">검 공격</button><button data-fight="magic">마법 공격</button><button data-fight="defend">방어</button><button data-fight="run">도주</button></div></div>`:`<div class="actionrow"><button id="explore">다음 지역 탐색</button><button id="return">마을로 귀환</button></div>`}`:`<div class="notice">현재 진행 중인 원정이 없습니다.</div><p>일정에서 무사수행을 선택한 뒤 한 달을 진행하면 탐험이 시작됩니다.</p>`}`}
function showFestival(){let due=state.month%12===8&&!state.flags['festival'+Math.floor(state.month/12)];return `<h2 class="section-title">왕국 수확제</h2><p>매년 9월에는 세 분야의 경연이 열립니다. 능력치와 운에 따라 점수를 판정하고 상금과 평판을 얻습니다.</p><div class="itemgrid">${[{id:'beauty',name:'미인 대회',desc:'매력 + 기품 중심'},{id:'combat',name:'무술 대회',desc:'무술 + 체력 중심'},{id:'art',name:'예술 대회',desc:'예술 + 지능 중심'}].map(c=>`<div class="item"><strong>${c.name}</strong><p>${c.desc}</p><button data-contest="${c.id}" ${!due||state.finished?'disabled':''}>참가하기</button></div>`).join('')}</div><p class="hint">${due?'이번 달 수확제 참가 가능 (1개 대회 선택)':'9월에 참가할 수 있습니다. 올해 이미 참가했거나 아직 개최 기간이 아닙니다.'} · 누적 우승 ${state.festivalWins}회</p>`}

function showCharacters(){state.npcAffection??={};let cards=V7_CHARACTERS.map(n=>{let affinity=state.npcAffection[n.id]||0;let stage=[...n.stages].reverse().find(x=>affinity>=x.min)||n.stages[0];return `<div class="item"><strong>${escapeHtml(n.name)} · ${escapeHtml(n.role)}</strong><p>${escapeHtml(n.intro)}</p><div class="track"><div class="fill" style="width:${affinity}%"></div></div><p>친밀도 ${affinity}/100 · ${escapeHtml(stage.title)}</p><p>${escapeHtml(stage.line)}</p><button data-npc="${n.id}" ${state.finished?'disabled':''}>교류하기 (월 1회)</button></div>`}).join('');return `<h2 class="section-title">왕국 인물 관계도</h2><p>인물마다 친밀도와 단계별 대사가 달라집니다. 능력치에 따라 교류 보너스가 달라집니다.</p><div class="itemgrid">${cards}</div>`}
function meetNPC(id){let n=V7_CHARACTERS.find(x=>x.id===id);if(!n||state.finished)return;state.npcAffection??={};let key='npc_'+id+'_'+state.month;if(state.flags[key])return ask('이번 달 교류 완료',`${n.name}과(와) 이번 달에는 이미 만났습니다.`,[{text:'확인'}]);state.flags[key]=true;let bonus=n.affinity.some(k=>state.stats[k]>=160)?4:0;state.npcAffection[id]=Math.min(100,(state.npcAffection[id]||0)+9+bonus);change({stress:-4,relationship:1});log(`${n.name}과(와) 교류했다. 친밀도 +${9+bonus}`);save();render();let stage=[...n.stages].reverse().find(x=>state.npcAffection[id]>=x.min);ask(`${n.name} · ${stage.title}`,stage.line,[{text:'확인'}])}

function showRecords(){return `<h2 class="section-title">육성 기록</h2>${state.finished?`<div class="notice"><h2>🎖 ${escapeHtml(state.ending)}</h2>8년간의 양육을 마쳤습니다. ${escapeHtml(state.name)}의 미래가 결정되었습니다.</div>`:`<p>18세가 되는 시점에 능력치와 명성을 평가하여 엔딩이 결정됩니다.</p>`}<p>경과 ${state.month}/96개월 · 수확제 우승 ${state.festivalWins}회 · 소지금 ${state.gold}G</p><div class="actionrow"><button id="save">지금 저장</button><button id="export">저장 파일 내보내기</button><button id="import">저장 파일 불러오기</button><button id="reset">처음부터 시작</button></div><input type="file" id="file" accept=".json,application/json" style="display:none"><h3 class="section-title" style="margin-top:20px">전체 일지</h3><div class="log">${state.logs.map(t=>`<div>• ${escapeHtml(t)}</div>`).join('')}</div>`}
function wire(){document.querySelectorAll('[data-slot]').forEach(e=>{e.value=state.plan[+e.dataset.slot];e.onchange=()=>{state.plan[+e.dataset.slot]=e.value;save();render()}});document.querySelectorAll('[data-npc]').forEach(e=>e.onclick=()=>meetNPC(e.dataset.npc));document.querySelectorAll('[data-talk]').forEach(e=>e.onclick=()=>talk(e.dataset.talk));document.querySelectorAll('[data-buy]').forEach(e=>e.onclick=()=>buy(e.dataset.buy));document.querySelectorAll('[data-contest]').forEach(e=>e.onclick=()=>contest(e.dataset.contest));document.querySelectorAll('[data-fight]').forEach(e=>e.onclick=()=>fight(e.dataset.fight));if($('advance'))$('advance').onclick=advance;if($('balanced'))$('balanced').onclick=()=>{state.plan=['study','farm','rest'];save();render()};if($('reset'))$('reset').onclick=()=>ask('새 게임','현재 진행을 초기화하시겠습니까?',[{text:'초기화',action:()=>{state=fresh();adventure=null;battle=null;queue=[];tab='schedule';save();render()}},{text:'취소'}]);if($('explore'))$('explore').onclick=explore;if($('return'))$('return').onclick=returnHome;if($('save'))$('save').onclick=()=>{save();alert('브라우저에 저장했습니다.')};if($('export'))$('export').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='princess-maker-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};if($('import'))$('import').onclick=()=>$('file').click();if($('file'))$('file').onchange=async e=>{try{let s=JSON.parse(await e.target.files[0].text());if(!s.stats||!Array.isArray(s.plan)||typeof s.month!=='number'||s.month<0||s.month>96)throw Error('잘못된 저장 데이터');state=s;adventure=null;battle=null;queue=[];save();render()}catch(err){alert('불러오기 실패: '+err.message)}}}
function ask(title,body,choices){$('modalback').classList.remove('hidden');$('modal').innerHTML=`<h2>${escapeHtml(title)}</h2><p>${escapeHtml(body)}</p><div id="choices"></div>`;let root=$('choices');choices.forEach(c=>{let b=document.createElement('button');b.className='choice '+(c.action?'primary':'secondary');b.textContent=c.text;b.onclick=()=>{$('modalback').classList.add('hidden');if(c.action)c.action();};root.appendChild(b)})}
function talk(which){let key='talk'+state.month;if(state.flags[key])return ask('대화','이번 달에는 이미 충분히 이야기했습니다.',[{text:'확인'}]);state.flags[key]=true;let d={kind:{relationship:8,stress:-5},strict:{morality:8,relationship:-7,stress:8},walk:{relationship:6,fatigue:-7,stress:-8}}[which];change(d);log(`${yearMonth()}: 딸과 ${which==='kind'?'따뜻한 대화':which==='strict'?'훈계':'산책'}을 나눴습니다.`);save();render()}
function buy(id){let g=GOODS.find(x=>x.id===id);if(!g||state.gold<g.cost||g.equipment&&state.inventory.includes(id))return;state.gold-=g.cost;if(g.equipment)state.inventory.push(id);else change(g.delta);log(`${g.name} 구입 (-${g.cost}G)`);save();render()}
function applyAction(key){let a=ACTIONS[key];if(!a)return;if(a.requires&&Object.entries(a.requires).some(([k,v])=>state.stats[k]<v)){log(`${a.name}: 능력치 부족으로 일을 구하지 못했습니다.`);change({stress:3});return}if(a.cost>state.gold){log(`${a.name}: 비용이 부족하여 휴식으로 대체했습니다.`);change(ACTIONS.rest.delta);return}state.gold-=a.cost;let efficiency=state.stats.fatigue>=75||state.stats.stress>=75?.55:state.stats.fatigue>=45||state.stats.stress>=45?.8:1;let d={};for(let [k,v]of Object.entries(a.delta))d[k]=v>0&&k!=='fatigue'&&k!=='stress'?Math.round(v*efficiency):v;change(d);log(`${a.name} ${a.cost<0?'+'+(-a.cost):'-'+a.cost}G · ${Object.entries(d).filter(([k,v])=>v&&k!=='stress'&&k!=='fatigue').map(([k,v])=>ST[k]+(v>0?'+':'')+v).join(', ')||'회복'}`);if(key==='adventure'&&!adventure)startAdventure()}
function advance(){if(state.finished||adventure)return;if(state.month>=96)return finish();for(let k of state.plan)applyAction(k);state.month++;if(state.month%12===0){state.gold+=250;log('왕국 양육 지원금 +250G');change({relationship:3})}if(state.stats.fatigue>=95){change({strength:-9,stress:8,fatigue:-28});log('과로로 쓰러져 치료를 받았습니다.')}if(state.stats.stress>=95){change({morality:-5,relationship:-4,stress:-20});log('극심한 스트레스로 갈등이 발생했습니다.')}if(state.month>=96){finish();return}if(!adventure&&rand(100)<29){let ev=EVENTS.filter(e=>(!e.when||e.when(state)));queue.push(()=>eventModal(ev[rand(ev.length)]))}save();render();if(!adventure)nextQueue()}
function eventModal(e){ask(e.title,e.body,e.choices.map(c=>({text:c.text,action:()=>{if(c.cost&&state.gold<c.cost){log('비용이 부족해 선택을 실행하지 못했습니다.')}else{state.gold-=c.cost||0;state.gold+=c.gold||0;change(c.delta);log(`${e.title}: ${c.text}`)}save();render();nextQueue()}})))}function nextQueue(){if(queue.length&&!adventure)queue.shift()()}
function contest(id){let y=Math.floor(state.month/12);if(state.month%12!==8||state.flags['festival'+y])return;state.flags['festival'+y]=true;let s=state.stats,score=id==='beauty'?s.charm*.55+s.elegance*.45:id==='combat'?s.combat*.65+s.strength*.35:s.art*.7+s.intellect*.3;score+=rand(51);let target=105+y*38;let won=score>=target;let prize=won?400:score>=target*.75?120:0;state.gold+=prize;change({reputation:won?45:prize?14:3,stress:won?-8:5});if(won)state.festivalWins++;log(`${['beauty','combat','art'].indexOf(id)+1}번 경연: ${won?'우승':prize?'입상':'참가'} (+${prize}G)`);save();render();ask('수확제 결과',`심사 점수 ${Math.round(score)} / 우승 기준 ${target}\n${won?'축하합니다! 우승을 차지했습니다.':prize?'입상에 성공했습니다.':'다음 대회를 준비해 보세요.'}\n상금 ${prize}G`,[{text:'확인'}])}
function startAdventure(){let maxhp=Math.round(45+state.stats.strength*.45);adventure={pos:0,visited:[0],hp:maxhp,maxhp,loot:0,steps:0};log('숲으로 무사수행을 떠났습니다.');tab='adventure'}
function explore(){if(!adventure||battle)return;let a=adventure;if(a.steps>=10||a.pos===15){returnHome();return}let x=a.pos%4,y=Math.floor(a.pos/4),options=[];if(x<3)options.push(a.pos+1);if(y<3)options.push(a.pos+4);if(x>0)options.push(a.pos-1);if(y>0)options.push(a.pos-4);let fresh=options.filter(n=>!a.visited.includes(n));a.pos=(fresh.length?fresh:options)[rand((fresh.length?fresh:options).length)];a.visited.push(a.pos);a.steps++;let roll=rand(100);if(roll<52){let names=['숲의 늑대','떠돌이 도적','그림자 슬라임'];let lv=Math.floor(state.month/12),hp=25+lv*8+rand(12);battle={name:names[rand(names.length)],hp,maxhp:hp,atk:6+lv*3};log(`${battle.name}과 마주쳤습니다!`)}else if(roll<77){let gold=25+rand(65);a.loot+=gold;log(`숲에서 보물 ${gold}G 발견`)}else{change({combat:4,strength:2,fatigue:4});log('험한 길을 걸으며 단련했습니다.')}save();render()}
function fight(kind){if(!battle||!adventure)return;let s=state.stats,a=adventure,b=battle,def=false;if(kind==='run'){if(rand(100)<65){log('전투에서 탈출했습니다.');battle=null;render();return}else log('도주 실패!')}else if(kind==='defend'){def=true;log('방어 자세를 취했습니다.')}else{let damage=kind==='magic'?Math.round(7+s.magic*.17+(state.inventory.includes('staff')?15:0)+rand(12)):Math.round(7+s.combat*.14+(state.inventory.includes('sword')?12:0)+rand(10));b.hp-=damage;log(`${kind==='magic'?'마법':'검'} 공격 ${damage} 피해!`)}if(b.hp<=0){let gold=30+rand(55);a.loot+=gold;change({combat:5,magic:kind==='magic'?4:0,reputation:2});log(`${b.name} 격파! ${gold}G 획득`);battle=null;if(a.pos===15)queue.push(()=>ask('숲의 끝','탐험 목표에 도달했습니다!',[{text:'귀환',action:returnHome}]));save();render();if(queue.length)nextQueue();return}let dmg=Math.max(1,b.atk+rand(7)-Math.floor(s.combat/45)-(state.inventory.includes('armor')?8:0));if(def)dmg=Math.ceil(dmg*.3);a.hp-=dmg;log(`${b.name}의 반격 ${dmg} 피해`);if(a.hp<=0){log('전투 불능! 보상을 잃고 귀환했습니다.');a.loot=0;change({fatigue:20,strength:-8});battle=null;returnHome();return}save();render()}
function returnHome(){if(!adventure)return;state.gold+=adventure.loot;log(`무사수행 귀환 · 전리품 ${adventure.loot}G`);change({fatigue:12,combat:3});adventure=null;battle=null;tab='schedule';save();render();nextQueue()}
function finish(){if(adventure)returnHome();state.finished=true;state.month=96;state.ending=ENDINGS.find(e=>e.test(state)).name;log(`18세 성장 완료! 최종 진로: ${state.ending}`);save();tab='records';render();ask('성장 완료',`${state.name}의 8년이 흘렀습니다.\n최종 엔딩: ${state.ending}\n수확제 우승 ${state.festivalWins}회`,[{text:'기록 보기'}])}
state=load();render();

/* Enhanced gameplay layer v2: optional goals, projections, persistent expeditions and progression. */
const GOALS=[{id:'queen',name:'왕국의 통치자',desc:'여왕 엔딩을 목표로 기품·지능·도덕성과 평판을 육성',targets:{elegance:360,intellect:300,morality:250,reputation:300}},{id:'knight',name:'왕국의 수호자',desc:'기사단장 목표: 무술·체력·평판 육성',targets:{combat:340,strength:270,reputation:190}},{id:'mage',name:'대마법사',desc:'마법과 지능을 집중 육성',targets:{magic:370,intellect:280}},{id:'artist',name:'궁정 예술가',desc:'예술과 매력 중심의 성장',targets:{art:320,charm:170}},{id:'priest',name:'성직자',desc:'신앙과 도덕성을 높이는 진로',targets:{faith:300,morality:270}}];
const EXTRA_EVENTS=[{id:'library',title:'도서관의 오래된 지도',body:'서고에서 모험가의 수기를 발견했습니다.',when:s=>s.stats.intellect>=100,choices:[{text:'연구한다',delta:{intellect:9,magic:4,stress:6}},{text:'도서관에 기증한다',delta:{morality:7,reputation:4}}]},{id:'charity',title:'겨울의 구호 활동',body:'마을에서 어려운 이웃을 돕는 행사가 열립니다.',choices:[{text:'기부한다 (80G)',cost:80,delta:{morality:12,reputation:10,relationship:3}},{text:'자원봉사를 한다',delta:{morality:7,fatigue:8,reputation:5}},{text:'돌아간다',delta:{stress:-3}}]},{id:'duel',title:'검술 시범',body:'경비대장이 공개 시범을 제안합니다.',when:s=>s.stats.combat>=100,choices:[{text:'도전한다',delta:{combat:10,reputation:6,fatigue:10}},{text:'관전한다',delta:{combat:4,intellect:2}}]},{id:'stage',title:'극장의 초대',body:'극단에서 공연에 참여해 달라고 요청합니다.',when:s=>s.stats.charm>=100,choices:[{text:'무대에 선다',delta:{charm:8,art:7,reputation:5,stress:6}},{text:'무대 뒤를 돕는다',delta:{cooking:5,morality:5}}]},{id:'scholarship',title:'장학 지원',body:'학교에서 성실한 학생에게 장학금을 지급합니다.',when:s=>s.stats.intellect>=200,choices:[{text:'장학금 받기',gold:180,delta:{reputation:4}},{text:'후배에게 양보',delta:{morality:12,reputation:9}}]}];
EVENTS.push(...EXTRA_EVENTS);
const originalSave=save;
save=function(){state.expedition=adventure?JSON.parse(JSON.stringify(adventure)):null;state.encounter=battle?JSON.parse(JSON.stringify(battle)):null;originalSave()};
if(state.expedition){adventure=state.expedition;battle=state.encounter||null;tab='adventure'}
function goalInfo(){let g=GOALS.find(x=>x.id===state.goal)||GOALS[0];let entries=Object.entries(g.targets);return {g,entries,progress:Math.round(entries.reduce((sum,[k,v])=>sum+Math.min(1,state.stats[k]/v),0)/entries.length*100)}}
function previewPlan(){let gold=state.gold,delta={},notes=[];for(let key of state.plan){let a=ACTIONS[key];if(!a)continue;if(a.requires&&Object.entries(a.requires).some(([k,v])=>state.stats[k]<v)){notes.push(a.name+' 자격 미달');continue}if(a.cost>gold){notes.push(a.name+' 비용 부족 → 휴식');for(let [k,v] of Object.entries(ACTIONS.rest.delta))delta[k]=(delta[k]||0)+v;continue}gold-=a.cost;for(let [k,v] of Object.entries(a.delta))delta[k]=(delta[k]||0)+v}return {gold,delta,notes}}
const oldShowSchedule=showSchedule;
showSchedule=function(){let v=previewPlan();return oldShowSchedule()+`<div class="notice"><strong>📊 편성 예상 결과</strong><p>예상 소지금: ${v.gold.toLocaleString()}G (${v.gold-state.gold>=0?'+':''}${v.gold-state.gold}G)</p><div class="hint">${Object.entries(v.delta).map(([k,n])=>`${ST[k]} ${n>=0?'+':''}${n}`).join(' · ')||'변화 없음'}</div>${v.notes.length?`<p style="color:#f4b6a6">${v.notes.join(' / ')}</p>`:''}<p class="hint">예상치: 컨디션에 따른 효율 저하 및 무작위 이벤트는 제외</p></div>`};
function showGoals(){let info=goalInfo();return `<h2 class="section-title">🎯 진로 목표 및 성장 분석</h2><p class="sub">목표는 길잡이이며 실제 엔딩 판정에는 영향을 주지 않습니다.</p><div class="itemgrid">${GOALS.map(g=>`<div class="item"><strong>${g.name}</strong><p>${g.desc}</p><button data-goal="${g.id}" ${state.goal===g.id?'disabled':''}>${state.goal===g.id?'선택됨':'목표 설정'}</button></div>`).join('')}</div><h3 class="section-title" style="margin-top:20px">현재 목표: ${info.g.name} · ${info.progress}%</h3>${info.entries.map(([k,target])=>`<div class="stat"><span>${ST[k]}</span><div class="track"><div class="fill" style="width:${Math.min(100,state.stats[k]/target*100)}%"></div></div><b>${state.stats[k]}/${target}</b></div>`).join('')}<div class="notice">현재 예상 엔딩: <strong>${ENDINGS.find(e=>e.test(state)).name}</strong><p class="hint">현재 능력치로 즉시 판정한 결과입니다. 실제 엔딩은 18세에 결정됩니다.</p></div>`}
const oldRender=render;
render=function(){oldRender();let t=$('tabs');let btn=document.createElement('button');btn.textContent='🎯 진로';btn.className=tab==='goals'?'active':'';btn.onclick=()=>{tab='goals';render()};t.appendChild(btn);if(tab==='goals'){$('content').innerHTML=showGoals();document.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{state.goal=b.dataset.goal;log('진로 목표: '+GOALS.find(x=>x.id===state.goal).name);save();render()})}if(tab==='schedule'){let p=previewPlan();let advance=$('advance');if(advance&&p.notes.length)advance.title=p.notes.join('; ')} };
const oldAdvance=advance;
advance=function(){if(state.finished||adventure)return;let prior=state.month;oldAdvance();if(state.month!==prior){state.history=state.history||[];state.history.push({month:state.month,gold:state.gold,stats:{...state.stats}});if(state.history.length>96)state.history.shift();if(state.month%12===0){let y=state.month/12;log(`${y}년차 결산: 보유 자금 ${state.gold}G, 평판 ${state.stats.reputation}`)}save();render()}};
const oldShowRecords=showRecords;
showRecords=function(){let history=state.history||[];let first=history[0],last=history[history.length-1];return oldShowRecords()+`<h3 class="section-title" style="margin-top:20px">📈 성장 추이</h3><p class="sub">${history.length}개월의 월별 기록을 보관합니다.</p>${history.length>1?`<div class="itemgrid">${['intellect','combat','magic','charm','reputation','gold'].map(k=>{let values=history.map(x=>k==='gold'?x.gold:x.stats[k]);let mx=Math.max(1,...values),mn=Math.min(...values),w=280,h=70;let pts=values.map((v,i)=>`${(i/(values.length-1)*w).toFixed(1)},${(h-5-(v/mx)*(h-10)).toFixed(1)}`).join(' ');return `<div class="item"><strong>${ST[k]||'소지금'}: ${values.at(-1)}</strong><svg viewBox="0 0 280 70" style="width:100%;height:75px" aria-label="${ST[k]||'소지금'} 성장 추이"><polyline fill="none" stroke="#efc981" stroke-width="2.5" points="${pts}"/></svg></div>`}).join('')}</div>`:'<p class="hint">한 달 이상 진행하면 성장 그래프가 표시됩니다.</p>'}`};
const oldExplore=explore;
explore=function(){oldExplore();if(adventure){if(adventure.steps>=10&&!battle)log('원정의 행동 한도에 도달했습니다. 귀환해 주세요.');save()}};
const oldFight=fight;
fight=function(kind){oldFight(kind);save()};
const oldReturnHome=returnHome;
returnHome=function(){oldReturnHome();save()};
const oldStartAdventure=startAdventure;
startAdventure=function(){oldStartAdventure();save()};
const oldShowAdventure=showAdventure;
showAdventure=function(){return oldShowAdventure()+(adventure?`<p class="hint">탐험 진행 ${adventure.steps}/10 · 귀환하면 전리품을 정산합니다. 진행 중 새로고침해도 원정이 유지됩니다.</p>`:'')};

/* v3: long-term progression, meaningful tactical combat, and save slots. */
const V3_KEY='pm2_web_v3_slots';
const ACHIEVEMENTS=[
 {id:'firstyear',name:'첫 해의 성장',test:s=>s.month>=12},
 {id:'scholar',name:'학문의 길',test:s=>s.stats.intellect>=250},
 {id:'warrior',name:'전장의 별',test:s=>s.stats.combat>=250},
 {id:'artist',name:'예술의 꽃',test:s=>s.stats.art>=250},
 {id:'wealth',name:'든든한 가계',test:s=>s.gold>=2000},
 {id:'champion',name:'수확제 우승자',test:s=>s.festivalWins>=1},
 {id:'bond',name:'깊은 신뢰',test:s=>s.stats.relationship>=150},
 {id:'graduate',name:'성년의 날',test:s=>s.finished}
];
function v3init(){state.v3=state.v3||{achievements:[],potions:2,expeditions:0,battlesWon:0,monthlyNotes:[],festivalHistory:[]};return state.v3}
function checkAchievements(){let v=v3init();for(let a of ACHIEVEMENTS){if(!v.achievements.includes(a.id)&&a.test(state)){v.achievements.push(a.id);log('🏅 업적 달성: '+a.name)}}}
const v3Save=save;
save=function(){checkAchievements();v3Save()};
const v3Advance=advance;
advance=function(){if(state.finished||adventure)return;let before=state.month,oldGold=state.gold,oldStats={...state.stats};v3Advance();if(state.month>before){let v=v3init();let delta={};for(let k in state.stats)if(state.stats[k]!==oldStats[k])delta[k]=state.stats[k]-oldStats[k];v.monthlyNotes.push({month:state.month,gold:state.gold-oldGold,delta});v.monthlyNotes=v.monthlyNotes.slice(-96);if(state.month%12===0){let year=state.month/12;let tax=Math.min(state.gold,Math.max(0,Math.floor(state.gold*.04)));state.gold-=tax;log(`${year}년차 결산: 생활 유지비 ${tax}G`)}save();render()}};
const v3StartAdventure=startAdventure;
startAdventure=function(){v3init().expeditions++;v3StartAdventure();if(adventure){adventure.mana=Math.round(20+state.stats.magic*.24);adventure.maxmana=adventure.mana;adventure.guard=false;adventure.turns=0}save()};
const v3Explore=explore;
explore=function(){v3Explore();if(adventure){adventure.mana=Math.min(adventure.maxmana||30,(adventure.mana||0)+2);save();render()}};
const v3Fight=fight;
fight=function(kind){if(!battle||!adventure)return;
 let v=v3init();
 if(kind==='potion'){if(v.potions<=0)return ask('회복약 부족','상점에서 회복약을 구입할 수 있습니다.',[{text:'확인'}]);v.potions--;let heal=Math.min(adventure.maxhp-adventure.hp,Math.round(adventure.maxhp*.38));adventure.hp+=heal;log(`회복약 사용: HP +${heal}`);let dmg=Math.max(1,battle.atk+rand(7)-Math.floor(state.stats.combat/45)-(state.inventory.includes('armor')?8:0));adventure.hp-=dmg;log(`${battle.name}의 반격 ${dmg} 피해`);if(adventure.hp<=0){log('전투 불능으로 귀환했습니다.');adventure.loot=0;battle=null;returnHome()}else{save();render()}return}
 if(kind==='magic'){let cost=8;if((adventure.mana||0)<cost)return ask('마력 부족','마력이 부족합니다. 방어로 마력을 회복하세요.',[{text:'확인'}]);adventure.mana-=cost}
 if(kind==='defend'){adventure.mana=Math.min(adventure.maxmana||30,(adventure.mana||0)+5);adventure.hp=Math.min(adventure.maxhp,adventure.hp+2)}
 let prior=battle;
 v3Fight(kind);
 if(prior&&!battle&&adventure&&prior.hp<=0){v.battlesWon++;save()}
};
const v3Adventure=showAdventure;
showAdventure=function(){return v3Adventure()+(adventure?`<div class="notice">🔮 MP ${adventure.mana||0}/${adventure.maxmana||30} · 🧪 회복약 ${v3init().potions}개 · 승리 ${v3init().battlesWon}회</div>${battle?'<button data-fight="potion">🧪 회복약 사용 (반격 발생)</button>':''}`:'')};
const v3Buy=buy;
buy=function(id){v3Buy(id);save()};
const v3Contest=contest;
contest=function(id){let before=state.festivalWins,year=Math.floor(state.month/12),was=!!state.flags['festival'+year];v3Contest(id);if(!was&&state.flags['festival'+year]){v3init().festivalHistory.push({year:year+1,contest:id,won:state.festivalWins>before});save()}};
const v3ShowShop=showShop;
showShop=function(){return v3ShowShop()+`<div class="item"><strong>🧪 탐험 회복약</strong><p>전투 중 HP 38% 회복, 적의 반격을 받습니다.</p><p>보유 ${v3init().potions}개 · 95G</p><button id="buyPotion" ${state.gold<95?'disabled':''}>95G 구매</button></div>`};
function saveSlot(n){let slots={};try{slots=JSON.parse(localStorage.getItem(V3_KEY)||'{}')}catch{}slots[n]=JSON.parse(JSON.stringify(state));localStorage.setItem(V3_KEY,JSON.stringify(slots));ask('슬롯 저장',`${n}번 슬롯에 저장했습니다.`,[{text:'확인'}])}
function loadSlot(n){let slots={};try{slots=JSON.parse(localStorage.getItem(V3_KEY)||'{}')}catch{}let s=slots[n];if(!s)return ask('빈 슬롯','저장 데이터가 없습니다.',[{text:'확인'}]);ask('슬롯 불러오기',`${n}번 슬롯의 진행 상황으로 교체하시겠습니까?`,[{text:'불러오기',action:()=>{state=s;adventure=s.expedition||null;battle=s.encounter||null;queue=[];tab=adventure?'adventure':'schedule';save();render()}},{text:'취소'}])}
function showProgress(){let v=v3init();let earned=new Set(v.achievements);return `<h2 class="section-title">🏅 업적 · 장기 성장</h2><p class="sub">진행도 ${earned.size}/${ACHIEVEMENTS.length} · 원정 ${v.expeditions}회 · 전투 승리 ${v.battlesWon}회</p><div class="itemgrid">${ACHIEVEMENTS.map(a=>`<div class="item"><strong>${earned.has(a.id)?'🏅':'🔒'} ${a.name}</strong><p>${earned.has(a.id)?'달성 완료':'진행 중'}</p></div>`).join('')}</div><h3 class="section-title">📅 최근 월별 변화</h3><div class="log">${v.monthlyNotes.slice(-12).reverse().map(x=>`<div>${x.month}개월차 · 금화 ${x.gold>=0?'+':''}${x.gold}G · ${Object.entries(x.delta).filter(([k])=>!['fatigue','stress'].includes(k)).slice(0,4).map(([k,n])=>`${ST[k]} ${n>0?'+':''}${n}`).join(' / ')||'상태 유지'}</div>`).join('')||'아직 기록이 없습니다.'}</div><h3 class="section-title">💾 저장 슬롯</h3><p class="hint">자동 저장과 별도로 3개의 수동 저장 슬롯을 사용할 수 있습니다.</p>${[1,2,3].map(n=>`<div class="actionrow"><strong>${n}번 슬롯</strong><button data-slotsave="${n}">저장</button><button data-slotload="${n}">불러오기</button></div>`).join('')}`}
const v3Render=render;
render=function(){v3init();v3Render();let t=$('tabs');let btn=document.createElement('button');btn.textContent='🏅 업적';btn.className=tab==='progress'?'active':'';btn.onclick=()=>{tab='progress';render()};t.appendChild(btn);if(tab==='progress')$('content').innerHTML=showProgress();document.querySelectorAll('[data-slotsave]').forEach(b=>b.onclick=()=>saveSlot(+b.dataset.slotsave));document.querySelectorAll('[data-slotload]').forEach(b=>b.onclick=()=>loadSlot(+b.dataset.slotload));document.querySelectorAll('[data-fight="potion"]').forEach(b=>b.onclick=()=>fight('potion'));let pb=$('buyPotion');if(pb)pb.onclick=()=>{if(state.gold<95)return;state.gold-=95;v3init().potions++;log('탐험 회복약 구입 -95G');save();render()}};
// Upgrades are deterministic and stored alongside the original game state.
v3init();checkAchievements();save();

/* v4: persistent NPC bonds, directional expedition, festival ladder, ending epilogues */
const V4_NPCS=[{id:'lina',name:'리나 · 학술원 친구',skill:'intellect',gift:'책',intro:'도서관에서 함께 공부하는 친구입니다.'},{id:'ruben',name:'루벤 · 경비대 견습',skill:'combat',gift:'훈련용 장갑',intro:'무술과 모험 이야기를 좋아합니다.'},{id:'mira',name:'미라 · 극단 배우',skill:'art',gift:'꽃다발',intro:'예술과 무대의 꿈을 이야기합니다.'},{id:'elise',name:'엘리스 · 궁정 시녀',skill:'elegance',gift:'리본',intro:'궁정의 예법과 소식을 알려 줍니다.'}];
function v4(){if(!state.v4)state.v4={bonds:{lina:0,ruben:0,mira:0,elise:0},interactions:{},memories:[],expeditionTiles:{},contests:[]};return state.v4}
function npcMeet(id,kind){let npc=V4_NPCS.find(x=>x.id===id),v=v4();if(!npc||state.finished)return;let key=state.month+':'+id;if(v.interactions[key])return ask('이번 달 교류 완료','다음 달에 다시 만날 수 있습니다.',[{text:'확인'}]);let cost=kind==='gift'?75:kind==='outing'?40:0;if(state.gold<cost)return ask('자금 부족','필요한 금화가 부족합니다.',[{text:'확인'}]);state.gold-=cost;v.interactions[key]=true;let gain=kind==='gift'?19:kind==='outing'?13:8;v.bonds[id]=clamp(v.bonds[id]+gain,0,100);let delta={relationship:kind==='talk'?2:4,stress:kind==='outing'?-8:-3};if(kind==='talk')delta[npc.skill]=4;if(kind==='gift')delta.charm=3;change(delta);let stage=v.bonds[id]>=75?'깊은 신뢰':v.bonds[id]>=40?'친한 친구':'알아가는 사이';v.memories.unshift(`${yearMonth()} ${npc.name}: ${stage} (${v.bonds[id]})`);v.memories=v.memories.slice(0,35);log(`${npc.name}와 교류 · 친밀도 +${gain}`);save();render()}
function showFriends(){let v=v4();return `<h2 class="section-title">🤝 친구와 인연</h2><p class="sub">친구별 월 1회 교류할 수 있습니다. 친밀도 40/75에서 관계 단계가 달라지고 육성 종료 시 후일담에 반영됩니다.</p><div class="itemgrid">${V4_NPCS.map(n=>{let bond=v.bonds[n.id]||0,done=!!v.interactions[state.month+':'+n.id];return `<div class="item"><strong>${n.name}</strong><p>${n.intro}</p><div class="stat"><span>친밀도</span><div class="track"><div class="fill" style="width:${bond}%"></div></div><b>${bond}/100</b></div><p class="hint">${bond>=75?'💖 깊은 신뢰':bond>=40?'🌷 친한 친구':'🌱 알아가는 사이'} · 선호 선물: ${n.gift}</p><div class="actionrow"><button data-npc="${n.id}" data-kind="talk" ${done||state.finished?'disabled':''}>대화</button><button data-npc="${n.id}" data-kind="outing" ${done||state.finished||state.gold<40?'disabled':''}>외출 40G</button><button data-npc="${n.id}" data-kind="gift" ${done||state.finished||state.gold<75?'disabled':''}>선물 75G</button></div></div>`}).join('')}</div><h3>인연의 기록</h3><div class="log">${v.memories.map(x=>`<div>${escapeHtml(x)}</div>`).join('')||'아직 만남의 기록이 없습니다.'}</div>`}
const v4Start=startAdventure;
startAdventure=function(){v4Start();if(adventure){adventure.tileRewards=adventure.tileRewards||{};adventure.bossDefeated=false;adventure.steps=0;save()}};

// v6: planning assistant, campaign journal and portable saves.
function v6(){if(!state.v6)state.v6={journal:[],difficulty:'normal'};return state.v6}
const v6Advance=advance;
advance=function(){let before=state.month,gold=state.gold,stats={...state.stats};v6Advance();if(state.month>before){let d={};for(const k of Object.keys(stats)){let n=state.stats[k]-stats[k];if(n)d[k]=n}v6().journal.push({month:state.month,gold:state.gold-gold,delta:d,plan:[...state.plan]});v6().journal=v6().journal.slice(-96);save()}}
function v6Forecast(){let g=state.gold,totals={},warnings=[];for(let i=0;i<3;i++){let key=state.plan[i],a=ACTIONS[key];if(!a)continue;let can=(!a.requires||Object.entries(a.requires).every(([k,n])=>state.stats[k]>=n))&&g>=a.cost;if(!can){warnings.push(`${i+1}구간 ${a.name}: 자격 또는 자금 부족`);a=ACTIONS.rest}g-=a.cost;for(const [k,n] of Object.entries(a.delta||{}))totals[k]=(totals[k]||0)+n}return {gold:g,totals,warnings}}
function v6Advisor(){let targets=GOALS.find(g=>g.id===state.goal)||GOALS[0],gaps=Object.entries(targets.targets).map(([k,v])=>({k,gap:Math.max(0,v-state.stats[k]),target:v})).sort((a,b)=>b.gap-a.gap);let best=[];for(let [key,a] of Object.entries(ACTIONS)){if(key==='adventure'||key==='rest'||(a.requires&&Object.entries(a.requires).some(([k,v])=>state.stats[k]<v)))continue;let gain=gaps.slice(0,3).reduce((sum,x)=>sum+Math.max(0,a.delta?.[x.k]||0)*(x.gap/x.target),0);let score=gain-(a.cost>0?a.cost/180:0)-(Math.max(0,a.delta?.fatigue||0)+Math.max(0,a.delta?.stress||0))/75;best.push({key,score})}best.sort((a,b)=>b.score-a.score);let plan=best.slice(0,2).map(x=>x.key);plan.push(state.stats.fatigue>55||state.stats.stress>55?'rest':state.gold<200?'farm':'rest');return {plan,focus:gaps.slice(0,3)}}
function v6Panel(){let f=v6Forecast(),a=v6Advisor(),j=v6().journal;return `<h2 class="section-title">🧭 육성 전략 · 기록 · 데이터 관리</h2><p class="sub">현재 능력치와 진로 목표를 기준으로 일정 추천과 월별 기록을 확인합니다. 추천은 참고용이며 원작 공식이 아닙니다.</p><div class="notice"><strong>이번 달 일정 예측</strong><p>예상 잔액: ${f.gold}G (변동 ${f.gold-state.gold>=0?'+':''}${f.gold-state.gold}G)</p><p>${Object.entries(f.totals).map(([k,n])=>`${ST[k]||k} ${n>0?'+':''}${n}`).join(' · ')||'변화 없음'}</p>${f.warnings.map(x=>`<p style="color:#c97767">⚠️ ${escapeHtml(x)}</p>`).join('')}</div><div class="item"><strong>목표 기반 일정 추천</strong><p>우선 성장: ${a.focus.map(x=>`${ST[x.k]} ${state.stats[x.k]}/${x.target}`).join(' · ')}</p><p>${a.plan.map(k=>ACTIONS[k]?.name||k).join(' → ')}</p><button id="v6autoplan" ${state.finished?'disabled':''}>추천 일정 적용</button></div><h3 class="section-title">📈 월별 성장 기록 (${j.length}개월)</h3><div class="log" style="max-height:260px">${j.slice(-18).reverse().map(x=>`<div>${x.month}개월차 · ${x.gold>=0?'+':''}${x.gold}G · ${Object.entries(x.delta).filter(([k])=>!['stress','fatigue'].includes(k)).slice(0,5).map(([k,n])=>`${ST[k]||k} ${n>0?'+':''}${n}`).join(' / ')||'변화 없음'}</div>`).join('')||'다음 달부터 기록됩니다.'}</div><h3 class="section-title">💾 저장 파일 내보내기 / 가져오기</h3><p class="hint">브라우저 저장소와 별도로 JSON 파일을 보관할 수 있습니다. 불러오기는 현재 진행 상황을 대체합니다.</p><div class="actionrow"><button id="v6export">JSON 저장 파일 다운로드</button><label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer">JSON 불러오기 <input type="file" id="v6import" accept="application/json,.json" style="max-width:190px"></label></div><div class="notice">게임 완료까지 ${Math.max(0,96-state.month)}개월 · 현재 예상 진로: ${escapeHtml(ENDINGS.find(e=>e.test(state)).name)}</div>`}

function v8State(){if(!state.v8||typeof state.v8!=='object')state.v8={completed:[],decisions:{},journal:[],rewards:[]};return state.v8}
function v8Affinity(npc){let n=V7_CHARACTERS.find(x=>x.id===npc);return n?Math.max(state.npcAffection?.[npc]||0,0):0}
function v8Eligibility(e){let v=v8State();if(v.completed.includes(e.id)||state.finished)return false;if(state.month<e.minMonth||state.stats[e.stat]<e.minStat)return false;if(e.chapter>1&&!v.completed.includes(e.arc+'_'+(e.chapter-1)))return false;return e.chapter===1||v8Affinity(e.npc)>=Math.min(60,e.chapter*12)}
function v8Choose(id,choiceIndex){let e=V8_STORIES.find(x=>x.id===id),v=v8State();if(!e||!v8Eligibility(e))return false;let c=e.choices[choiceIndex];if(!c)return false;v.completed.push(e.id);v.decisions[e.id]=choiceIndex;v.journal.unshift({month:state.month,title:e.title,arc:e.arc,choice:c.text});v.journal=v.journal.slice(0,100);change(c.delta);state.npcAffection??={};state.npcAffection[e.npc]=clamp((state.npcAffection[e.npc]||0)+c.affinity,0,100);state.flags['story_'+c.flag]=true;log('📖 '+e.title+' — '+c.text);save();render();return true}

function v8OpenStory(id){let e=V8_STORIES.find(x=>x.id===id);if(!e||!v8Eligibility(e))return;ask(e.title,e.body,e.choices.map((c,i)=>({text:c.text,action:()=>v8Choose(id,i)})))}
function v8Epilogue(){let v=v8State();let full=[...new Set(V8_STORIES.map(x=>x.arc))].filter(arc=>v.completed.includes(arc+'_3'));let friends=V7_CHARACTERS.filter(n=>v8Affinity(n.id)>=60).map(n=>n.name);return `<div class="notice"><h3>📖 선택이 남긴 이야기</h3><p>완결한 인연: ${full.length?full.map(a=>V8_STORIES.find(e=>e.arc===a).arcName).join(', '):'아직 없음'}</p><p>깊은 인연: ${friends.join(', ')||'아직 없음'}</p><p>8년 동안 내린 선택 ${v.completed.length}회가 왕국의 기억에 남았습니다.</p></div>`}

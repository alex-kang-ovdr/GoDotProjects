<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="YU-NO A.D.M.S. Parallel World Cover">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#1a2c6b"/>
      <stop offset="48%" stop-color="#0a112b"/>
      <stop offset="100%" stop-color="#040611"/>
    </radialGradient>
    <radialGradient id="coreHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64f0ff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#050714" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4e6ff"/>
      <stop offset="30%" stop-color="#6b8cc7"/>
      <stop offset="65%" stop-color="#283a69"/>
      <stop offset="100%" stop-color="#a8c7ff"/>
    </linearGradient>
    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0a8"/>
      <stop offset="50%" stop-color="#f5b942"/>
      <stop offset="100%" stop-color="#a86d16"/>
    </linearGradient>
    <radialGradient id="jewelCyan" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e8ffff"/>
      <stop offset="45%" stop-color="#38e8ff"/>
      <stop offset="100%" stop-color="#0d4f9c"/>
    </radialGradient>
    <radialGradient id="jewelGold" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffbe0"/>
      <stop offset="45%" stop-color="#ffcf54"/>
      <stop offset="100%" stop-color="#a1560a"/>
    </radialGradient>
    <radialGradient id="jewelViolet" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f6e6ff"/>
      <stop offset="45%" stop-color="#b26bff"/>
      <stop offset="100%" stop-color="#47168c"/>
    </radialGradient>
    <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Space Background -->
  <rect width="800" height="500" fill="url(#bgGlow)"/>

  <!-- Subtle Starfield -->
  <g fill="#cfe6ff" opacity="0.55">
    <circle cx="62" cy="54" r="1.4"/><circle cx="145" cy="88" r="1"/><circle cx="230" cy="40" r="1.6"/>
    <circle cx="660" cy="65" r="1.5"/><circle cx="728" cy="110" r="1.2"/><circle cx="590" cy="36" r="1"/>
    <circle cx="95" cy="410" r="1.3"/><circle cx="180" cy="452" r="1.1"/><circle cx="705" cy="390" r="1.6"/>
    <circle cx="622" cy="442" r="1.2"/><circle cx="318" cy="462" r="1"/><circle cx="486" cy="458" r="1.4"/>
    <circle cx="745" cy="240" r="1.3"/><circle cx="42" cy="245" r="1.2"/><circle cx="398" cy="26" r="1.5"/>
  </g>

  <!-- Parallel-World A.D.M.S. Constellation Branches (Left & Right) -->
  <g fill="none" stroke-width="1.6" opacity="0.72" filter="url(#glowSoft)">
    <!-- Left branches -->
    <path d="M 300 225 L 210 150 L 110 120 L 46 120" stroke="#38bdf8"/>
    <path d="M 210 150 L 145 182 L 74 182" stroke="#60a5fa" stroke-dasharray="4 4"/>
    <path d="M 290 225 L 185 225 L 95 225" stroke="#fbbf24"/>
    <path d="M 300 225 L 210 300 L 118 335 L 55 335" stroke="#a78bfa"/>
    <path d="M 210 300 L 145 270 L 72 270" stroke="#38bdf8"/>
    <!-- Right branches -->
    <path d="M 500 225 L 590 150 L 690 120 L 754 120" stroke="#38bdf8"/>
    <path d="M 590 150 L 655 182 L 726 182" stroke="#fbbf24" stroke-dasharray="4 4"/>
    <path d="M 510 225 L 615 225 L 705 225" stroke="#34d399"/>
    <path d="M 500 225 L 590 300 L 682 335 L 745 335" stroke="#a78bfa"/>
    <path d="M 590 300 L 655 270 L 728 270" stroke="#f472b6"/>
  </g>

  <!-- Constellation Graph Nodes -->
  <g filter="url(#glowSoft)">
    <circle cx="210" cy="150" r="6" fill="#38e8ff"/>
    <circle cx="110" cy="120" r="5" fill="#fbbf24"/>
    <circle cx="145" cy="182" r="4.5" fill="#60a5fa"/>
    <circle cx="185" cy="225" r="6.5" fill="#fbbf24"/>
    <circle cx="95" cy="225" r="5" fill="#38e8ff"/>
    <circle cx="210" cy="300" r="6" fill="#c084fc"/>
    <circle cx="118" cy="335" r="5" fill="#f472b6"/>

    <circle cx="590" cy="150" r="6" fill="#38e8ff"/>
    <circle cx="690" cy="120" r="5" fill="#fbbf24"/>
    <circle cx="655" cy="182" r="4.5" fill="#fbbf24"/>
    <circle cx="615" cy="225" r="6.5" fill="#34d399"/>
    <circle cx="705" cy="225" r="5" fill="#38e8ff"/>
    <circle cx="590" cy="300" r="6" fill="#c084fc"/>
    <circle cx="682" cy="335" r="5" fill="#fbbf24"/>
  </g>

  <!-- Center Halo -->
  <circle cx="400" cy="225" r="180" fill="url(#coreHalo)"/>

  <!-- Concentric Orbital Rings -->
  <circle cx="400" cy="225" r="144" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 6" opacity="0.5"/>
  <circle cx="400" cy="225" r="126" fill="none" stroke="#f5b942" stroke-width="1.2" opacity="0.45"/>

  <!-- Octagonal Reflector Device Body -->
  <g transform="translate(400,225)">
    <!-- Outer Metallic Octagon -->
    <polygon points="-48,-116 48,-116 116,-48 116,48 48,116 -48,116 -116,48 -116,-48"
             fill="#0d1633" stroke="url(#metalFrame)" stroke-width="4.5"/>
    <!-- Inner Gold Bevel Octagon -->
    <polygon points="-40,-98 40,-98 98,-40 98,40 40,98 -40,98 -98,40 -98,-40"
             fill="#080e24" stroke="url(#goldFrame)" stroke-width="2.2" opacity="0.9"/>
    <!-- Inner Core Ring -->
    <circle cx="0" cy="0" r="42" fill="#0d1b42" stroke="#38e8ff" stroke-width="2" filter="url(#glowSoft)"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="4 3"/>
    <!-- Core Emblem -->
    <polygon points="0,-18 16,0 0,18 -16,0" fill="url(#jewelCyan)" filter="url(#glowStrong)"/>

    <!-- 8 Octagonal Jewel Sockets (radius 74) -->
    <!-- Top (0, -74) -->
    <g transform="translate(0,-74)">
      <circle r="13" fill="#0b132b" stroke="#93c5fd" stroke-width="1.8"/>
      <circle r="8.5" fill="url(#jewelCyan)" filter="url(#glowSoft)"/>
    </g>
    <!-- Top-Right (52, -52) -->
    <g transform="translate(52,-52)">
      <circle r="13" fill="#0b132b" stroke="#93c5fd" stroke-width="1.8"/>
      <circle r="8.5" fill="url(#jewelGold)" filter="url(#glowSoft)"/>
    </g>
    <!-- Right (74, 0) -->
    <g transform="translate(74,0)">
      <circle r="13" fill="#0b132b" stroke="#93c5fd" stroke-width="1.8"/>
      <circle r="8.5" fill="url(#jewelCyan)" filter="url(#glowSoft)"/>
    </g>
    <!-- Bottom-Right (52, 52) -->
    <g transform="translate(52,52)">
      <circle r="13" fill="#0b132b" stroke="#93c5fd" stroke-width="1.8"/>
      <circle r="8.5" fill="url(#jewelViolet)" filter="url(#glowSoft)"/>
    </g>
    <!-- Bottom (0, 74) — Blinking Divergence Indicator -->
    <g transform="translate(0,74)">
      <circle r="15" fill="#1b1408" stroke="#fbbf24" stroke-width="2.4" filter="url(#glowSoft)"/>
      <circle r="9.5" fill="url(#jewelGold)" filter="url(#glowStrong)"/>
    </g>
    <!-- Bottom-Left (-52, 52) -->
    <g transform="translate(-52,52)">
      <circle r="13" fill="#0b132b" stroke="#93c5fd" stroke-width="1.8"/>
      <circle r="8.5" fill="url(#jewelViolet)" filter="url(#glowSoft)"/>
    </g>
    <!-- Left (-74, 0) -->
    <g transform="translate(-74,0)">
      <circle r="13" fill="#0b132b" stroke="#93c5fd" stroke-width="1.8"/>
      <circle r="8.5" fill="url(#jewelCyan)" filter="url(#glowSoft)"/>
    </g>
    <!-- Top-Left (-52, -52) -->
    <g transform="translate(-52,-52)">
      <circle r="13" fill="#0b132b" stroke="#93c5fd" stroke-width="1.8"/>
      <circle r="8.5" fill="url(#jewelGold)" filter="url(#glowSoft)"/>
    </g>
  </g>

  <!-- Title & Subtitle Plate -->
  <g text-anchor="middle" font-family="'Segoe UI', 'Malgun Gothic', sans-serif">
    <text x="400" y="62" fill="#7dd3fc" font-size="13" letter-spacing="5" font-weight="600">
      AUTO DIVERGE MAPPING SYSTEM
    </text>
    <text x="400" y="405" fill="#f8fafc" font-size="52" font-weight="800" letter-spacing="10" filter="url(#glowSoft)">
      YU-NO
    </text>
    <text x="400" y="438" fill="#fde68a" font-size="17" font-weight="600" letter-spacing="1.5">
      이 세상 끝에서 사랑을 노래하는 소녀
    </text>
    <text x="400" y="466" fill="#94a3b8" font-size="12" letter-spacing="2">
      병렬 분기 그래프 · 플래그 추적 · 루트 간 정보 계승
    </text>
  </g>
</svg>

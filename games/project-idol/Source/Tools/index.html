<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROJECT IDOL · Data Studio v2</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color-scheme:dark;background:#0b1020;color:#e7edf9}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid #354561;background:#202e4b;border-radius:9px;padding:8px 11px}button:hover{background:#304568}button.primary{background:#6555d9;border-color:#8777f0}input,select,textarea{width:100%;background:#101a2f;border:1px solid #354561;border-radius:8px;padding:9px}textarea{min-height:76px;resize:vertical}header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #283650;flex-wrap:wrap}header strong{font-size:20px}small,.muted{color:#9aaac7}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.app{display:grid;grid-template-columns:245px 280px minmax(0,1fr);height:calc(100vh - 77px);min-height:570px}.side,.items,.workspace{overflow:auto;padding:15px;border-right:1px solid #273550}.side button{display:block;width:100%;text-align:left;margin:5px 0}.side button.active,.item.active{background:#473d8b;border-color:#8071e0}.item{padding:10px;border:1px solid #2c3a55;border-radius:9px;margin:7px 0;cursor:pointer}.item:hover{background:#253452}.item small{display:block;margin-top:3px}.panel{background:#151f34;border:1px solid #2e3b55;border-radius:12px;padding:15px;margin-bottom:15px}h2{margin:0 0 12px;font-size:19px}h3{font-size:15px;margin:8px 0 12px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.row>*{min-width:0}.grow{flex:1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.field label{font-size:12px;color:#aab9d5}.stat{display:grid;grid-template-columns:110px 1fr 42px;gap:8px;align-items:center;margin:8px 0}.stat input{padding:0}.pill{background:#2d3c5a;border-radius:20px;padding:4px 9px;font-size:12px}.danger{color:#ff9ca5}.ok{color:#8ce0b4}.dialogue{border-left:3px solid #7264dc;padding:10px 12px;background:#1b2842;margin:7px 0;border-radius:5px}.choice{border:1px solid #3c4c6a;padding:12px;border-radius:9px;margin:9px 0}.choice:hover{border-color:#8172ed}.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.node{background:#25345a;padding:12px;border-radius:9px;border:1px solid #6478aa;max-width:190px;overflow-wrap:anywhere}.toast{position:fixed;bottom:18px;right:18px;background:#364b76;padding:13px 18px;border-radius:9px;display:none;z-index:3}.warning{color:#ffca87}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d1729;padding:12px;border-radius:8px}details{margin-top:14px}summary{cursor:pointer}#search{margin:10px 0}@media(max-width:900px){.app{grid-template-columns:145px minmax(0,1fr);height:auto}.items{grid-column:1;grid-row:2;max-height:340px}.workspace{grid-column:2;grid-row:1 / span 2;min-height:85vh}.side{grid-column:1;grid-row:1}.grid{grid-template-columns:1fr}}@media(max-width:550px){.app{display:block}.side{display:flex;overflow:auto;gap:5px}.side button{min-width:115px}.items{max-height:180px}.workspace{min-height:600px}header{padding:10px}.stat{grid-template-columns:75px 1fr 32px}}

#studio3{display:none;position:fixed;inset:74px 0 0;background:#0b1020;z-index:2;overflow:auto;padding:18px}#studio3.open{display:block}.v3cols{display:grid;grid-template-columns:280px minmax(0,1fr);gap:15px}.v3card{background:#151f34;border:1px solid #34425c;border-radius:12px;padding:15px;margin:8px 0}.v3card.selected{border-color:#a99aff}.v3grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px}.v3card input[type=checkbox]{width:auto}.v3tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.v3bar{height:9px;background:#35435e;border-radius:10px;overflow:hidden}.v3bar>div{height:100%;background:#9281ee}.v3line{display:flex;align-items:center;gap:9px;margin:6px 0}.v3line>span{width:85px}.v3line>.v3bar{flex:1}.v3node{border:1px solid #6678a8;border-radius:9px;padding:12px;min-width:160px;background:#223250;cursor:pointer}.v3graph{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.v3preview{width:130px;height:160px;object-fit:contain;background:#0c1629;border:1px dashed #52617b;border-radius:9px}.v3message{white-space:pre-wrap;background:#0c172b;padding:12px;border-radius:9px;line-height:1.7}@media(max-width:700px){.v3cols{grid-template-columns:1fr}#studio3{inset:100px 0 0}}
</style></head><body><header><div><strong>✦ IDOL Data Studio</strong> <span class="pill">v2 · Visual Editor</span><div><small id="status">데이터 준비 중</small></div></div><div class="toolbar"><button class="primary" onclick="v3Open()">✦ v3 제작 도구</button><button onclick="undo()">↶ 실행 취소</button><button onclick="redo()">↷ 다시 실행</button><button onclick="validate()">✓ 검증</button><button onclick="exportData()">↓ JSON 내보내기</button><button onclick="document.getElementById('file').click()">↑ 가져오기</button><input type="file" id="file" accept=".json" hidden onchange="importData(event)"></div></header><div class="app"><aside class="side" id="nav"></aside><section class="items"><div class="row"><b id="listTitle" class="grow"></b><button class="primary" onclick="addItem()">+ 생성</button></div><input id="search" placeholder="ID / 이름 검색" oninput="renderList()"><div id="list"></div></section><main class="workspace"><div id="editor"></div></main></div><div class="toast" id="toast"></div><script src="seed.js"></script><script>
const KEYS=['characters','events','story_arcs','endings','balance'];const LABELS={characters:'👤 캐릭터',events:'🎭 이벤트·대사',story_arcs:'🧩 스토리 아크',endings:'🏆 멀티 엔딩',balance:'⚙ 밸런스'};const clone=x=>JSON.parse(JSON.stringify(x));let db=(()=>{try{return JSON.parse(localStorage.getItem('idolStudioV2'))||clone(SEED)}catch{return clone(SEED)}})();let tab='characters',idx=0,history=[],future=[],previewChoice=-1;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pathGet=(o,p)=>p.split('.').reduce((a,k)=>a?.[k],o);function pathSet(o,p,v){let a=p.split('.');let cur=o;for(const k of a.slice(0,-1)){if(!cur[k]||typeof cur[k]!=='object')cur[k]={};cur=cur[k]}cur[a.at(-1)]=v}function save(){localStorage.setItem('idolStudioV2',JSON.stringify(db));$('status').textContent=`자동 저장 · 캐릭터 ${db.characters.length} / 이벤트 ${db.events.length} / 아크 ${db.story_arcs.length} / 엔딩 ${db.endings.length}`}function snap(){history.push(clone(db));if(history.length>60)history.shift();future=[]}function undo(){if(!history.length)return;future.push(clone(db));db=history.pop();refresh()}function redo(){if(!future.length)return;history.push(clone(db));db=future.pop();refresh()}function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2400)}function entries(){return tab==='balance'?[db.balance]:(db[tab]||[])}function current(){return entries()[idx]}function nav(){ $('nav').innerHTML=KEYS.map(k=>`<button class="${tab===k?'active':''}" onclick="switchTab('${k}')">${LABELS[k]} <small>${Array.isArray(db[k])?db[k].length:''}</small></button>`).join('')+`<hr><button onclick="resetData()">↺ 초기 데이터 복원</button>`}function switchTab(k){tab=k;idx=0;previewChoice=-1;$('search').value='';refresh()}function refresh(){save();nav();renderList();renderEditor()}function renderList(){const q=$('search').value.toLowerCase();$('listTitle').textContent=LABELS[tab];$('list').innerHTML=entries().map((v,i)=>({v,i})).filter(({v})=>JSON.stringify([v.id,v.name,v.title,v.role]).toLowerCase().includes(q)).map(({v,i})=>`<div class="item ${idx===i?'active':''}" onclick="selectItem(${i})"><b>${esc(v.name||v.title||'게임 밸런스')}</b><small>${esc(v.id||'config')} · ${esc(v.role||v.category||v.phase||'')}</small></div>`).join('')}function selectItem(i){idx=i;previewChoice=-1;renderList();renderEditor()}function input(path,label,type='text',obj=current()){const v=pathGet(obj,path)??'';return `<div class="field"><label>${esc(label)}</label>${type==='textarea'?`<textarea data-path="${esc(path)}">${esc(v)}</textarea>`:`<input data-path="${esc(path)}" type="${type}" value="${esc(v)}">`}</div>`}function stats(obj){return Object.entries(obj||{}).filter(([,v])=>typeof v==='number').map(([k,v])=>`<div class="stat"><label>${esc(k)}</label><input type="range" min="0" max="100" value="${v}" data-path="initial_stats.${esc(k)}"><b>${v}</b></div>`).join('')}function renderEditor(){let v=current();if(!v){$('editor').innerHTML='<div class="panel">항목을 생성해 주세요.</div>';return}let h=`<div class="row"><h2 class="grow">${esc(v.name||v.title||LABELS[tab])}</h2><button onclick="duplicate()">복제</button><button onclick="removeItem()">삭제</button></div>`;if(tab==='characters'){h+=`<div class="panel"><h3>기본 프로필</h3><div class="grid">${input('id','캐릭터 ID')}${input('name','이름')}${input('tier','등급 (lead / support)')}${input('role','역할')}${input('trait','성격')}${input('inner_conflict','내적 갈등')}${input('specialty','특기')}${input('theme','서사 테마')}</div>${input('intro','소개 대사','textarea')}</div><div class="panel"><h3>초기 능력치</h3>${stats(v.initial_stats)||'<small>조연 캐릭터에는 초기 능력치가 없습니다.</small>'}</div><div class="panel"><h3>캐릭터 대사집</h3>${Object.keys(v.dialogue||{}).map(k=>input('dialogue.'+k,k,'textarea')).join('')}<button onclick="addDialogue()">+ 대사 키 추가</button></div><div class="panel"><h3>연결 이벤트</h3>${db.events.filter(e=>e.actor_id===v.id||e.support_id===v.id).slice(0,25).map(e=>`<button onclick="jump('events','${esc(e.id)}')">${esc(e.title)}</button>`).join(' ')||'연결 이벤트 없음'}</div>`}else if(tab==='events'){h+=`<div class="panel"><h3>이벤트 정보</h3><div class="grid">${input('id','이벤트 ID')}${input('title','제목')}${input('category','분류')}${input('location','장소')}${input('phase','단계')}${input('arc_id','연결 아크')}${input('month_min','최소 월','number')}${input('month_max','최대 월','number')}</div><div class="grid"><div class="field"><label>주연 캐릭터</label><select data-path="actor_id">${characterOptions(v.actor_id)}</select></div><div class="field"><label>조연 캐릭터</label><select data-path="support_id">${characterOptions(v.support_id)}</select></div></div><label><input type="checkbox" data-path="repeatable" ${v.repeatable?'checked':''} style="width:auto"> 반복 가능</label></div><div class="panel"><h3>발생 조건 (시각화 + JSON)</h3>${input('conditions.phase','진행 단계')}<div class="grid">${Object.entries(v.conditions?.min_stat||{}).map(([k])=>input('conditions.min_stat.'+k,'최소 '+k,'number')).join('')}</div><small>복잡한 조건은 하단 고급 JSON 편집에서 관리합니다.</small></div><div class="panel"><h3>대사 시퀀스</h3>${(v.dialogue||[]).map((d,i)=>`<div class="dialogue"><div class="row"><div class="grow">${input('dialogue.'+i+'.speaker','화자')}</div><button onclick="arrayRemove('dialogue',${i})">×</button></div>${input('dialogue.'+i+'.line','대사','textarea')}</div>`).join('')}<button onclick="arrayAdd('dialogue',{speaker:'narrator',line:'새 대사'})">+ 대사 추가</button></div><div class="panel"><h3>선택지와 효과</h3>${(v.choices||[]).map((c,i)=>`<div class="choice"><div class="row"><b class="grow">선택지 ${i+1}</b><button onclick="arrayRemove('choices',${i})">삭제</button></div>${input('choices.'+i+'.text','선택지 대사','textarea')}<div class="grid">${Object.entries(c.effects||{}).map(([k])=>input('choices.'+i+'.effects.'+k,'효과: '+k,'number')).join('')}</div><small>설정 플래그: ${esc((c.next_flags||[]).join(', '))}</small></div>`).join('')}<button onclick="arrayAdd('choices',{text:'새 선택지',effects:{trust:1},next_flags:[]})">+ 선택지 추가</button></div><div class="panel"><h3>🎮 이벤트 플레이 테스트</h3><button class="primary" onclick="previewEvent()">미리보기 열기 / 갱신</button><div id="preview"></div></div>`}else if(tab==='story_arcs'){h+=`<div class="panel"><h3>아크 설정</h3>${input('id','아크 ID')}${input('title','아크 제목')}<h3>이벤트 진행 순서</h3><div class="flow">${(v.event_ids||[]).map((id,i)=>`<div class="node" onclick="jump('events','${esc(id)}')">${i+1}. ${esc(db.events.find(e=>e.id===id)?.title||id)}</div>${i<v.event_ids.length-1?'→':''}`).join('')}</div><div class="row" style="margin-top:12px"><select id="arcEvent">${db.events.map(e=>`<option value="${esc(e.id)}">${esc(e.title)} (${esc(e.id)})</option>`).join('')}</select><button onclick="arcAdd()">+ 연결</button></div><small>연결 순서는 고급 JSON에서 변경할 수 있습니다.</small></div>`}else if(tab==='endings'){h+=`<div class="panel"><h3>엔딩 정보</h3>${input('id','엔딩 ID')}${input('title','제목')}${input('priority','우선순위','number')}${input('epilogue','후일담','textarea')}<h3>발생 조건</h3>${input('conditions.min_month','최소 진행 월','number')}${Object.keys(v.conditions?.min_stats||{}).map(k=>input('conditions.min_stats.'+k,'최소 '+k,'number')).join('')}<h3>엔딩 대사</h3>${(v.dialogue||[]).map((d,i)=>`<div class="dialogue">${input('dialogue.'+i+'.speaker','화자')}${input('dialogue.'+i+'.line','대사','textarea')}</div>`).join('')}</div>`}else{h+=`<div class="panel"><h3>밸런스 설정</h3><p class="muted">전체 설정을 JSON으로 편집할 수 있습니다.</p></div>`}h+=`<details class="panel"><summary>⚙ 고급 JSON 편집 · 전체 필드</summary><p class="muted">JSON을 수정한 후 적용 버튼을 눌러 주세요.</p><textarea id="raw" style="min-height:280px;font-family:monospace">${esc(JSON.stringify(v,null,2))}</textarea><button onclick="applyRaw()">JSON 적용</button></details>`;$('editor').innerHTML=h;document.querySelectorAll('#editor [data-path]').forEach(el=>{el.addEventListener(el.type==='range'?'input':'change',()=>{const path=el.dataset.path;let val=el.type==='checkbox'?el.checked:el.type==='number'||el.type==='range'?Number(el.value):el.value;snap();pathSet(current(),path,val);save();if(el.type==='range')el.nextElementSibling.textContent=val;else{renderList();if(path==='name'||path==='title')renderEditor()}})})}
function characterOptions(selected){return `<option value="">선택 안 함</option>`+db.characters.map(c=>`<option value="${esc(c.id)}" ${selected===c.id?'selected':''}>${esc(c.name)} (${esc(c.id)})</option>`).join('')}function addItem(){if(tab==='balance')return toast('밸런스는 단일 설정입니다');snap();let id=tab.slice(0,3)+'_'+Date.now().toString(36);let v=tab==='characters'?{id,name:'새 캐릭터',tier:'lead',role:'연습생',trait:'',inner_conflict:'',specialty:'',intro:'',initial_stats:{vocal:50,dance:50,creative:50,streaming:50,trust:45,stress:20},dialogue:{first_meeting:'안녕하세요!'}}:tab==='events'?{id,title:'새 이벤트',category:'training',location:'연습실',phase:'trainee',month_min:1,month_max:72,actor_id:'',support_id:'',repeatable:false,conditions:{phase:'trainee',min_stat:{}},dialogue:[{speaker:'narrator',line:'새 이벤트가 시작됩니다.'}],choices:[{text:'진행한다',effects:{trust:1},next_flags:[]}],arc_id:''}:tab==='story_arcs'?{id,title:'새 스토리 아크',beats:[],event_ids:[],flags:[]}: {id,title:'새 엔딩',priority:1,conditions:{min_stats:{},min_month:1},epilogue:'',dialogue:[]};db[tab].push(v);idx=db[tab].length-1;refresh()}function duplicate(){if(tab==='balance')return;snap();let v=clone(current());v.id=v.id+'_copy_'+Date.now().toString(36);db[tab].push(v);idx=db[tab].length-1;refresh()}function removeItem(){if(tab==='balance'||!confirm('현재 항목을 삭제할까요?'))return;snap();db[tab].splice(idx,1);idx=Math.max(0,idx-1);refresh()}function arrayAdd(k,v){snap();current()[k]??=[];current()[k].push(v);refresh()}function arrayRemove(k,i){snap();current()[k].splice(i,1);refresh()}function addDialogue(){let k=prompt('새 대사 키 (예: debut_success)');if(!k)return;snap();current().dialogue??={};current().dialogue[k]='';refresh()}function arcAdd(){let id=$('arcEvent').value;if(current().event_ids.includes(id))return toast('이미 연결된 이벤트입니다');snap();current().event_ids.push(id);refresh()}function jump(k,id){tab=k;idx=db[k].findIndex(v=>v.id===id);if(idx<0)idx=0;$('search').value='';refresh()}function previewEvent(){const e=current();$('preview').innerHTML=`<h3>${esc(e.title)}</h3>${(e.dialogue||[]).map(d=>`<div class="dialogue"><b>${esc(d.speaker)}</b><p>${esc(d.line)}</p></div>`).join('')}${(e.choices||[]).map((c,i)=>`<button onclick="previewResult(${i})">${i+1}. ${esc(c.text)}</button>`).join('')}<div id="result"></div>`}function previewResult(i){let c=current().choices[i];$('result').innerHTML=`<div class="panel"><h3>선택 결과 (데이터 변경 없음)</h3><pre>${esc(JSON.stringify({effects:c.effects,flags:c.next_flags},null,2))}</pre></div>`}function applyRaw(){try{let v=JSON.parse($('raw').value);if(!v||typeof v!=='object'||Array.isArray(v))throw Error('객체가 필요합니다');snap();if(tab==='balance')db.balance=v;else db[tab][idx]=v;refresh();toast('JSON 적용 완료')}catch(e){alert('JSON 오류: '+e.message)}}function validate(){let issues=[];for(const k of KEYS.filter(k=>k!=='balance')){let seen=new Set();for(const [i,v] of db[k].entries()){if(!v.id)issues.push(`${k}[${i}]: ID 없음`);if(seen.has(v.id))issues.push(`${k}: 중복 ID ${v.id}`);seen.add(v.id)}}const ids=new Set(db.characters.map(c=>c.id)),arcs=new Set(db.story_arcs.map(a=>a.id)),events=new Set(db.events.map(e=>e.id));for(const e of db.events){for(const key of ['actor_id','support_id'])if(e[key]&&!ids.has(e[key]))issues.push(`${e.id}: 없는 캐릭터 ${e[key]}`);if(e.arc_id&&!arcs.has(e.arc_id))issues.push(`${e.id}: 없는 아크 ${e.arc_id}`);if(e.month_min>e.month_max)issues.push(`${e.id}: 기간 역전`);if(!e.choices?.length)issues.push(`${e.id}: 선택지 없음`)}for(const a of db.story_arcs)for(const id of a.event_ids||[])if(!events.has(id))issues.push(`${a.id}: 없는 이벤트 ${id}`);$('editor').insertAdjacentHTML('afterbegin',`<div class="panel"><div class="row"><b class="grow">검증 결과 · ${issues.length}건</b><button onclick="this.closest('.panel').remove()">닫기</button></div>${issues.length?issues.slice(0,100).map(x=>`<p class="warning">⚠ ${esc(x)}</p>`).join(''):'<p class="ok">✓ 기본 참조·ID·기간 검사 통과</p>'}</div>`);toast(`검증 완료: ${issues.length}건`)}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='PROJECT_IDOL_game_data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}async function importData(ev){try{let obj=JSON.parse(await ev.target.files[0].text());if(!KEYS.every(k=>k in obj))throw Error('필수 데이터 키가 없습니다');snap();db=obj;idx=0;refresh();toast('가져오기 완료')}catch(e){alert('가져오기 실패: '+e.message)}ev.target.value=''}function resetData(){if(!confirm('기본 데이터로 복원할까요? 현재 수정 내용이 덮어써집니다.'))return;snap();db=clone(SEED);idx=0;refresh()}refresh();
</script><div id="studio3"></div><script src="studio3.js"></script></body></html>

function moveSpeed(){const p=combatMeta();return 190*(1+.09*(player?.levels.speed||0)+.04*p.gear.boots+[0,.03,.08,.15][equippedTier('boots',p)]);}

function weaponDamage(k){return weaponData[k].damage[weaponLevel(k)-1]*attackPower()*(player.evolved[k]&&k!=='destroyer'?1.8:1)*(hasPerk('overclock')?.92:1);}
function weaponInterval(k){return weaponData[k].cooldown*Math.max(.35,1-.07*(player.levels.cooldown||0))/(1+.1*(weaponLevel(k)-1))/(player.evolved[k]&&k!=='destroyer'?1.4:1)*(hasPerk('overclock')?.82:1);}

function evolutionEligible(){const keys=Object.keys(evoPairs).filter(k=>player.levels[k]===5&&player.levels[evoPairs[k]]>0&&!player.evolved[k]);if(player.levels.droneA===5&&player.levels.droneB===5&&!player.levels.destroyer)keys.push('destroyer');return keys;}

function applyUpgrade(k){
 if(!definitions[k]||player.levels[k]>=5)return false;
 if(!player.levels[k]&&owned(definitions[k].kind).length>=6)return false;
 const old=player.maxHp;player.levels[k]=(player.levels[k]||0)+1;
 if(k==='hp'){player.maxHp=baseHP()*(1+.15*player.levels.hp);player.hp=Math.min(player.maxHp,player.hp+player.maxHp-old);}

}
function upgradeOptions(){
 const w=owned('weapon').length,p=owned('passive').length;
 let list=Object.keys(definitions).filter(k=>!definitions[k].hidden&&(player.levels[k]||0)<5&&!banished.has(k)&&(!player.levels.destroyer||!['droneA','droneB'].includes(k))&&(player.levels[k]||((definitions[k].kind==='weapon'?w:p)<6)));
 // Weighted sampling without replacement: upgrades and synergy partners appear more often.
 function weight(k){let n=player.levels[k]?2.1:1;if(Object.entries(evoPairs).some(([a,b])=>b===k&&player.levels[a]>=3))n+=1.5;if((k==='droneA'&&player.levels.droneB)||(k==='droneB'&&player.levels.droneA))n+=1.5;return n;}
 const out=[];while(list.length&&out.length<3){const total=list.reduce((s,k)=>s+weight(k),0);let r=Math.random()*total,index=0;for(;index<list.length-1;index++){r-=weight(list[index]);if(r<0)break;}out.push(list.splice(index,1)[0]);}
 const ownedUpgrades=Object.keys(player.levels).filter(k=>definitions[k]?.kind==='weapon'&&!definitions[k].hidden&&player.levels[k]<5&&!banished.has(k));
 if(ownedUpgrades.length&&!out.some(k=>player.levels[k]&&definitions[k].kind==='weapon'))out[out.length-1]=ownedUpgrades[Math.floor(Math.random()*ownedUpgrades.length)];
 return out;
}
function gainXp(n){

 while(player.xp>=player.need&&player.lv<99){player.xp-=player.need;player.lv++;player.need=nextXp(player.lv);pendingLevels++;}
 if(player.lv===99)player.xp=Math.min(player.xp,player.need-1);

}

function update(dt){

 elapsed+=dt;dashCooldown=Math.max(0,dashCooldown-dt);player.inv=Math.max(0,player.inv-dt);player.rot+=dt*2.9;shake=Math.max(0,shake-dt*18);flash=Math.max(0,flash-dt);
 const input=movementInput();let dx=input.x,dy=input.y,len=input.len;player.moving=len>.1||dashTime>0;
 if(player.moving)player.anim+=dt*(dashTime>0?23:13);
 if(dashTime>0){const active=Math.min(dt,dashTime);player.x+=dashVector.x*moveSpeed()*3.6*active;player.y+=dashVector.y*moveSpeed()*3.6*active;dashTime=Math.max(0,dashTime-dt);player.facing=Math.atan2(dashVector.y,dashVector.x);}
 else if(len>.1){dx/=Math.max(1,len);dy/=Math.max(1,len);player.x+=dx*moveSpeed()*dt;player.y+=dy*moveSpeed()*dt;player.facing=Math.atan2(dy,dx);dashVector={x:dx/Math.max(.001,Math.hypot(dx,dy)),y:dy/Math.max(.001,Math.hypot(dx,dy))};}
 const da=Math.atan2(Math.sin(player.facing-player.visualFacing),Math.cos(player.facing-player.visualFacing));player.visualFacing+=da*Math.min(1,dt*16);
 tickReferenceRecovery(dt);
 director(dt);tickDoctrine(dt);if(state!=='playing')return;updateTactics(dt);if(state!=='playing')return;updateThreats(dt);if(state!=='playing')return;updateEnemies(dt);if(state!=='playing')return;
 rebuildGrid();separateEnemies();rebuildGrid();updateWeapons(dt);if(state!=='playing')return;updateProjectiles(dt);if(state!=='playing')return;updateAreas(dt);if(state!=='playing')return;updatePickups(dt);
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1);}
 for(let i=texts.length-1;i>=0;i--){texts[i].life-=dt;if(texts[i].life<=0)texts.splice(i,1);}
 for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(e.hp<=0||(e.type!=='boss'&&e.type!=='elite'&&Math.hypot(e.x-player.x,e.y-player.y)>Math.max(W,H)*2.3))enemies.splice(i,1);}
 checkMissions();autosaveClock+=dt;if(autosaveClock>=5){saveRun();}hudTimer-=dt;if(hudTimer<=0){updateHud();hudTimer=.08;}
}

/* v12: distinct hero skills and optional defend-the-beacon field objectives.
   All gameplay uses the same XY ground plane in both render modes. */
let activeHero='assault';
let tactics={cooldown:0,casts:0,turrets:[],fields:[],beacons:[],completed:0,parts:0};
function resetTactics(){
 activeHero=Object.hasOwn(heroCatalog,selectedHero)?selectedHero:'assault';
 tactics={cooldown:0,casts:0,turrets:[],fields:[],beacons:[],completed:0,parts:0};
 runId='run_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,12);
 runMeta=normalizeProfile(profile);levelDraft=chestDraft=null;autosaveClock=0;
}
function castHeroSkill(){
 if(state!=='playing'||!player||paidRun||tactics.cooldown>0)return false;
 const h=heroCatalog[activeHero];tactics.cooldown=heroCooldown();tactics.casts++;if(hasPerk('capacitor'))perkHealing(player.maxHp*.08);
 if(activeHero==='assault'){
  const r=180,amount=140*attackPower();
  areas.push({kind:'heroPulse',x:player.x,y:player.y,r,life:.55,max:.55});
  for(const e of enemies){if(e.hp<=0||Math.hypot(e.x-player.x,e.y-player.y)>r+e.r)continue;
   damage(e,amount,'hero_burst');if(paidRun)break;
   if(e.hp>0&&e.type!=='boss'&&e.type!=='elite'){
    const dx=e.x-player.x,dy=e.y-player.y,d=Math.max(1,Math.hypot(dx,dy));
    e.x+=dx/d*65;e.y+=dy/d*65;e.stun=.7;
   }
  }
  for(const s of enemyShots)if(Math.hypot(s.x-player.x,s.y-player.y)<=r)s.life=0;
  player.inv=Math.max(player.inv,.8);effect(player.x,player.y,h.color,24,1.4);Sound.play('zap');
 }else if(activeHero==='engineer'){
  tactics.turrets.push({x:player.x+32,y:player.y,life:10,max:10,cool:0,yaw:player.facing,dmg:30*attackPower()});
  effect(player.x+32,player.y,h.color,15);Sound.play('upgrade');
 }else{
  tactics.fields.push({x:player.x,y:player.y,r:135,life:6,max:6});
  effect(player.x,player.y,h.color,18);Sound.play('level');
 }
 updateHud(true);saveRun();return true;
}
function spawnBeacon(id='beacon_'+tactics.beacons.length){
 if(tactics.beacons.some(b=>b.id===id)||elapsed>=300)return null;
 const a=rand(0,TAU),b={id,x:player.x+Math.cos(a)*245,y:player.y+Math.sin(a)*245,r:105,progress:0,goal:8,expires:elapsed+75,status:'active',engaged:false,contested:false,completedAt:0};
 tactics.beacons.push(b);toast('보급 거점 발견 · 영역을 8초 확보하면 상자 +70G +부품 2');Sound.play('warn');return b;
}
function updateTactics(dt){
 tactics.cooldown=Math.max(0,tactics.cooldown-dt);
 for(let i=tactics.turrets.length-1;i>=0;i--){
  const t=tactics.turrets[i];t.life-=dt;t.cool=Math.max(0,t.cool-dt);
  if(t.life<=0){tactics.turrets.splice(i,1);continue;}
  const e=nearest(t.x,t.y,420);if(e){t.yaw=Math.atan2(e.y-t.y,e.x-t.x);if(t.cool<=0){
   projectile('drill',t.x,t.y,t.yaw,540,t.dmg,{kind:'turret',source:'turret',r:5,life:1.1,pierce:0,color:'#ffd28b'});t.cool=.32;Sound.play('shot');
  }}
 }
 for(let i=tactics.fields.length-1;i>=0;i--){
  const f=tactics.fields[i],active=Math.min(f.life,dt);f.life-=dt;
  if(Math.hypot(player.x-f.x,player.y-f.y)<=f.r)player.hp=Math.min(player.maxHp,player.hp+player.maxHp*.05*active);
  if(f.life<=0)tactics.fields.splice(i,1);
 }
 if(!stageEvents.has('disabled'))for(const [time,id] of [[45,'beacon_1'],[190,'beacon_2']]){
  if(elapsed>=time&&!stageEvents.has(id)){stageEvents.add(id);spawnBeacon(id);}
 }
 for(const b of tactics.beacons){
  if(b.status!=='active')continue;
  if(elapsed>=b.expires||elapsed>=300){b.status='expired';toast('거점 신호 종료 · 전투를 계속하세요');continue;}
  const inside=Math.hypot(player.x-b.x,player.y-b.y)<=b.r;
  if(inside&&!b.engaged){
   b.engaged=true;
   for(let i=0;i<7&&enemies.length<260;i++){const a=i*TAU/7;spawnEnemy(i===0?'tank':i%3===0?'runner':'grunt',b.x+Math.cos(a)*210,b.y+Math.sin(a)*210);}
   toast('거점 방어 시작 · 적이 영역 안에 있으면 확보가 멈춥니다');
  }
  b.contested=enemies.some(e=>e.hp>0&&Math.hypot(e.x-b.x,e.y-b.y)<b.r+e.r);
  if(inside&&!b.contested)b.progress=Math.min(b.goal,b.progress+dt);
  if(b.progress>=b.goal){
   b.status='complete';b.completedAt=elapsed;tactics.completed++;tactics.parts+=2;player.gold+=70;
   gems.push({x:b.x,y:b.y,r:13,val:0,chest:true});
   for(let i=0;i<8;i++){const a=i*TAU/8;addXpGem(b.x+Math.cos(a)*50,b.y+Math.sin(a)*50,5);}
   effect(b.x,b.y,'#8ff4da',30);Sound.play('evolve');toast('거점 확보! 상자 · +70G · 정산 부품 +2');saveRun();
  }
 }
}
function updateTacticalHud(){
 if(!$('skillbutton'))return;
 const live=!!player&&state!=='menu',h=heroCatalog[activeHero];
 $('skillbutton').textContent=tactics.cooldown>0?h.skill+'\n'+tactics.cooldown.toFixed(1)+'s':h.skill+'\n'+(matchMedia('(pointer:coarse)').matches?'준비':'E');
 $('skillbutton').style.setProperty('--skill',h.color);$('skillbutton').style.setProperty('--ready',String(1-tactics.cooldown/heroCooldown()));
 $('skillbutton').setAttribute('aria-label',h.skill+(tactics.cooldown>0?' 재사용 '+Math.ceil(tactics.cooldown)+'초':' 사용 가능'));
 $('skillbutton').setAttribute('aria-disabled',String(!live||tactics.cooldown>0||state!=='playing'));
 const b=tactics.beacons.find(b=>b.status==='active'),el=$('tacticalHUD');el.style.display=live&&b?'block':'none';
 if(b){const near=Math.hypot(player.x-b.x,player.y-b.y)<=b.r;el.innerHTML=`<span class="mission-label">선택 거점 · ${Math.max(0,Math.ceil(b.expires-elapsed))}초 남음</span><b>${b.contested?'적을 정리하세요':near?'확보 중':'청록 신호를 따라 이동'}</b><span> ${b.progress.toFixed(1)} / ${b.goal}s</span><div class="capture-bar"><i style="width:${b.progress/b.goal*100}%"></i></div>`;}
}
function drawTacticalOverlay(is3D){
 const h=heroCatalog[activeHero];
 // 2D fallback renders the same heal radii and defend area, not decorative-only circles.
 if(!is3D){ctx.save();ctx.translate(W/2-player.x,H/2-player.y);
  for(const f of tactics.fields){ctx.fillStyle='#6cdec026';ctx.strokeStyle='#7be9cc';ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,TAU);ctx.fill();ctx.stroke();}
  for(const t of tactics.turrets){ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.yaw);ctx.fillStyle='#edb361';ctx.fillRect(-13,-13,26,26);ctx.fillStyle='#2f4a61';ctx.fillRect(0,-4,26,8);ctx.restore();}
  for(const b of tactics.beacons){if(b.status==='expired')continue;ctx.strokeStyle=b.status==='complete'?'#e7ce8e':b.contested?'#e99871':'#52e7c4';ctx.lineWidth=3;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,TAU);ctx.stroke();ctx.fillStyle='#51bfa8';ctx.fillRect(b.x-12,b.y-12,24,24);}
  for(const a of areas)if(a.kind==='heroPulse'){ctx.strokeStyle=h.color;ctx.lineWidth=5;ctx.beginPath();ctx.arc(a.x,a.y,a.r*(1-a.life/a.max),0,TAU);ctx.stroke();}
  ctx.restore();
 }
 for(const b of tactics.beacons){if(b.status==='expired'||(b.status==='complete'&&elapsed-b.completedAt>8))continue;const p=screenPoint(b.x,b.y,91);if(p.x<25||p.x>W-25||p.y<90||p.y>H-90)continue;
  ctx.font='800 11px system-ui';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='#244e59';const label=b.status==='complete'?'거점 확보 ✓':b.contested?'점령 중단 · 적 접근':`보급 거점 ${Math.floor(b.progress/b.goal*100)}%`;ctx.strokeText(label,p.x,p.y);ctx.fillStyle='#e5ffed';ctx.fillText(label,p.x,p.y);
 }
 if(graphics.radar!==false&&H>520){
  const size=W<600?92:112,x=W<600?W-size-13:W-size-24,y=W<600?166:188,range=700;
  ctx.save();ctx.translate(x,y);ctx.fillStyle='#153749d9';ctx.strokeStyle='#cff4e557';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(0,0,size,size,12);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.rect(6,6,size-12,size-12);ctx.clip();
  const pos=(px,py)=>({x:size/2+(px-player.x)/range*(size/2-8),y:size/2+(py-player.y)/range*(size/2-8)});
  ctx.strokeStyle='#a6e5cc22';ctx.beginPath();ctx.moveTo(size/2,6);ctx.lineTo(size/2,size-6);ctx.moveTo(6,size/2);ctx.lineTo(size-6,size/2);ctx.stroke();
  for(const e of enemies){if(e.hp<=0)continue;const p=pos(e.x,e.y);ctx.fillStyle=e.type==='boss'?'#ff8d9e':e.type==='elite'?'#ffd17f':'#d3a6a1';const r=e.type==='boss'?4:2;ctx.fillRect(p.x-r,p.y-r,r*2,r*2);}
  for(const g of gems){if(!g.chest)continue;const p=pos(g.x,g.y);ctx.fillStyle='#ffe18c';ctx.fillRect(p.x-2.5,p.y-2.5,5,5);}
  for(const b of tactics.beacons){if(b.status!=='active')continue;const p=pos(b.x,b.y);ctx.strokeStyle='#7df1ce';ctx.lineWidth=2;ctx.strokeRect(p.x-4,p.y-4,8,8);}
  ctx.fillStyle='#d4ffed';ctx.beginPath();ctx.moveTo(size/2,size/2-5);ctx.lineTo(size/2-4,size/2+4);ctx.lineTo(size/2+4,size/2+4);ctx.fill();ctx.restore();
  ctx.font='700 8px system-ui';ctx.textAlign='right';ctx.fillStyle='#c8efdf';ctx.fillText('RADAR · N',x+size-7,y+size-6);
 }
}

function newDoctrine(){return {taken:[],draft:null,barrierReady:false,safeTime:0,blastKills:0,healKills:0,blasts:[],log:[],stats:{blocked:0,healed:0,shieldDamage:0,affixKills:0,explosions:0}};}
let doctrine=newDoctrine();
function hasPerk(k){return doctrine.taken.includes(k);}
function heroCooldown(){return heroCatalog[activeHero].cooldown*(hasPerk('capacitor')?.8:1);}
function perkHealing(amount){const healed=Math.max(0,Math.min(player.maxHp-player.hp,amount));player.hp+=healed;doctrine.stats.healed+=healed;if(healed>=1)floatText(player.x,player.y,'+'+Math.round(healed),'#b2ffd7');return healed;}
function perkSlotsEarned(){return PERK_LEVELS.filter(lv=>player&&player.lv>=lv).length;}
function maybeOfferPerk(){
 if(state!=='playing'||paidRun||!player||doctrine.taken.length>=perkSlotsEarned())return false;
 if(!doctrine.draft){const pool=Object.keys(perkCatalog).filter(k=>!hasPerk(k));for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}doctrine.draft=pool.slice(0,3);}
 perkMenu();return true;
}
function choosePerk(k){
 if(state!=='perk'||paidRun||!doctrine.draft?.includes(k)||hasPerk(k)||doctrine.taken.length>=3||doctrine.taken.length>=perkSlotsEarned())return false;
 doctrine.taken.push(k);doctrine.draft=null;
 if(k==='capacitor')tactics.cooldown*=.8;
 if(k==='dashPulse')dashCooldown*=.75;
 if(k==='barrier'){doctrine.safeTime=0;doctrine.barrierReady=false;}
 Sound.play('evolve');effect(player.x,player.y,'#b8f8df',24);resumePlay();return true;
}
function perkMenu(){
 state='perk';const opts=doctrine.draft||[];
 show(`<div class="eyebrow">SPECIALIZATION / ${doctrine.taken.length+1} OF 3</div><h1>이번 전투의 방식을 바꾸세요.</h1><p class="intro">Lv.5 · 10 · 15에서 특성을 하나씩 선택합니다.<br>무기·보조 슬롯을 사용하지 않으며 이번 전투에만 적용됩니다.</p><div class="cards perk-cards">${opts.map((k,i)=>{const p=perkCatalog[k];return `<button class="card perk-card" data-perk="${k}" style="--perk:${p.color}"><span class="keycap">${i+1}</span><span class="emoji">${p.icon}</span><span class="perk-group">${p.group}</span><b>${p.name}</b><small>${p.desc}</small><span class="perk-detail">${p.detail}</span></button>`;}).join('')}</div><div class="perk-owned">${doctrine.taken.length?doctrine.taken.map(k=>`<span>${perkCatalog[k].icon} ${perkCatalog[k].name}</span>`).join(''):'아직 선택한 특성이 없습니다.'}</div><button class="action secondary" id="savePerkLobby">선택 보류 · 저장 후 로비</button><p class="hint">1 / 2 / 3으로 선택 · 선택 화면에서는 모든 전투 시간이 정지됩니다.</p>`);

function serializeBackup(){return JSON.stringify({format:'SurvivorArena',version:12,savedAt:new Date().toISOString(),profile},null,2);}
function parseBackup(text){
 if(typeof text!=='string'||text.length>65536)throw Error('64KB 이하의 저장 JSON만 지원합니다.');
 let obj;try{obj=JSON.parse(text);}catch(e){throw Error('JSON 형식이 올바르지 않습니다.');}
 if(!obj||obj.format!=='SurvivorArena'||![11,12].includes(obj.version)||!obj.profile||Array.isArray(obj.profile))throw Error('Survivor Arena v11/v12 백업이 아닙니다.');
 for(const k of ['gold','attack','hp','armor','wins','runs'])if(!Number.isFinite(obj.profile[k])||obj.profile[k]<0)throw Error('저장 수치가 올바르지 않습니다: '+k);
 return normalizeProfile(obj.profile);
}

 $('missionHUD').innerHTML=`<span class="mission-label">REFERENCE / PROTOTYPE</span><b>액티브 ${owned('weapon').length}/6 · 보조 ${owned('passive').length}/6</b><br>${player.levels.guardian?(guardianVisible()?'수호자 가동':'수호자 재전개 '+Math.ceil(refRun().guardRest)+'s'): '조합을 맞추어 진화하세요'}${startingWeapon==='revolver'?'<br>탄창 '+refRun().ammo+(refRun().reload>0?' · 재장전 '+refRun().reload.toFixed(1)+'s':''):''}`;
 const el=$('passiveHUD');if(el)el.innerHTML=owned('passive').map(k=>`<span class="passive-chip" title="${definitions[k].name}">${definitions[k].icon}<small>${player.levels[k]}</small></span>`).join('')+Array.from({length:6-owned('passive').length},()=>'<span class="passive-chip empty">·</span>').join('');
};
const oldDrawOverlay=drawOverlay;
drawOverlay=function(){oldDrawOverlay();if(player&&state!=='menu'&&(renderer3d.mode==='2D'||renderer3d.fallback)){
 ctx.save();ctx.translate(W/2-player.x,H/2-player.y);
 if(player.levels.forcefield){ctx.strokeStyle='#9de9cf';ctx.fillStyle='#83ddba18';ctx.lineWidth=2;ctx.beginPath();ctx.arc(player.x,player.y,forcefieldRadius(),0,TAU);ctx.fill();ctx.stroke();}
 for(const a of areas)if(a.kind==='slash'){ctx.strokeStyle='#d6fae7';ctx.lineWidth=6;ctx.globalAlpha=a.life/a.max;ctx.beginPath();ctx.arc(a.x,a.y,a.r,a.angle-a.spread/2,a.angle+a.spread/2);ctx.stroke();}ctx.restore();ctx.globalAlpha=1;
}};
finish=function(win,reason=''){
 if(paidRun||!player)return;if(profile.settledRuns.includes(runId)){paidRun=true;dropRunSave();menu();return;}checkMissions();paidRun=true;state=win?'win':'dead';clearInputs();
 const credit=player.gold+(win?100*(chapter+1):0);profile.gold+=credit;profile.best=Math.max(profile.best,player.kills);const c=profile.campaign[chapter];c.bestKills=Math.max(c.bestKills,player.kills);
 if(win){profile.wins++;c.clears++;c.stars=Math.max(c.stars,1+(runStats.evolutions>0?1:0)+(player.kills>500?1:0));profile.unlocked=Math.min(3,Math.max(profile.unlocked,chapter+2));}
 profile.settledRuns.push(runId);profile.settledRuns=profile.settledRuns.slice(-64);if(saveProfile())dropRunSave();updateHud(true);Sound.play(win?'win':'hurt');
 show(`<div class="eyebrow">${win?'SURVIVED':'RUN COMPLETE'} / REFERENCE PLAYABLE</div><h1>${win?'살아남았습니다.':reason||'다시, 더 나은 빌드로.'}</h1><p>${chapters[chapter].name} · ${fmt(elapsed)} · Lv.${player.lv} · ${player.kills} 처치</p><div class="reward-grid"><div><small>이번 전투 기록용 크레딧</small><b>+${credit}</b></div><div><small>진화 · 합체</small><b>${runStats.evolutions}회</b></div></div>${referenceStatsHTML()}<details class="damage-details" open><summary>무기별 피해량</summary>${damageTable()}</details>${recapPanel()}<div class="menu-buttons"><button class="action" id="again">다시 도전</button><button class="action secondary" id="resultLobby">로비</button></div><p class="hint">크레딧은 기록용입니다. 원작 장비 경제·결제·후기 성장은 미적용입니다.</p>${!storageAvailable?'<p class="warning">저장 실패 · 설정에서 기록을 백업하세요.</p>':''}`);$('again').onclick=reset;$('resultLobby').onclick=menu;
};
serializeBackup=()=>JSON.stringify({format:'SurvivorReference',version:14,profile},null,2);
parseBackup=function(text){if(typeof text!=='string'||text.length>100000)throw Error('백업 크기가 올바르지 않습니다.');const s=JSON.parse(text);if(s?.format!=='SurvivorReference'||s.version!==14||!s.profile)throw Error('참조 모드 v14 영구 기록만 가져올 수 있습니다. v13 저장은 커스텀 모드에서 여세요.');for(const k of ['gold','attack','hp','armor','wins','runs'])if(!Number.isFinite(s.profile[k])||s.profile[k]<0)throw Error('저장 수치 오류: '+k);return normalizeProfile(s.profile);};
menu=function(){
 state='menu';clearInputs();renderer3d.resetCamera(0,0);show(`<div class="eyebrow">SURVIVOR ARENA / V14 · R3 REFERENCE</div><h1 class="hero-title">움직이고. 조합하고.<br><span>끝까지 살아남으세요.</span></h1><p class="intro">블록 3D 서바이버 · 원작 공개 조합을 연결한 플레이어블<br>주무기 5종 · 전투 액티브 11종 · 보조 12종 · 진화·합체 15개</p><div id="continueSlot"></div><div class="ref-section-title">01 / 출전 주무기 <small>장착 무기가 첫 액티브 슬롯을 차지합니다.</small></div><div class="ref-weapons">${MAIN_WEAPONS.map(k=>`<button class="ref-weapon ${startingWeapon===k?'selected':''}" data-main="${k}" aria-pressed="${startingWeapon===k}"><span>${definitions[k].icon}</span><b>${definitions[k].name}</b><small>${k==='kunai'||k==='revolver'?'자동 조준':'이동 방향 조준'}</small></button>`).join('')}</div><p id="weaponHint" class="ref-weapon-hint"></p><div class="ref-section-title">02 / 전장 설정 <small>전장·웨이브·전투 수치는 자체 재구성</small></div><div class="menu-grid ref-options"><label class="field">전장<select id="chapter">${chapters.map((c,i)=>`<option value="${i}">${c.name}</option>`).join('')}</select></label><label class="field">시간축<select id="runDuration"><option value="300">5분 테스트</option><option value="900">15분 생존</option></select></label><label class="field">난이도<select id="difficulty"><option value="normal">일반</option><option value="hard">도전 · 적 ×1.5</option></select></label></div><details class="ref-tech"><summary>과학 부품 효과 시험 <span>선택 · 획득/등급 성장 미구현</span></summary><label><input type="checkbox" id="techPrecision"> 정밀 유도 · 드론 탄환 추적</label><label><input type="checkbox" id="techPhase"> 위상 변환 · 낙뢰 +2회</label><label><input type="checkbox" id="techMaintainer"> 고성능 유지 · 로켓 기본 간격 −0.5초</label></details><button class="action" id="start">전투 시작 →</button><div class="menu-buttons"><button class="action secondary" id="guide">조합 도감</button><button class="action secondary" id="settings">화면 · 소리 · 저장</button><a class="action secondary" href="custom/index.html" title="ZIP 패키지에서 실행">기존 v13 커스텀 ↗</a></div><div class="ref-meta"><span>${profile.runs}회 출전</span><span>${profile.wins}회 생존</span><span>최고 ${profile.best} 처치</span></div><div class="controls"><span><kbd>WASD</kbd>이동</span><span><kbd>1 · 2 · 3</kbd>강화 선택</span><span><kbd>B</kbd>빌드</span><span><kbd>P</kbd>일시정지</span><span><kbd>V</kbd>2D / 3D</span></div><p class="hint">독립 프로토타입 · 공개 참조 규칙 + 구현용 밸런스 · 원작 전체 복원 아님<br>기존 v13 저장과 완전히 분리됩니다. 커스텀 링크는 ZIP에서만 연결됩니다.</p>${!storageAvailable?'<p class="warning">브라우저 저장소 사용 불가 · 설정에서 JSON 백업을 보관하세요.</p>':''}`);
 const refresh=()=>{$('weaponHint').textContent=definitions[startingWeapon].desc;document.querySelectorAll('[data-main]').forEach(b=>{b.classList.toggle('selected',b.dataset.main===startingWeapon);b.setAttribute('aria-pressed',String(b.dataset.main===startingWeapon));});};
 document.querySelectorAll('[data-main]').forEach(b=>b.onclick=()=>{startingWeapon=b.dataset.main;refresh();});refresh();$('chapter').value=chapter;$('chapter').onchange=e=>chapter=+e.target.value;$('difficulty').value=difficulty;$('difficulty').onchange=e=>difficulty=e.target.value;
 $('runDuration').value=referenceOptions.duration;$('runDuration').onchange=e=>{referenceOptions.duration=+e.target.value;saveReferenceOptions();};
 for(const [id,k] of [['techPrecision','precision'],['techPhase','phase'],['techMaintainer','maintainer']]){$(id).checked=referenceOptions[k];$(id).onchange=e=>{referenceOptions[k]=e.target.checked;saveReferenceOptions();};}
 $('start').onclick=requestNewRun;$('guide').onclick=guideMenu;$('settings').onclick=settingsMenu;renderContinueCard();updateHud(true);
};
const passiveHUD=document.createElement('div');passiveHUD.id='passiveHUD';document.body.appendChild(passiveHUD);
// Rebind the development bridge after replacing rules. Absent outside #test.
if(window.__test)Object.assign(window.__test,{reset,menu,fire,spawnEnemy,spawnBoss,director,updateWeapons,updateProjectiles,applyUpgrade,evolutionEligible,evolveWeapon,upgradeOptions,gainXp,hurt,dash,castHeroSkill,finish,buildMenu,levelUp,guideMenu,updateHud,draw,saveRun,serializeRun,parseRunSave,restoreRun,serializeBackup,parseBackup,weaponDamage,weaponInterval,attackPower,moveSpeed,rangePower,durationPower,projectilePower,pickupRadius,passiveValue,tickReferenceRecovery,awardPickupGold,guardianNodes,guardianVisible,forcefieldRadius,projectile,validReferenceDraft,maybeOfferPerk,decorateElite,MAIN_WEAPONS,referenceOptions,refRecipeRows,REF_BALANCE,REFERENCE_DB});

/* Physical-key layout and pointer capture are shared by 2D and 3D. */
const movementCodes={KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',ArrowUp:'arrowup',ArrowDown:'arrowdown',ArrowLeft:'arrowleft',ArrowRight:'arrowright',Space:' ',KeyP:'p',Escape:'escape'};
addEventListener('keydown',e=>{
 const tag=document.activeElement?.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tag))return;
 const k=movementCodes[e.code]||e.key.toLowerCase();
 if(state==='playing'&&movementCodes[e.code])e.preventDefault();
 if(state==='playing'&&['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k))keys.add(k);
 if((k==='escape'||k==='p')&&!e.repeat)pause();
 if(k===' '&&!e.repeat)dash();
 if(e.code==='KeyE'&&!e.repeat){e.preventDefault();castHeroSkill();}
 if(e.code==='KeyN'&&!e.repeat){graphics.radar=!graphics.radar;saveGraphics();toast(graphics.radar?'레이더 켜짐':'레이더 꺼짐');}
 if(e.code==='KeyB'&&!e.repeat){e.preventDefault();if(state==='playing')buildMenu();else if(state==='build')resumePlay();}
 if(e.code==='KeyV'&&!e.repeat)toggleView();
 if(e.code==='KeyM'&&!e.repeat)toggleSound();
 if(e.code==='F2'&&!e.repeat){e.preventDefault();graphics.stats=!graphics.stats;$('diagnostics').style.display=graphics.stats?'block':'none';}
 if(state==='perk'&&!e.repeat&&['Digit1','Digit2','Digit3'].includes(e.code)){e.preventDefault();document.querySelectorAll('[data-perk]')[+e.code.slice(-1)-1]?.click();return;}
 if(state==='level'&&!e.repeat){if(['Digit1','Digit2','Digit3'].includes(e.code)){document.querySelectorAll('[data-skill]')[+e.code.slice(-1)-1]?.click();}if(e.code==='KeyR')$('reroll')?.click();}
});
addEventListener('keyup',e=>keys.delete(movementCodes[e.code]||e.key.toLowerCase()));
$('skillbutton').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();castHeroSkill();});
$('pause').onclick=pause;$('dashbutton').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();dash();});
$('buildbutton').onclick=()=>{if(state==='playing')buildMenu();else if(state==='build')resumePlay();};
$('soundbutton').onclick=toggleSound;
addEventListener('blur',()=>{clearInputs();if(state==='playing')pause();saveRun();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInputs();if(state==='playing')pause();Sound.suspend();saveRun();}});
addEventListener('pagehide',()=>saveRun());
const joyEl=$('joystick'),stick=$('stick');
cvs.addEventListener('pointerdown',e=>{
 if(state!=='playing'||e.pointerType==='mouse'||joy.active)return;
 joy.active=true;joy.id=e.pointerId;joy.x=e.clientX;joy.y=e.clientY;
 joyEl.style.left=(e.clientX-55)+'px';joyEl.style.top=(e.clientY-55)+'px';joyEl.style.bottom='auto';
 try{cvs.setPointerCapture(e.pointerId);}catch(err){}
});
cvs.addEventListener('pointermove',e=>{
 if(!joy.active||e.pointerId!==joy.id)return;const dx=e.clientX-joy.x,dy=e.clientY-joy.y,len=Math.max(45,Math.hypot(dx,dy));
 joy.dx=dx/len;joy.dy=dy/len;stick.style.left=(35+joy.dx*34)+'px';stick.style.top=(35+joy.dy*34)+'px';
});
function endJoy(e){if(e.pointerId!==joy.id)return;clearInputs();}
cvs.addEventListener('pointerup',endJoy);cvs.addEventListener('pointercancel',endJoy);cvs.addEventListener('lostpointercapture',endJoy);
$('viewmode').onclick=toggleView;
$('qualitybutton').onclick=()=>{graphics.quality=graphics.quality==='normal'?'high':graphics.quality==='high'?'low':'normal';saveGraphics();refreshSettingsButtons();toast('화질: '+$('qualitybutton').textContent);};
refreshSettingsButtons();

menu();requestAnimationFrame(loop);
</script></body></html>

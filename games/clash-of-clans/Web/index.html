const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch{}};const fmt=n=>Math.floor(n).toLocaleString('ko-KR');const say=m=>{logs.unshift('• '+m);logs=logs.slice(0,9);$('log').textContent=logs.join('\n');$('log').style.whiteSpace='pre-line'};const cap=()=>3000+s.hall*900+s.buildings.filter(b=>b.t==='storage').reduce((a,b)=>a+1700*b.l,0);const used=()=>Object.entries(U).reduce((a,[k,u])=>a+(s.army[k]||0)*u.space,0);const armyCap=()=>18+s.hall*5+s.buildings.filter(b=>b.t==='camp').reduce((a,b)=>a+14*b.l,0);const count=t=>s.buildings.filter(b=>b.t===t).length;const add=(g,e)=>{s.gold=Math.min(cap(),s.gold+g);s.elixir=Math.min(cap(),s.elixir+e);save()};const spend=(g,e)=>{if(s.gold<g||s.elixir<e){say('자원이 부족합니다.');return false}s.gold-=g;s.elixir-=e;save();return true};const req=t=>B[t].unlock||1;

function upgrade(id){if(s.buildTask){say('장인이 작업 중입니다.');return}const b=s.buildings.find(b=>b.id===id);if(!b)return;const next=b.l+1;if(next>s.hall+1){say('회관 레벨을 먼저 올리세요.');return}const g=Math.round(B[b.t].cost*(.9+b.l*.9)),e=Math.round(g*.35);if(!spend(g,e))return;s.buildTask={kind:'building',id,end:Date.now()+Math.round(10000+next*6000)};say(B[b.t].n+' 업그레이드 시작');save();refresh()}

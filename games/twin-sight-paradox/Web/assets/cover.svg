<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="EVE burst error Multi-Sight Cover">
  <defs>
    <!-- Kojiro Warm Noir Amber-Crimson Gradient -->
    <linearGradient id="kojiroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190c0a"/>
      <stop offset="55%" stop-color="#3b1610"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>

    <!-- Marina Cool Intelligence Cobalt-Cyan Gradient -->
    <linearGradient id="marinaBg" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#051021"/>
      <stop offset="55%" stop-color="#0b2847"/>
      <stop offset="100%" stop-color="#0e4a6f"/>
    </linearGradient>

    <!-- Diagonal Split Clip Paths -->
    <clipPath id="leftHalf">
      <polygon points="0,0 475,0 325,450 0,450"/>
    </clipPath>
    <clipPath id="rightHalf">
      <polygon points="475,0 800,0 800,450 325,450"/>
    </clipPath>

    <!-- Glows & Accents -->
    <radialGradient id="amberGlow" cx="30%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.52"/>
      <stop offset="60%" stop-color="#dc2626" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#190c0a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow" cx="72%" cy="62%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.52"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#051021" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="slashBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="titleMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- LEFT SIDE: KOJIRO AMAGI (Hardboiled Harbor Noir) -->
  <g clip-path="url(#leftHalf)">
    <rect width="800" height="450" fill="url(#kojiroBg)"/>
    <rect width="800" height="450" fill="url(#amberGlow)"/>

    <!-- Noir Venetian Blinds & Harbor Silhouette -->
    <g opacity="0.22" fill="#0c0605">
      <rect x="0" y="28" width="460" height="10"/>
      <rect x="0" y="54" width="450" height="10"/>
      <rect x="0" y="80" width="440" height="10"/>
      <rect x="0" y="106" width="430" height="10"/>
      <rect x="0" y="132" width="420" height="10"/>
    </g>

    <!-- Harbor Warehouse Cranes & Skyline -->
    <g fill="#120706" opacity="0.88">
      <rect x="20" y="275" width="95" height="175"/>
      <polygon points="20,275 67,242 115,275"/>
      <rect x="128" y="305" width="110" height="145"/>
      <rect x="250" y="260" width="60" height="190"/>
      <!-- Crane Arm -->
      <path d="M210 305 L240 205 L335 170 L338 176 L246 212 L222 305 Z"/>
      <line x1="322" y1="178" x2="322" y2="255" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>
    </g>

    <!-- Amber Detective Silhouette (Coat Collar + Profile) -->
    <g transform="translate(88,128)">
      <ellipse cx="64" cy="52" rx="28" ry="33" fill="#0d0605" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1.5"/>
      <path d="M12 225 L26 112 L52 96 L64 114 L76 96 L106 112 L124 225 Z" fill="#0d0605" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.5"/>
      <!-- Trench Collar Highlight -->
      <path d="M38 98 L64 140 L90 98" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.85"/>
    </g>

    <!-- Rain Streaks -->
    <g stroke="#fbbf24" stroke-opacity="0.22" stroke-width="1">
      <line x1="45" y1="10" x2="25" y2="140"/>
      <line x1="160" y1="20" x2="140" y2="170"/>
      <line x1="275" y1="0" x2="252" y2="155"/>
      <line x1="340" y1="40" x2="318" y2="195"/>
    </g>

    <!-- Top-Left Side Tag -->
    <text x="28" y="38" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="3">SIGHT A // KOJIRO AMAGI</text>
    <text x="28" y="55" fill="#fca5a5" font-family="'Segoe UI', sans-serif" font-size="10" letter-spacing="1.5" opacity="0.85">PRIVATE INVESTIGATOR · HARBOR NOIR</text>
  </g>

  <!-- RIGHT SIDE: MARINA HOJO (JCIA Intelligence DBMS Cobalt) -->
  <g clip-path="url(#rightHalf)">
    <rect width="800" height="450" fill="url(#marinaBg)"/>
    <rect width="800" height="450" fill="url(#cyanGlow)"/>

    <!-- Digital Intelligence Grid & DBMS Level-7 Radar -->
    <g stroke="#38bdf8" stroke-opacity="0.16" stroke-width="1">
      <line x1="420" y1="60" x2="790" y2="60"/>
      <line x1="410" y1="110" x2="790" y2="110"/>
      <line x1="400" y1="160" x2="790" y2="160"/>
      <line x1="390" y1="210" x2="790" y2="210"/>
      <line x1="380" y1="260" x2="790" y2="260"/>
      <line x1="370" y1="310" x2="790" y2="310"/>
      <line x1="500" y1="0" x2="500" y2="450"/>
      <line x1="580" y1="0" x2="580" y2="450"/>
      <line x1="660" y1="0" x2="660" y2="450"/>
      <line x1="740" y1="0" x2="740" y2="450"/>
    </g>

    <!-- Security HUD Arcs -->
    <g fill="none" stroke="#38bdf8" opacity="0.35">
      <circle cx="655" cy="185" r="88" stroke-dasharray="14 8" stroke-width="1.5"/>
      <circle cx="655" cy="185" r="64" stroke-dasharray="4 6" stroke-width="1.2"/>
    </g>

    <!-- Marina Agent Silhouette -->
    <g transform="translate(570,122)">
      <ellipse cx="75" cy="52" rx="25" ry="31" fill="#040d1a" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="1.5"/>
      <!-- Short Dynamic Agent Hair Silhouette -->
      <path d="M48 45 Q55 12 82 18 Q106 24 104 56 Q96 42 75 40 Q58 40 48 45 Z" fill="#040d1a" stroke="#38bdf8" stroke-width="1.2"/>
      <path d="M30 230 L42 108 L75 94 L108 108 L120 230 Z" fill="#040d1a" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.5"/>
      <!-- Jacket Lapel Glow -->
      <path d="M52 104 L75 144 L98 104" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.9"/>
    </g>

    <!-- Terminal Metadata -->
    <text x="772" y="38" text-anchor="end" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="3">SIGHT B // MARINA HOJO</text>
    <text x="772" y="55" text-anchor="end" fill="#a5b4fc" font-family="'Segoe UI', sans-serif" font-size="10" letter-spacing="1.5" opacity="0.88">JCIA CLASS-1 AGENT · DBMS LEVEL-7</text>
    <text x="772" y="426" text-anchor="end" fill="#38bdf8" font-family="monospace" font-size="10" opacity="0.65">SYNC BARRIERS: SB_01 .. SB_08 // CONVERGENCE: TRISTAN</text>
  </g>

  <!-- DIAGONAL SPLIT BEAM -->
  <line x1="475" y1="0" x2="325" y2="450" stroke="url(#slashBeam)" stroke-width="3.5" filter="url(#neonGlow)"/>

  <!-- CENTERPIECE: INTERLOCKING SIGHT CHANGE RINGS -->
  <g transform="translate(400,210)" filter="url(#neonGlow)">
    <!-- Left Amber Ring (Kojiro) -->
    <circle cx="-36" cy="0" r="62" fill="rgba(25,12,10,0.55)" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="-36" cy="0" r="51" fill="none" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="10 6"/>
    <!-- Right Cyan Ring (Marina) -->
    <circle cx="36" cy="0" r="62" fill="rgba(5,16,33,0.55)" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="36" cy="0" r="51" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="10 6"/>
    <!-- Interlocking Lens Core -->
    <circle cx="0" cy="0" r="26" fill="#090d16" stroke="#f8fafc" stroke-width="1.8"/>
    <text x="0" y="7" text-anchor="middle" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="700">⇄</text>
  </g>

  <!-- TITLE PLATE -->
  <g transform="translate(400,342)">
    <rect x="-250" y="-42" width="500" height="84" rx="10" fill="rgba(6, 10, 18, 0.84)" stroke="rgba(255,255,255,0.22)" stroke-width="1.2"/>
    <text x="0" y="-3" text-anchor="middle" fill="url(#titleMetal)" font-family="'Segoe UI', 'Malgun Gothic', sans-serif" font-size="38" font-weight="800" letter-spacing="6">EVE burst error</text>
    <text x="0" y="25" text-anchor="middle" fill="#cbd5e1" font-family="'Segoe UI', 'Malgun Gothic', sans-serif" font-size="13" font-weight="600" letter-spacing="2.4">MULTI-SIGHT MYSTERY ADV · 복수 주인공 관점 전환 &amp; 정보 비대칭</text>
  </g>

  <!-- Subtle Outer Frame -->
  <rect x="10" y="10" width="780" height="430" rx="8" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
</svg>

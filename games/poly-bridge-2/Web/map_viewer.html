<!doctype html><html lang="ko"><meta charset="utf-8"><title>Poly Bridge 2 Map Reconstruction</title><style>body{background:#14222b;color:#eee;font:16px sans-serif;text-align:center}canvas{background:#8cc5d5;max-width:96%;border-radius:12px}</style><h2>1-01 추정 맵 (원작 좌표 아님)</h2><p>10m 교량 구간 / 예산 $10,000</p><canvas id="c" width="900" height="450"></canvas><script>const c=document.getElementById('c'),x=c.getContext('2d');function X(v){return 450+v*35}function Y(v){return 190-v*35}x.fillStyle='#3c8aaf';x.fillRect(0,Y(-2),900,450);for(const a of [[[-5,-4],[-5,0],[0,0],[0,-4]],[[10,-4],[10,0],[15,0],[15,-4]]]){x.beginPath();a.forEach(([u,v],i)=>i?x.lineTo(X(u),Y(v)):x.moveTo(X(u),Y(v)));x.closePath();x.fillStyle='#6c8e61';x.fill()}x.strokeStyle='#fff';x.setLineDash([8,8]);x.beginPath();x.moveTo(X(0),Y(0));x.lineTo(X(10),Y(0));x.stroke();x.setLineDash([]);for(const a of [0,10]){x.fillStyle='#d44';x.beginPath();x.arc(X(a),Y(0),7,0,7);x.fill()}x.fillStyle='#123';x.font='18px sans-serif';x.fillText('10m gap',X(3.7),Y(1));</script></html>

const MAT={road:{price:180,stiff:0.82,break:0.16,color:'#edb46b',width:7},wood:{price:90,stiff:0.66,break:0.115,color:'#997253',width:4},steel:{price:240,stiff:0.92,break:0.095,color:'#c8d6dd',width:5},cable:{price:110,stiff:0.78,break:0.18,color:'#f3e6ad',width:3},hydraulic:{price:350,stiff:0.95,break:0.24,color:'#a9edfa',width:6}};
const canvas=document.querySelector('#c'),ctx=canvas.getContext('2d'),select=document.querySelector('#level'),info=document.querySelector('#info');
let bridgePhase=0,splitJoint=false,phaseClock=0;let level,nodes=[],edges=[],pick=null,tool='road',running=false,paused=false,car=null,message='',history=[],future=[],frame=0,raf=0,cam={};
LEVELS.forEach((l,i)=>{const o=document.createElement('option');o.value=i;o.textContent=l.id+' — '+l.title;select.append(o)});
const length=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),money=()=>Math.round(edges.reduce((s,e)=>s+e.rest*MAT[e.type].price,0));
function snapshot(){history.push(JSON.stringify({nodes,edges}));if(history.length>80)history.shift();future=[]}
function apply(data){nodes=data.nodes;edges=data.edges;pick=null;running=false;car=null;message='';draw()}
function init(){bridgePhase=0;splitJoint=false;phaseClock=0;document.querySelector('#hydro').value=100;cancelAnimationFrame(raf);level=LEVELS[+select.value];nodes=level.anchors.map(([x,y])=>({x,y,px:x,py:y,fixed:true}));edges=[];pick=null;running=false;car=null;history=[];future=[];message='';resize()}
function resize(){const r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);cam.scale=Math.min(canvas.width/(level.span+11),canvas.height/(level.depth+13));cam.ox=(canvas.width-level.span*cam.scale)/2;cam.oy=canvas.height*.32;draw()}
function sx(x){return cam.ox+x*cam.scale}function sy(y){return cam.oy-y*cam.scale}function point(ev){const r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;return {x:Math.round(((ev.clientX-r.left)*d-cam.ox)/cam.scale*2)/2,y:Math.round((cam.oy-(ev.clientY-r.top)*d)/cam.scale*2)/2}}
function near(p){let idx=-1,dist=.38;nodes.forEach((n,i)=>{const dd=length(n,p);if(dd<dist){dist=dd;idx=i}});return idx}
function addEdge(a,b,type){if(a===b||edges.some(e=>(e.a===a&&e.b===b)||(e.a===b&&e.b===a)))return false;const rest=length(nodes[a],nodes[b]);if(rest>.01&&rest<=6){edges.push({a,b,type,rest,broken:false,stress:0});return true}message='부재 길이 제한: 6m';return false}
function erase(p){let best=-1,bd=.35;edges.forEach((e,i)=>{const a=nodes[e.a],b=nodes[e.b],vx=b.x-a.x,vy=b.y-a.y,t=Math.max(0,Math.min(1,((p.x-a.x)*vx+(p.y-a.y)*vy)/(vx*vx+vy*vy||1))),d=Math.hypot(p.x-a.x-vx*t,p.y-a.y-vy*t);if(d<bd){bd=d;best=i}});if(best>=0){snapshot();edges.splice(best,1)}}
canvas.addEventListener('pointerdown',ev=>{if(running)return;const p=point(ev);if(tool==='erase'||ev.button===2){erase(p);pick=null;draw();return}let i=near(p);if(i<0){snapshot();i=nodes.length;nodes.push({...p,px:p.x,py:p.y,fixed:false})}if(pick===null)pick=i;else{snapshot();addEdge(pick,i,tool);pick=null}draw()});canvas.addEventListener('contextmenu',e=>e.preventDefault());
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(q=>q.classList.toggle('active',q===b));pick=null;draw()});
function preset(){snapshot();nodes=level.anchors.map(([x,y])=>({x,y,px:x,py:y,fixed:true}));edges=[];const count=Math.ceil(level.span/2);let top=[],bottom=[];for(let i=0;i<=count;i++){const x=level.span*i/count;let idx=near({x,y:0});if(idx<0){idx=nodes.length;nodes.push({x,y:0,px:x,py:0,fixed:false})}top.push(idx);const by=-2.2;bottom.push(nodes.length);nodes.push({x,y:by,px:x,py:by,fixed:false})}for(let i=0;i<count;i++){addEdge(top[i],top[i+1],'road');addEdge(bottom[i],bottom[i+1],'wood');addEdge(top[i],bottom[i],'wood');addEdge(top[i],bottom[i+1],'wood');addEdge(bottom[i],top[i+1],'wood')}addEdge(top[count],bottom[count],'wood');message='트러스 예제 배치 완료';draw()}
document.querySelector('#preset').onclick=preset;document.querySelector('#reset').onclick=init;document.querySelector('#undo').onclick=()=>{if(!history.length)return;future.push(JSON.stringify({nodes,edges}));apply(JSON.parse(history.pop()))};document.querySelector('#redo').onclick=()=>{if(!future.length)return;history.push(JSON.stringify({nodes,edges}));apply(JSON.parse(future.pop()))};select.onchange=init;
function roadAt(x){if(splitJoint && bridgePhase===1 && Math.abs(x-level.span/2)<.5)return null;let result=null;for(const e of edges){if(e.broken||e.type!=='road')continue;const a=nodes[e.a],b=nodes[e.b];if(x<Math.min(a.x,b.x)-.02||x>Math.max(a.x,b.x)+.02||Math.abs(a.x-b.x)<.001)continue;const t=(x-a.x)/(b.x-a.x),y=a.y+(b.y-a.y)*t;if(!result||Math.abs(y)<Math.abs(result.y))result={y,e,t}}return result}
function roadContinuous(){for(let x=.1;x<level.span;x+=.15)if(!roadAt(x))return false;return true}
function resetPhysics(){bridgePhase=0;phaseClock=0;document.querySelector('#hydro').value=100;nodes.forEach(n=>{n.px=n.x;n.py=n.y});edges.forEach(e=>{e.broken=false;e.stress=0})}
function step(dt){const hydraulicRatio=Number(document.querySelector('#hydro').value)/100;const gravity=-9.8,sub=5,sd=dt/sub;for(let s=0;s<sub;s++){const weight=nodes.map(()=>0);if(car&&car.x>=0&&car.x<=level.span){const contact=roadAt(car.x);if(contact){const mass=level.vehicle==='truck'?2.4:level.vehicle==='van'?1.7:1.1;weight[contact.e.a]+=mass*(1-contact.t);weight[contact.e.b]+=mass*contact.t;car.y=contact.y+.48}else{car.falling=true}}for(let i=0;i<nodes.length;i++){const n=nodes[i];if(n.fixed)continue;const vx=(n.x-n.px)*.992,vy=(n.y-n.py)*.992;n.px=n.x;n.py=n.y;n.x+=vx;n.y+=vy+(gravity*(.08+weight[i]*.15))*sd*sd}for(let it=0;it<9;it++)for(const e of edges){if(e.broken)continue;const a=nodes[e.a],b=nodes[e.b],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.0001,delta=(d-e.rest)/d;if(e.type==='cable'&&delta<0)continue;const target=e.type==='hydraulic'?e.rest*hydraulicRatio:e.rest;const stress=Math.abs(d-target)/Math.max(.01,e.rest);e.stress=Math.max(stress,e.stress*.92);if(stress>MAT[e.type].break && !(e.type==='hydraulic' && stress<.55)){e.broken=true;continue}const k=MAT[e.type].stiff,wa=a.fixed?0:1,wb=b.fixed?0:1,sum=wa+wb;if(sum){const ox=dx*((d-(e.type==='hydraulic'?e.rest*hydraulicRatio:e.rest))/d)*k/sum,oy=dy*((d-(e.type==='hydraulic'?e.rest*hydraulicRatio:e.rest))/d)*k/sum;if(wa){a.x+=ox;a.y+=oy}if(wb){b.x-=ox;b.y-=oy}}}for(const n of nodes)if(!n.fixed&&n.y<level.water-5)n.y=level.water-5}}
function tick(){if(!running)return;if(paused){raf=requestAnimationFrame(tick);return}const dt=1/60*Number(document.querySelector('#speed').value);phaseClock+=dt;if(document.querySelector('#autoHydro').checked&&splitJoint){if(phaseClock>1&&phaseClock<3){bridgePhase=1;document.querySelector('#hydro').value=65}else if(phaseClock>=3){bridgePhase=0;document.querySelector('#hydro').value=100}}step(dt);const speed=level.vehicle==='truck'?2:2.7;const wheelbase=level.vehicle==='truck'?1.45:1.1;const front=roadAt(car.x+wheelbase/2),rear=roadAt(car.x-wheelbase/2);if(front&&rear){car.y=(front.y+rear.y)/2+.48;car.angle=Math.atan2(front.y-rear.y,wheelbase);car.falling=false}else if(car.x>0.6&&car.x<level.span-.6){car.falling=true}car.x+=dt*speed;if(car.x>=0&&car.x<=level.span){const road=roadAt(car.x);if(!road||car.falling){message='실패: 바퀴 접지 상실 / 차량 추락';stop()}else if(road.y<-1.5){message='실패: 도로 처짐';stop()}}if(car.x>level.span+2){message='성공: 차량 통과';stop()}if(money()>level.budget){message='예산 초과';stop()}frame++;draw();if(running)raf=requestAnimationFrame(tick)}
function stop(){running=false;paused=false;document.querySelector('#test').textContent='▶ 물리 테스트'}
document.querySelector('#test').onclick=()=>{if(running){stop();message='중지';draw();return}resetPhysics();if(!roadContinuous()){message='도로 연결 누락';draw();return}if(money()>level.budget){message='예산 초과';draw();return}running=true;paused=false;car={x:-2,y:.5,falling:false};message='시뮬레이션 중';document.querySelector('#test').textContent='■ 중지';raf=requestAnimationFrame(tick)};
function draw(){if(!level)return;const w=canvas.width,h=canvas.height,d=window.devicePixelRatio||1;ctx.clearRect(0,0,w,h);ctx.fillStyle='#54816d';ctx.fillRect(0,sy(0),Math.max(0,sx(0)),h);ctx.fillRect(sx(level.span),sy(0),w-sx(level.span),h-sy(0));ctx.fillStyle='#367da8';ctx.fillRect(sx(0),sy(level.water),sx(level.span)-sx(0),h-sy(level.water));ctx.strokeStyle='#ffffff23';ctx.lineWidth=d;for(let x=0;x<=level.span;x+=1){ctx.beginPath();ctx.moveTo(sx(x),sy(3));ctx.lineTo(sx(x),sy(-level.depth-4));ctx.stroke()}for(const e of edges){const a=nodes[e.a],b=nodes[e.b],m=MAT[e.type];ctx.strokeStyle=e.broken?'#ed4141':running&&document.querySelector('#stress').checked?(e.stress>.085?'#f04444':e.stress>.04?'#f5ba42':'#6dd69b'):m.color;ctx.lineWidth=m.width*d;ctx.beginPath();ctx.moveTo(sx(a.x),sy(a.y));ctx.lineTo(sx(b.x),sy(b.y));ctx.stroke()}nodes.forEach((n,i)=>{ctx.beginPath();ctx.arc(sx(n.x),sy(n.y),5*d,0,Math.PI*2);ctx.fillStyle=i===pick?'#ffed59':n.fixed?'#ff745e':'#f2f6f8';ctx.fill()});if(car){const x=sx(car.x),y=sy(car.y),s=d;ctx.save();ctx.translate(x,y);ctx.rotate(-(car.angle||0));ctx.fillStyle='#e46a3d';ctx.fillRect(-18*s,-19*s,36*s,14*s);ctx.fillStyle='#203749';for(const off of [-11,11]){ctx.beginPath();ctx.arc(off*s,-4*s,5*s,0,7);ctx.fill()}ctx.restore()}const broken=edges.filter(e=>e.broken).length;info.textContent=`${level.id} | 예산 $${level.budget.toLocaleString()} | 비용 $${money().toLocaleString()} | 부재 ${edges.length} | 파단 ${broken} | 최대 변형률 ${(100*Math.max(0,...edges.map(e=>e.stress))).toFixed(1)}% | 유압 단계 ${bridgePhase} | ${paused?'일시정지':message}`;info.style.color=money()>level.budget?'#ff8888':'#eaf3f8'}
document.querySelector('#save').onclick=()=>{const data={schema:'bridge-lab-v0.7',level:level.id,source:'USER_DESIGN',splitJoint,bridgePhase,nodes:nodes.map(({x,y,fixed})=>({x,y,fixed})),edges:edges.map(({a,b,type,rest})=>({a,b,type,rest}))};const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=`bridge_${level.id}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
document.querySelector('#load').onclick=()=>{const f=document.createElement('input');f.type='file';f.accept='.json';f.onchange=async()=>{try{const v=JSON.parse(await f.files[0].text());if(v.level!==level.id||!Array.isArray(v.nodes)||!Array.isArray(v.edges)||v.nodes.length>500||v.edges.length>1000)throw Error('레벨/형식 불일치');if(v.nodes.some(n=>!Number.isFinite(n.x)||!Number.isFinite(n.y))||v.edges.some(e=>!Number.isInteger(e.a)||!Number.isInteger(e.b)||e.a<0||e.b<0||e.a>=v.nodes.length||e.b>=v.nodes.length||!MAT[e.type]))throw Error('유효하지 않은 데이터');snapshot();splitJoint=!!v.splitJoint;bridgePhase=Number(v.bridgePhase)||0;nodes=v.nodes.map(n=>({...n,px:n.x,py:n.y,fixed:!!n.fixed}));edges=v.edges.map(e=>({a:e.a,b:e.b,type:e.type,rest:length(nodes[e.a],nodes[e.b]),broken:false,stress:0}));message='불러오기 완료';draw()}catch(e){alert(e.message)}};f.click()};document.querySelector('#pause').onclick=()=>{if(running){paused=!paused;draw()}};
document.querySelector('#phase').onclick=()=>{bridgePhase=1-bridgePhase;document.querySelector('#hydro').value=bridgePhase?65:100;message='유압 단계 '+bridgePhase;draw()};document.querySelector('#joint').onclick=()=>{splitJoint=!splitJoint;message='중앙 분리 조인트 '+(splitJoint?'사용':'해제');draw()};document.querySelector('#hydro').oninput=()=>{if(!running)draw()};
document.querySelector('#stress').onchange=draw;
document.querySelector('#png').onclick=()=>{draw();const a=document.createElement('a');a.download=`bridge_${level.id}.png`;a.href=canvas.toDataURL('image/png');a.click()};
document.querySelector('#drawbridge').onclick=()=>{snapshot();nodes=level.anchors.map(([x,y])=>({x,y,px:x,py:y,fixed:true}));edges=[];const mid=level.span/2,segments=Math.max(2,Math.ceil(mid/2));let prev=0;for(let j=1;j<=segments;j++){const x=mid*j/segments;nodes.push({x,y:0,px:x,py:0,fixed:false});addEdge(prev,nodes.length-1,'road');prev=nodes.length-1}let right=nodes.length;nodes.push({x:mid,y:0,px:mid,py:0,fixed:false});prev=right;for(let j=1;j<segments;j++){const x=mid+mid*j/segments;nodes.push({x,y:0,px:x,py:0,fixed:false});addEdge(prev,nodes.length-1,'road');prev=nodes.length-1}addEdge(prev,1,'road');nodes.push({x:mid*.48,y:-2.5,px:mid*.48,py:-2.5,fixed:false});let a=nodes.length-1;addEdge(0,a,'wood');addEdge(a,Math.min(2,nodes.length-2),'hydraulic');nodes.push({x:mid*1.52,y:-2.5,px:mid*1.52,py:-2.5,fixed:false});let b=nodes.length-1;addEdge(1,b,'wood');addEdge(b,right,'hydraulic');message='도개교 구조 예제: 중앙 분리 조인트 버튼으로 간이 개폐, 유압 슬라이더로 길이 제어';draw()};
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();document.querySelector('#undo').click()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();document.querySelector('#redo').click()}else if(e.code==='Space'){e.preventDefault();document.querySelector('#test').click()}else if(e.key==='Escape'){pick=null;draw()}});
window.addEventListener('resize',resize);init();
</script></html>

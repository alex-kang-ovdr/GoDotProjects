<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrawlLabs · 3 vs 3</title><link rel="stylesheet" href="brawllabs-lobby.css"></head><body>
<header><b>BRAWL<span>LABS</span> <small>3 vs 3</small></b><span id="room-label">팀을 만들고 함께 플레이하세요</span><button id="invite" hidden>초대 링크 복사</button><button id="leave" hidden>로비 나가기</button></header>
<form id="join-form"><h1>함께 싸울 팀을 만드세요</h1><p>2명부터 시작합니다. 빈자리는 봇이 채웁니다.</p><label>플레이어 이름 <input id="name" maxlength="24" value="Player" required></label><button id="join">로비 참가</button></form>
<section id="lobby" hidden><div id="countdown" role="status">다른 플레이어를 기다리고 있습니다.</div><div class="teams"><section class="blue"><h2>블루 팀</h2><div id="team-0"></div><button data-team="0">블루 팀 선택</button></section><section class="red"><h2>레드 팀</h2><div id="team-1"></div><button data-team="1">레드 팀 선택</button></section></div><div class="actions"><button id="ready">Ready · 준비</button><button id="spectate">관전하기</button></div><p id="spectators"></p><p class="rules">2명 이상 Ready + 대기 중인 플레이어가 없으면 5초 후 시작합니다.<br>20초 넘게 준비하지 않으면 관전자로 전환됩니다. 경기 중 이탈한 자리는 봇이 이어받습니다.</p></section>
<section id="arena" hidden><iframe id="game" title="BrawlLabs 멀티플레이" allow="autoplay; cross-origin-isolated; fullscreen; gamepad" allowfullscreen></iframe><div id="game-loading">게임을 불러오는 중…</div></section>
<footer id="status" role="status">같은 초대 링크로 참가하면 함께 플레이할 수 있습니다.</footer><script src="brawllabs-lobby.js"></script></body></html>

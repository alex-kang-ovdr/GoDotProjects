<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlayForge · 게임 임베딩 PoC</title>
<link rel="icon" href="/OfficialGodot/vendor/favicon.png">
<link rel="stylesheet" href="embedding-poc.css">
</head>
<body>
<header><a class="brand" href="/OfficialGodot/">◆ PLAYFORGE</a><span class="badge">게임 임베딩 PoC</span><a class="back" href="/OfficialGodot/">Creator로 돌아가기 ↗</a></header>
<section class="project-bar">
  <label for="template">시작 템플릿</label><select id="template" aria-label="시작 템플릿"></select>
  <button id="open">템플릿 열기</button><span id="project-name">프로젝트를 선택하세요</span>
</section>
<nav aria-label="작업 화면">
  <div class="tabs" role="tablist" aria-label="편집 및 실행">
    <button role="tab" id="tab-2d" data-screen="2D" aria-selected="false" disabled>◇ 2D</button>
    <button role="tab" id="tab-3d" data-screen="3D" aria-selected="true" disabled>⬡ 3D</button>
    <button role="tab" id="tab-script" data-screen="Script" aria-selected="false" disabled>⌘ 스크립트</button>
    <button role="tab" id="tab-game" data-screen="Game" aria-selected="false" disabled>▶ 게임</button>
  </div>
  <label class="split-label"><input id="split" type="checkbox"> 나란히 보기</label>
  <button id="restart" disabled>다시 실행</button><button id="stop" disabled>■ 게임 닫기</button>
</nav>
<main id="stage">
  <section id="editor-pane" class="pane">
    <div class="pane-title"><span>편집기</span><small>2D · 3D · 스크립트</small></div>
    <iframe id="poc-editor" title="Godot 편집 화면" allow="cross-origin-isolated; autoplay"></iframe>
    <div id="welcome" class="welcome"><span class="large-icon">◇ ⬡ ▶</span><h1>만들고, 바로 플레이하세요.</h1><p>템플릿을 연 뒤 위의 네 버튼을 눌러보세요.<br>편집 화면을 유지한 채 게임을 같은 페이지에서 실행합니다.</p><p class="hint">2D → 3D → 스크립트 → 게임</p></div>
  </section>
  <section id="game-pane" class="pane" hidden>
    <div class="pane-title"><span>게임</span><small id="game-revision">실행 준비</small></div>
    <iframe id="poc-game" title="임베딩된 게임 실행 화면" allow="cross-origin-isolated; autoplay; fullscreen; gamepad" allowfullscreen></iframe>
    <div id="game-loading" class="welcome" hidden><span class="spinner"></span><h2>게임을 준비하고 있습니다</h2><p>현재 저장된 버전으로 실행 화면을 만듭니다.</p></div>
  </section>
</main>
<footer><span id="poc-status" role="status">템플릿을 열면 화면 전환을 시작할 수 있습니다.</span><span class="footnote">편집기와 게임은 각각 독립된 iframe입니다.</span></footer>
<script src="embedding-poc.js"></script>
</body>
</html>

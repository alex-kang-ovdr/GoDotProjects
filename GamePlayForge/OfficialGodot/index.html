<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlayForge Creator</title>
<link rel="icon" href="/OfficialGodot/vendor/favicon.png">
<link rel="stylesheet" href="platform.css">
<body>
<header>
<b>◆ PLAYFORGE <span>CREATOR</span>
</b>
<button id="home">내 프로젝트</button>
<span id="projectName">새 프로젝트</span>
<span id="connection">연결 중</span>
<button id="test">테스트</button>
<button id="versions">버전 기록</button>
<button id="publish">배포</button>
<a href="/Frontends/">편집기 비교</a>
</header>
<main>
<section id="library">
<p class="eyebrow">BUILD TOGETHER</p>
<h1>아이디어를 플레이 가능한 세계로</h1>
<p>빈 맵에서 시작하거나 예제를 골라 팀과 함께 만드세요.</p>
<h2>시작하기</h2>
<div id="templates" class="cards">
</div>
<h2>내 프로젝트</h2>
<div id="projects" class="cards">
</div>
<p class="muted">현재 서비스는 신뢰된 팀용 PoC입니다. 같은 서버의 링크를 공유해 참여할 수 있습니다.</p>
</section>
<section id="workspace" hidden>
<iframe id="editor" title="PlayForge Godot Editor" allow="cross-origin-isolated; autoplay" >
</iframe>
</section>
<aside id="panel" hidden>
<button id="closePanel">닫기</button>
<h2 id="panelTitle">
</h2>
<div id="panelBody">
</div>
</aside>
</main>
<footer id="status" role="status">프로젝트를 불러오는 중…</footer>
<script src="guided.js">
</script>
<script src="platform.js">
</script>
</body>
</html>

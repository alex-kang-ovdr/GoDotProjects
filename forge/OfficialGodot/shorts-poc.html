<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#FAF8FF">
  <title>PlayForge Shorts · 실험실 (로컬/개발 전용)</title>
  <link rel="icon" href="vendor/favicon.png" type="image/png">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #faf8ff;
      color: #1a1b20;
      font: 14px/1.6 "Plus Jakarta Sans", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    }
    .guard {
      width: 100%;
      max-width: 480px;
      padding: 28px;
      border-radius: 20px;
      background: #ffffff;
      border: 1px solid #dfe1f4;
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
      text-align: center;
    }
    .kicker {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      background: #ede9fe;
      color: #5b21b6;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      margin-bottom: 10px;
    }
    h1 { margin: 0 0 8px; font-size: 20px; }
    p { margin: 0 0 20px; color: #434654; }
    .actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      text-decoration: none;
      font-size: 13.5px;
    }
    .btn.primary { background: #004ac6; color: #ffffff; }
    .btn.ghost { background: #f4f3fa; color: #434654; border: 1px solid #dfe1f4; }
  </style>
</head>
<body>
  <main class="guard" id="guard-box" data-testid="experimental-guard">
    <span class="kicker" id="guard-kicker">CHECKING BUILD MODE</span>
    <h1 id="guard-title">PlayForge 쇼츠 생성기 확인 중…</h1>
    <p id="guard-desc">현재 빌드 환경을 확인하고 있습니다.</p>
    <div class="actions" id="guard-actions" hidden>
      <a class="btn primary" href="shorts-studio.html">✨ PlayForge 쇼츠 생성기 열기 →</a>
      <a class="btn ghost" href="/?view=shorts">허브 쇼츠 피드</a>
    </div>
  </main>
  <script>
    (async function () {
      try {
        const res = await fetch('/api/shorts/config', { credentials: 'same-origin', cache: 'no-store' });
        const cfg = await res.json().catch(() => ({}));
        if (res.ok && cfg.experimentalEnabled === true) {
          const qs = new URLSearchParams(location.search);
          qs.set('lab', '1');
          location.replace('shorts-studio.html?' + qs.toString());
          return;
        }
      } catch {}
      document.getElementById('guard-kicker').textContent = 'PRODUCTION BUILD · EXPERIMENTAL DISABLED';
      document.getElementById('guard-title').textContent = '실험 기능은 로컬·개발(dev) 빌드 전용입니다';
      document.getElementById('guard-desc').textContent = '쇼츠 제작은 PlayForge 내부의 정식 쇼츠 생성기를 이용해 주세요.';
      document.getElementById('guard-actions').hidden = false;
    })();
  </script>
</body>
</html>

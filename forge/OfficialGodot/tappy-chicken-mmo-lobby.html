<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tappy Chicken MMO · Drop-In Multiplayer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="tappy-chicken-mmo-lobby.css">
</head>
<body>
  <header class="mmo-bar">
    <strong class="title">Tappy Chicken MMO</strong>
    <span id="room-label" class="pill">월드 연결 대기</span>
    <span id="presence-label" class="pill muted">주변 0 · 온라인 0</span>
    <div class="bar-spacer"></div>
    <button id="invite" type="button" hidden>초대 링크 복사</button>
    <button id="leave" type="button" hidden>나가기</button>
  </header>

  <form id="join-form" class="join-panel">
    <h1>Tappy Chicken MMO 난입</h1>
    <p>대기실 없이 바로 날아오릅니다. 내 게임 플레이는 그대로 유지되고, 내 주변 플레이어의 조작만 서버 RPC 멀티캐스트로 50% 반투명 고스트로 표시됩니다.</p>
    <div class="join-row">
      <input id="name" type="text" maxlength="24" placeholder="닉네임" value="Player">
      <button id="join" type="submit">바로 난입하기</button>
    </div>
  </form>

  <section id="arena" class="arena" hidden>
    <iframe id="game" title="Tappy Chicken MMO" allow="autoplay; cross-origin-isolated; fullscreen; gamepad" allowfullscreen></iframe>
    <div id="game-loading" class="loading">Tappy Chicken MMO를 불러오는 중…</div>
  </section>

  <footer id="status" role="status">같은 초대 링크로 접속하면 언제든 즉시 난입할 수 있습니다.</footer>
  <script src="tappy-chicken-mmo-lobby.js"></script>
</body>
</html>

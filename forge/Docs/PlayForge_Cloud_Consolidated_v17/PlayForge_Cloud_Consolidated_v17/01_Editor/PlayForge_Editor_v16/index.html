const BUILTIN={"Tappy Chicken": {"name": "Tappy Chicken", "scene": {"name": "Main", "viewport": {"width": 480, "height": 640}, "actors": [{"id": "chicken", "class": "Actor", "components": ["Sprite", "CircleCollision", "ScriptBehaviour"], "script": "Scripts/Game.gd", "position": [135, 290]}, {"id": "ground", "class": "StaticActor", "components": ["Sprite", "BoxCollision"], "position": [240, 605]}, {"id": "pipeSpawner", "class": "Actor", "components": ["ScriptBehaviour"], "position": [510, 0]}, {"id": "scoreUI", "class": "UIActor", "components": ["Text"], "locKey": "Tappy.Score"}]}, "scripts": {"Scripts/Game.gd": "# Tappy Chicken · PlayForge GDScript gameplay reference\n# Engine API contract (World, Input, Events, UI, Audio) is proposed, not executed by the HTML preview.\nextends Node\n\nconst PRESETS := {\n\t\"Easy\": {\"pipe_speed\": 125.0, \"pipe_gap\": 212.0, \"spawn_interval\": 1.9},\n\t\"Normal\": {\"pipe_speed\": 170.0, \"pipe_gap\": 174.0, \"spawn_interval\": 1.55},\n\t\"Hard\": {\"pipe_speed\": 225.0, \"pipe_gap\": 145.0, \"spawn_interval\": 1.32},\n}\n\nvar difficulty := \"Normal\"\nvar score := 0\nvar state := \"Ready\"\nvar gravity := 1050.0\nvar flap_velocity := -345.0\nvar pipe_speed := 170.0\nvar pipe_gap := 174.0\nvar spawn_interval := 1.55\nvar bird := {}\nvar pipes: Array = []\nvar spawn_in := 0.0\n\nfunc set_difficulty(preset_name: String) -> bool:\n\tif not PRESETS.has(preset_name):\n\t\treturn false\n\tdifficulty = preset_name\n\tfor key in PRESETS[preset_name]:\n\t\tset(key, PRESETS[preset_name][key])\n\treturn true\n\nfunc start() -> void:\n\tscore = 0\n\tstate = \"Playing\"\n\tbird = {\"x\": 135.0, \"y\": 290.0, \"vy\": 0.0, \"radius\": 17.0}\n\tpipes = []\n\tspawn_in = 0.9\n\tEvents.emit(\"GameStarted\")\n\nfunc flap() -> void:\n\tif state == \"Ready\" or state == \"GameOver\":\n\t\tstart()\n\tif state != \"Playing\":\n\t\treturn\n\tbird.vy = flap_velocity\n\tAudio.play(\"sfx.flap\")\n\nfunc spawn_pipe() -> void:\n\tvar center := 175.0 + randf() * 220.0\n\tpipes.append({\"x\": 510.0, \"top\": center - pipe_gap / 2.0,\n\t\t\"bottom\": center + pipe_gap / 2.0, \"passed\": false})\n\nstatic func circle_intersects_rect(x: float, y: float, r: float, rx: float, ry: float, rw: float, rh: float) -> bool:\n\tvar cx := clampf(x, rx, rx + rw)\n\tvar cy := clampf(y, ry, ry + rh)\n\treturn (x - cx) ** 2 + (y - cy) ** 2 < r * r\n\nfunc tick(dt: float) -> void:\n\tif state != \"Playing\":\n\t\treturn\n\tdt = minf(dt, 0.04)\n\tbird.vy += gravity * dt\n\tbird.y += bird.vy * dt\n\tspawn_in -= dt\n\tif spawn_in <= 0.0:\n\t\tspawn_pipe()\n\t\tspawn_in = spawn_interval\n\tif bird.y - bird.radius < 0.0 or bird.y + bird.radius >= 570.0:\n\t\tgame_over()\n\t\treturn\n\tfor i in range(pipes.size() - 1, -1, -1):\n\t\tvar p: Dictionary = pipes[i]\n\t\tp.x -= pipe_speed * dt\n\t\tif not p.passed and p.x + 78.0 < bird.x:\n\t\t\tp.passed = true\n\t\t\tscore += 1\n\t\t\tEvents.emit(\"ScoreChanged\", score)\n\t\tif circle_intersects_rect(bird.x, bird.y, bird.radius - 4.0, p.x, 0.0, 78.0, p.top) \t\t\t\tor circle_intersects_rect(bird.x, bird.y, bird.radius - 4.0, p.x, p.bottom, 78.0, 570.0 - p.bottom):\n\t\t\tgame_over()\n\t\t\treturn\n\t\tif p.x < -78.0:\n\t\t\tpipes.remove_at(i)\n\nfunc game_over() -> void:\n\tif state != \"Playing\":\n\t\treturn\n\tstate = \"GameOver\"\n\tEvents.emit(\"GameOver\", score)\n"}, "assets": ["Assets/chicken.png", "Assets/pipe.png"], "settings": {"gravity": 1050, "flap": 345, "speed": 170, "gap": 174, "interval": 1.55, "pipeWidth": 78, "seed": 12345}, "preview": "TappyChicken/index.html"}, "Empty Sandbox": {"name": "Empty Sandbox", "scene": {"name": "Main", "viewport": {"width": 960, "height": 540}, "actors": [{"id": "camera", "class": "CameraActor", "position": [0, 2, -8], "components": ["Camera"]}, {"id": "light", "class": "LightActor", "position": [1, 5, 2], "components": ["Light"]}, {"id": "cube", "class": "StaticActor", "position": [0, 0, 0], "components": ["MeshRenderer", "BoxCollision"], "properties function uniquePrefabName(base){let id=base,n=2;while(prefabs()[id])id=base+'_'+n++;return id}
function prefabSnapshot(a){const x=deep(a);delete x.id;delete x.prefab;delete x._pfBase;delete x._pfOverrides;delete x._variantParent;delete x._variantOverrides;return x}
function createPrefabFromSelection(){const a=actor();if(!a)return;const name=uniquePrefabName(a.id.replace(/[^A-Za-z0-9_-]/g,'_'));mutate('Create prefab '+name,()=>{prefabs()[name]=prefabSnapshot(a);a.prefab=name;a._pfBase=deep(prefabs()[name])});notify('Prefab created: '+name)}
function instantiatePrefab(name){const data=prefabs()[name];if(!data)return;mutate('Instantiate prefab '+name,()=>{const id=uniqueActorId(name),a=mergePrefab(data,{},id,name);a.position=(a.position||[0,0,0]).map((v,i)=>i===0?v+1:v);actors().push(a);selected=a.id});notify('Prefab instance created (offset is an override)')}
function applyPrefabInstance(){const a=actor();if(!a?.prefab||!prefabs()[a.prefab])return;const name=a.prefab;mutate('Apply prefab '+name,()=>{const old=deep(prefabs()[name]),next=prefabSnapshot(a);if(old._variantParent){const parent=prefabs()[old._variantParent];if(!parent){notify('Missing variant parent');return}const pf=flattenPrefab(parent),nv=flattenPrefab(next),overrides={};for(const [path,val] of Object.entries(nv))if(!equal(val,pf[path]))overrides[path]=deep(val);next._variantParent=old._variantParent;next._variantOverrides=overrides}prefabs()[name]=next;syncPrefabInstances(name,old,next,a.id);propagateVariants(name)});notify('Prefab applied; inherited fields propagated, other overrides preserved')}
function revertPrefabInstance(){const a=actor();if(!a?.prefab||!prefabs()[a.prefab])return;const name=a.prefab;mutate('Revert prefab '+name,()=>{const original=mergePrefab(prefabs()[name],{},a.id,name);Object.keys(a).forEach(k=>delete a[k]);Object.assign(a,original)});notify('All instance overrides reverted')}
function duplicateSelected(){const a=actor();if(!a)return;mutate('Duplicate '+a.id,()=>{const copy=deep(a);copy.id=uniqueActorId(a.id+'_copy');copy.position=(copy.position||[0,0,0]).map((v,i)=>i===0?v+1:v);actors().push(copy);selected=copy.id})}

$('project').onchange=e=>{projectName=e.target.value;selected=actors()[0]?.id||'';playing=false;tab='scene';render()};$('filter').oninput=render;$('undo').onclick=undo;$('redo').onclick=redo;$('play').onclick=()=>{playing=!playing;tab='game';render();notify(playing?'PIE preview started':'PIE stopped')};$('addActor').onclick=()=>{let id='Actor'+(actors().length+1);while(actors().some(a=>a.id===id))id+='x';mutate('Create '+id,()=>{actors().push({id,class:'Actor',position:[0,0,0],components:[],properties:{}});selected=id})};$('tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};$('bottomtabs').onclick=e=>{const b=e.target.closest('[data-log]');if(b){bottom=b.dataset.log;render()}};$('tree').onclick=e=>{const b=e.target.closest('[data-actor]');if(b){selected=b.dataset.actor;render()}};$('files').onclick=e=>{const b=e.target.closest('[data-file]');if(!b)return;const f=b.dataset.file;if(f.endsWith('.gd')){currentFile=f;tab='script'}else tab='settings';render()};$('toolbar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.mode){viewMode=b.dataset.mode;renderView()}else if(b.dataset.tool){toolMode=b.dataset.tool;renderView()}else if(b.id==='duplicateActor'){duplicateSelected()}else if(b.id==='resetCamera'){sceneZoom=1;orbitYaw=.65;orbitPitch=.48;scenePan=[0,0];renderView()}});$('toolbar').addEventListener('change',e=>{if(e.target.id==='snapToggle'){snapEnabled=e.target.checked;logs.unshift('Snap '+(snapEnabled?'enabled':'disabled'));renderLog()}if(e.target.id==='snapStep'){snapStep=Number(e.target.value)}});
document.addEventListener('keydown',e=>{if(!['scene','split'].includes(tab)||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;const key=e.key.toLowerCase();if(e.ctrlKey&&key==='d'){e.preventDefault();duplicateSelected();return}if({w:'move',e:'rotate',r:'scale'}[key]){toolMode={w:'move',e:'rotate',r:'scale'}[key];renderView()}});$('view').addEventListener('change',e=>{if(e.target.id==='scriptSelect'){currentFile=e.target.value;renderView()}});$('view').addEventListener('click',e=>{if(e.target.dataset.componentAction){componentMutation(e.target.dataset.componentAction,e.target.dataset.componentName);return}if(e.target.id==='createPrefab')createPrefabFromSelection();if(e.target.id==='openPrefabs'){tab='prefabs';render()}if(e.target.id==='diffRevertAll')revertPrefabInstance();if(e.target.id==='diffApplyAll')applyPrefabInstance();if(e.target.id==='diffValidate')validatePrefabDefinitions();if(e.target.dataset.diffRevert)resetOverride(e.target.dataset.diffRevert);if(e.target.dataset.diffApply)applySingleOverride(e.target.dataset.diffApply);if(e.target.id==='diffExport'){const a=actor();if(a)downloadJson('prefab-diff-'+a.id+'.json',{actor:a.id,prefab:a.prefab,changes:diffEntries(a).filter(x=>x.changed)})}if(e.target.dataset.instantiate)instantiatePrefab(e.target.dataset.instantiate);if(e.target.dataset.variant)createPrefabVariant(e.target.dataset.variant);if(e.target.id==='validatePrefabs')validatePrefabDefinitions();if(e.target.dataset.deleteprefab){const name=e.target.dataset.deleteprefab;variantDescendants(name).length?(notify('Remove child variants first')):mutate('Remove prefab definition '+name,()=>delete prefabs()[name])}if(e.target.id==='newScript'){let name=prompt('New GDScript file path','Scripts/NewScript.gd');if(name&&/^Scripts\/[A-Za-z0-9_/-]+\.gd$/.test(name)&&!cur().scripts[name]){mutate('Create '+name,()=>cur().scripts[name]='return {}\n');currentFile=name}}if(e.target.id==='applyJson'){try{const data=JSON.parse($('json').value);if(!data||typeof data!=='object'||Array.isArray(data))throw Error('Expected object');mutate('Update project data',()=>cur().settings=data);notify('Project data updated')}catch(err){notify('Invalid JSON: '+err.message)}}if(e.target.dataset.asset){mutate('Reference asset '+e.target.dataset.asset,()=>{cur().assets??=[];if(!cur().assets.includes(e.target.dataset.asset))cur().assets.push(e.target.dataset.asset)});notify('Asset reference added to project data')}if(e.target.id==='plan'){const promptText=$('prompt').value.trim();if(!promptText)return;const name=actor()?.id||'Actor';$('proposal').innerHTML=`<div class="card"><b>Mock ChangeSet</b><p>Add a generic Property to ${esc(name)}. Prompt: ${esc(promptText)}</p><button id="acceptPlan">Apply change</button></div>`}if(e.target.id==='acceptPlan'){const a=actor();if(a)mutate('Apply simulated AI ChangeSet',()=>{a.properties??={};a.properties.aiGenerated=true});notify('Mock ChangeSet applied')}});
$('export').onclick=()=>{const data={project:cur(),editorVersion:15};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=projectName.replace(/\s+/g,'_')+'_project.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();

for(const el of document.querySelectorAll('[data-resize]')){
 el.addEventListener('pointerdown',e=>{if(window.innerWidth<950)return;e.preventDefault();el.setPointerCapture(e.pointerId);el.classList.add('dragging');const side=el.dataset.resize;const move=ev=>{if(side==='left')document.documentElement.style.setProperty('--left-width',Math.max(170,Math.min(420,ev.clientX))+'px');if(side==='right')document.documentElement.style.setProperty('--right-width',Math.max(230,Math.min(480,innerWidth-ev.clientX))+'px');if(side==='bottom')document.documentElement.style.setProperty('--bottom-height',Math.max(100,Math.min(380,innerHeight-ev.clientY))+'px');if(['scene','split'].includes(tab))requestAnimationFrame(drawScene)};const stop=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',stop);el.removeEventListener('pointercancel',stop);el.classList.remove('dragging')};el.addEventListener('pointermove',move);el.addEventListener('pointerup',stop);el.addEventListener('pointercancel',stop)})
}
window.addEventListener('resize',()=>{if(['scene','split'].includes(tab))drawScene()});
</script></body></html>

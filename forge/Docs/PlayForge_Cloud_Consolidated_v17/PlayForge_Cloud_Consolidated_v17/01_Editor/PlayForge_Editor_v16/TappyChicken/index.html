<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tappy Chicken · PlayForge Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#102436;color:#e8f8ff;font:14px system-ui;display:grid;place-items:center;min-height:100dvh}.wrap{width:min(100%,650px);padding:12px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;flex-wrap:wrap}button{border:1px solid #47718e;background:#1d4662;color:white;border-radius:7px;padding:8px 12px;cursor:pointer}button:hover{background:#28628a}select{background:#1d4662;color:white;border:1px solid #47718e;padding:7px;border-radius:6px}label{display:flex;align-items:center;gap:6px}.stats{align-items:center}.stats button{padding:5px 9px}canvas{width:100%;aspect-ratio:3/4;max-height:70vh;object-fit:contain;display:block;border-radius:13px;border:2px solid #4e90ac;touch-action:manipulation;background:#8dd8ed}.note{font-size:12px;color:#abcbdc;line-height:1.7}.stats{display:flex;gap:12px;flex-wrap:wrap}.stats b{color:#ffe18b}</style><div class="wrap"><div class="top"><div><strong>🐔 Tappy Chicken</strong> <small>Web preview</small></div><div><button id="restart">↻ Restart</button> <button id="mute">🔊 Sound</button></div></div><div class="stats"><label>Difficulty <select id="difficulty"><option value="easy">Easy</option><option value="normal" selected>Normal</option><option value="hard">Hard</option></select></label><button id="pause">⏸ Pause</button><label><input type="checkbox" id="debug"> Debug</label><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span><span>Status <b id="status">Ready</b></span></div><canvas id="game" width="480" height="640" aria-label="Tappy Chicken game canvas"></canvas><p class="note">Space / ↑ / 화면 터치: 점프 · P: 일시정지 · 장애물을 피하고 최대한 오래 날아보세요. 이 웹 버전은 프로젝트의 게임 로직을 JavaScript로 구현한 독립 실행형 프리뷰입니다.</p></div><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),statusEl=document.getElementById('status');let best=0;try{best=+(localStorage.getItem('pf_tappy_best')||0)}catch{}bestEl.textContent=best;let state='ready',bird,obstacles,score,elapsed,spawnTimer,last=0,muted=false,particles=[],difficulty='normal',debug=false,seed=12345,pausedFrom='playing';const W=480,H=640,ground=570;let gravity=1050,flap=-345,pipeWidth=78;const profiles={easy:{speed:125,gap:212,interval:1.9},normal:{speed:170,gap:174,interval:1.55},hard:{speed:225,gap:145,interval:1.32}};let overrides={};const config=()=>({...profiles[difficulty],...overrides});function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;}let audio;function sound(freq=500,dur=.07){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.6,audio.currentTime+dur);g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch{}}function emit(type,extra={}){parent.postMessage({source:'playforge-tappy',type,score,...extra},'*')}function reset(){seed=Number(overrides.seed)||12345;bird={x:135,y:290,vy:0,r:17,angle:0};obstacles=[];particles=[];score=0;elapsed=0;spawnTimer=.9;state='ready';scoreEl.textContent='0';statusEl.textContent='Ready';emit('game_reset')}function jump(){if(state==='paused')return;if(state==='over'){reset();state='playing';emit('game_start')}else if(state==='ready'){state='playing';emit('game_start')}bird.vy=flap;sound(650,.07);statusEl.textContent='Playing'}function end(){if(state!=='playing')return;state='over';statusEl.textContent='Game Over';sound(180,.25);if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('pf_tappy_best',best)}catch{}}emit('game_over',{best})}function spawn(){const center=175+rand()*220;obstacles.push({x:W+30,top:center-config().gap/2,bottom:center+config().gap/2,passed:false})}function update(dt){elapsed+=dt;if(state!=='playing')return;bird.vy+=gravity*dt;bird.y+=bird.vy*dt;bird.angle=Math.max(-.55,Math.min(1.1,bird.vy/450));spawnTimer-=dt;if(spawnTimer<=0){spawn();spawnTimer=config().interval}for(const p of obstacles){p.x-=config().speed*dt;if(!p.passed&&p.x+pipeWidth<bird.x){p.passed=true;score++;scoreEl.textContent=score;sound(880,.12);emit('score',{score})}if(bird.x+bird.r-4>p.x&&bird.x-bird.r+4<p.x+pipeWidth&&(bird.y-bird.r+4<p.top||bird.y+bird.r-4>p.bottom))end()}obstacles=obstacles.filter(p=>p.x+pipeWidth>-10);if(bird.y+bird.r>=ground||bird.y-bird.r<0)end()}function cloud(x,y,s){ctx.fillStyle='#e7faffaa';for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(x+i*24*s,y-(i%2)*9*s,18*s,0,Math.PI*2);ctx.fill()}}function draw(){const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#70c6e9');grad.addColorStop(1,'#d4f5df');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);cloud(80-(elapsed*10)%550,105,1);cloud(300-(elapsed*7)%550,220,.8);ctx.fillStyle='#a4d2a0';for(let i=0;i<8;i++){ctx.beginPath();ctx.arc(i*75,570,85,Math.PI,0);ctx.fill()}for(const p of obstacles){ctx.fillStyle='#39895b';ctx.fillRect(p.x,0,pipeWidth,p.top);ctx.fillRect(p.x,p.bottom,pipeWidth,ground-p.bottom);ctx.fillStyle='#2e6c49';ctx.fillRect(p.x-5,p.top-22,pipeWidth+10,22);ctx.fillRect(p.x-5,p.bottom,pipeWidth+10,22);ctx.fillStyle='#a5e7a1';ctx.fillRect(p.x+9,0,9,p.top-22);ctx.fillRect(p.x+9,p.bottom+22,9,ground-p.bottom-22)}ctx.fillStyle='#d7b36e';ctx.fillRect(0,ground,W,H-ground);ctx.fillStyle='#72a963';ctx.fillRect(0,ground,W,13);ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.angle);ctx.fillStyle='#f6c54e';ctx.beginPath();ctx.ellipse(0,0,20,17,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f3a844';ctx.beginPath();ctx.ellipse(-9,6,12,8,-.3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f78e44';ctx.beginPath();ctx.moveTo(16,1);ctx.lineTo(32,7);ctx.lineTo(16,12);ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.arc(9,-7,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#172b36';ctx.beginPath();ctx.arc(11,-7,2.7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d94d4a';ctx.beginPath();ctx.moveTo(-5,-15);ctx.lineTo(1,-26);ctx.lineTo(8,-15);ctx.fill();ctx.restore();ctx.textAlign='center';ctx.fillStyle='#fff';ctx.strokeStyle='#24566c';ctx.lineWidth=5;ctx.font='bold 52px system-ui';ctx.strokeText(score,W/2,72);ctx.fillText(score,W/2,72);if(debug){ctx.strokeStyle='#ff3366';ctx.lineWidth=2;ctx.beginPath();ctx.arc(bird.x,bird.y,bird.r-4,0,Math.PI*2);ctx.stroke();ctx.font='13px monospace';ctx.fillStyle='#102436';ctx.fillText('vy '+bird.vy.toFixed(0)+' | pipes '+obstacles.length+' | '+difficulty,240,112)}if(state!=='playing'){ctx.fillStyle='#09273cb9';ctx.fillRect(48,237,384,154);ctx.fillStyle='#fff';ctx.font='bold 29px system-ui';ctx.fillText(state==='ready'?'TAPPY CHICKEN':state==='paused'?'PAUSED':'GAME OVER',W/2,288);ctx.font='18px system-ui';ctx.fillText(state==='ready'?'Tap / Space to flap':state==='paused'?'Press P to resume':'Tap / Space to retry',W/2,332);if(state==='over'){ctx.font='15px system-ui';ctx.fillText('Score '+score+' · Best '+best,W/2,365)}}}function loop(t){const dt=Math.min((t-last)/1000||0,.04);last=t;update(dt);draw();requestAnimationFrame(loop)}c.addEventListener('pointerdown',e=>{e.preventDefault();jump()});window.addEventListener('keydown',e=>{if(e.code==='KeyP'&&!e.repeat){togglePause();return}if(['Space','ArrowUp'].includes(e.code)&&!e.repeat){e.preventDefault();jump()}});function togglePause(){if(state==='playing'){state='paused';emit('game_pause')}else if(state==='paused'){state='playing';emit('game_resume')}statusEl.textContent=state==='paused'?'Paused':state==='playing'?'Playing':statusEl.textContent;document.getElementById('pause').textContent=state==='paused'?'▶ Resume':'⏸ Pause'}document.getElementById('pause').onclick=togglePause;document.getElementById('difficulty').onchange=e=>{difficulty=e.target.value;reset();emit('difficulty_change',{difficulty})};document.getElementById('debug').onchange=e=>{debug=e.target.checked};window.addEventListener('message',e=>{if(!e.data||e.data.source!=='playforge-editor')return;const m=e.data;if(m.action==='restart')reset();if(m.action==='pause')togglePause();if(m.action==='difficulty'&&profiles[m.value]){difficulty=m.value;document.getElementById('difficulty').value=difficulty;reset()}if(m.action==='flap')jump();if(m.action==='settingsRestart'&&m.value){const v=m.value;gravity=Math.max(0,Math.min(3000,Number(v.gravity)||1050));flap=-Math.max(50,Math.min(1000,Number(v.flap)||345));pipeWidth=Math.max(25,Math.min(160,Number(v.pipeWidth)||78));overrides={speed:Math.max(40,Math.min(450,Number(v.speed)||170)),gap:Math.max(95,Math.min(350,Number(v.gap)||174)),interval:Math.max(.5,Math.min(4,Number(v.interval)||1.55)),seed:Number(v.seed)||12345};reset();emit('settings_applied',{settings:v})}if(m.action==='settingsLive'&&m.value){const v=m.value;const clamp=(n,a,b,old)=>Number.isFinite(Number(n))?Math.max(a,Math.min(b,Number(n))):old;gravity=clamp(v.gravity,0,3000,gravity);flap=-clamp(v.flap,50,1000,-flap);pipeWidth=clamp(v.pipeWidth,25,160,pipeWidth);overrides={speed:clamp(v.speed,40,450,overrides?.speed||170),gap:clamp(v.gap,95,350,overrides?.gap||174),interval:clamp(v.interval,.5,4,overrides?.interval||1.55),seed:clamp(v.seed,1,999999,overrides?.seed||12345)};emit('settings_live_applied',{settings:v})}if(m.action==='inspect'){emit('telemetry',{state,velocity:Math.round(bird.vy),birdY:Math.round(bird.y),obstacles:obstacles.length,elapsed:+elapsed.toFixed(1),difficulty})}});document.getElementById('restart').onclick=()=>reset();document.getElementById('mute').onclick=()=>{muted=!muted;document.getElementById('mute').textContent=muted?'🔇 Muted':'🔊 Sound'};reset();requestAnimationFrame(loop)})();
</script></html>
